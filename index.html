,"answer_ox":"O"},{"id":"bkbfdab083","cat":"유통안전","type":"선다형","q":"물리적 소독제인 스팀과 온수의 사용 조건을 바르게 제시한 것은?","explain":"스팀은 100℃ 물 30분(가장 멀리 있는 곳까지 온도가 유지되어야 함), 온수는 80~100℃에서 30분 또는 70~80℃에서 2시간이다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":260,"diff":3,"origin":"new","kind":"mcq","opts":["스팀 100℃ 물 30분 / 온수 80~100℃ 30분(70~80℃는 2시간)","스팀 80℃ 물 30분 / 온수 100℃ 30분","스팀 100℃ 물 2시간 / 온수 70~80℃ 30분","스팀 100℃ 물 15분 / 온수 60~70℃ 15분","스팀 121℃ 15분 / 온수 80℃ 1시간"],"answer":0},{"id":"bkc91b0e53","cat":"유통안전","type":"숫자기준","q":"화학적 소독제인 알코올의 사용 농도와 시간으로 옳은 것은?","explain":"아이소프로필알코올 60~70%/15분, 에탄올 60~95%/15분이다. 알코올은 세척이 불필요하고 빠르게 건조되며 단독 사용이 가능하지만, 세균 포자에 효과가 없고 화재·폭발 위험이 있다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":260,"diff":3,"origin":"new","kind":"mcq","opts":["아이소프로필알코올 60~70% / 15분, 에탄올 60~95% / 15분","아이소프로필알코올 60~95% / 15분, 에탄올 60~70% / 15분","아이소프로필알코올 70~95% / 30분, 에탄올 60~70% / 30분","아이소프로필알코올 60~70% / 30분, 에탄올 60~95% / 30분","둘 다 70% / 15분"],"answer":0,"compare":[["아이소프로필알코올","60~70% / 15분"],["에탄올","60~95% / 15분"]]},{"id":"bk63971db0","cat":"유통안전","type":"선다형","q":"염소 유도체(치아염소산나트륨, 치아염소산칼슘) 소독제의 사용농도 및 시간으로 옳은 것은?","explain":"염소 유도체는 200ppm/30분이다. 1:200 용액은 페놀·염소화페놀의 사용 조건이며, 4급 암모늄화합물도 200ppm(제조사 추천 농도)을 쓴다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":260,"diff":3,"origin":"new","kind":"mcq","opts":["100ppm / 15분","200ppm / 30분","500ppm / 30분","1:200 용액 / 30분","200ppm / 15분"],"answer":1,"compare":[["염소 유도체(치아염소산나트륨, 치아염소산칼슘)","200ppm / 30분"],["페놀, 염소화페놀","1 : 200 용액"]]},{"id":"bk5ef09940","cat":"유통안전","type":"선다형","q":"4급 암모늄 계면활성제 소독제의 특징으로 옳지 않은 것은?","explain":"4급 암모늄화합물은 '중성/약알칼리에서 가장 효과적'이다. 경수·음이온 세정제에 의해 불활성화되는 것도 단점이다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":260,"diff":3,"origin":"new","kind":"mcq","opts":["세정 작용이 있고 우수한 효과를 가진다.","부식성이 없고 물에 용해되어 단독 사용이 가능하다.","무향이며 높은 안정성을 가진다.","포자에 효과가 없다.","산성 조건에서 가장 효과적이다."],"answer":4},{"id":"bkb79b185c","cat":"유통안전","type":"선다형","q":"페놀·염소화페놀 소독제(1:200 용액)의 단점으로 7fe","cat":"유통안전","type":"보기매칭","q":"출하를 위해 제품의 포장 및 첨부문서에 표시공정 등을 포함한 모든 제조공정이 완료된 화장품을 말한다. 해당되는 용어를 보기에서 고르시오.","explain":"교재 인쇄 정답 ㉠ 완제품. 모든 제조공정(표시공정 포함)이 끝나 출하 가능한 상태를 완제품이라 한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":1,"origin":"book","kind":"mcq","opts":["완제품","반제품","벌크제품"],"answer":0},{"id":"bk82fefc5d","cat":"유통안전","type":"보기매칭","q":"충전(1차포장) 이전의 제조 단계까지 끝낸 제품을 말한다. 해당되는 용어를 보기에서 고르시오.","explain":"교재 인쇄 정답 ㉢ 벌크제품. 반제품(제조공정이 아직 끝나지 않은 것)과 혼동하기 쉬우니 '충전 직전까지 끝난 것 = 벌크제품'으로 기억한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":2,"origin":"book","kind":"mcq","opts":["완제품","반제품","벌크제품"],"answer":2},{"id":"bk2ef96c48","cat":"유통안전","type":"보기매칭","q":"제조공정 단계에 있는 것으로서 필요한 제조공정이 끝나지 않은 것을 말한다. 해당되는 용어를 보기에서 고르시오.","explain":"교재 인쇄 정답 ㉡ 반제품. 아직 제조공정이 진행 중인 상태다. 벌크제품은 제조공정은 끝났고 충전만 남은 상태라는 점에서 다르다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":2,"origin":"book","kind":"mcq","opts":["완제품","반제품","벌크제품"],"answer":1},{"id":"bk43e3809f","cat":"유통안전","type":"O/X","q":"3등급 청정도 대상시설은 1등급 청정도 대상시설보다 공기압이 낮아야 한다.","explain":"교재 인쇄 정답 O. 청정도 등급이 높은(숫자가 작은) 구역일수록 실압을 높게 유지하여 오염된 공기가 청정 구역으로 유입되지 않게 한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":2,"origin":"book","kind":"ox","answer_ox":"O"},{"id":"bk30ec5cbe","cat":"유통안전","type":"O/X","q":"연마 세제 사용 시, 표면의 과도한 손상 방지를 위해 물에 희석하여 사용하며, 잘 헹구어 준다.","explain":"교재 인쇄 정답 X — '희석 없이 소량의 물을 사용'한다. 연마 세제는 희석하지 않고 소량의 물과 함께 사용한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":3,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bka15b7069","cat":"유통안전","type":"O/X","q":"작업소 소독제 사용 시, 자주 소독약을 변경하면 미생물이 예기치 않게 번식할 수 있으므로 고정하여 사용하는 것이 바람직하다.","explain":"교재 인쇄 정답 X — '주기적 변경 권장'. 한 가지 소독제를 계속 쓰면 내성 미생물이 생길 수 있으므로 소독제를 주기적으로 바꾸어 사용한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":262,"diff":2,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk8e4acc17","cat":"유통안전","type":"선다형","q":"미관련 직원(방문객, 위생교육 미이수자 등)의 위생관리 사항으로 적절하지 않은 것은?","explain":"불가피한 경우에는 반드시 안내자가 동행해야 하며 안내자 없이는 접근을 허용할 수 없다. 나머지는 모두 교재의 미관련 직원 위생관리 항목 그대로다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":263,"diff":2,"origin":"new","kind":"mcq","opts":["화장품 제조, 관리 및 보관 구역 내에 들어가지 않아야 한다.","불가피하게 출입이 필요한 경우라도 안내자 없이 단독으로 출입할 수 있다.","출입 전 직원 위생에 대한 교육 및 복장 규정에 따르게 하고 필요한 보호 설비를 갖추어야 한다.","혼자서 돌아다니거나 설비 등을 만지지 않도록 통제해야 한다.","소속, 성명, 방문/작업 목적, 입퇴장 시간, 동행자 등을 기록서에 기록하고 문서로 남겨야 한다."],"answer":1},{"id":"bkfd4c717a","cat":"유통안전","type":"빈칸채우기","q":"명백한 질병 또는 노출된 피부에 상처가 있는 직원은 증상이 회복되거나 화장품의 품질에 영향을 주지 않는다는 (  )의 소견이 있기 전까지는 화장품과 직접적으로 접촉되지 않도록 격리한다. 괄호에 들어갈 말은?","explain":"질병·상처가 있는 직원은 '의사의 소견'이 나오기 전까지 화장품과 직접 접촉하지 않도록 격리한다. 관리자나 책임판매관리자의 판단이 아니라는 점이 포인트다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":263,"diff":2,"origin":"new","kind":"short","ans":["의사","의사의 소견","의사 소견"]},{"id":"bk8599c05d","cat":"유통안전","type":"단답형","q":"작업 전에 손 세정을 실시하고 작업소 입실 직전에 손 소독을 위해 사용하도록 규정된 기구는 무엇인가?","explain":"작업 전 손 세정 후 작업소 입실 전에 분무식 소독기를 사용하여 손을 소독하고 작업한다. 입실 전 수세 설비가 비치된 장소에서 손 세정 후 입실하는 절차와 함께 기억한다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":263,"diff":2,"origin":"new","kind":"short","ans":["분무식 소독기","분무식소독기","분무식 손 소독기"]},{"id":"bkf03014f6","cat":"유통안전","type":"선다형","q":"작업자의 손 세정 및 소독에 관한 설명으로 옳지 않은 것은?","explain":"손 세정은 작업 '전'에 실시하고 작업소 입실 전 분무식 소독기로 소독한 뒤 작업한다. 나머지는 모두 교재의 '손 세정 및 소독' 항목 그대로다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":263,"diff":1,"origin":"new","kind":"mcq","opts":["작업 전에 손 세정을 실시하고 작업소 입실 전 분무식 소독기를 사용하여 손을 소독한다.","운동 등에 의한 오염, 땀, 먼지 등의 제거를 위하여 입실 전 수세 설비가 비치된 장소에서 손 세정 후 입실한다.","화장실을 이용하는 작업원은 화장실 퇴실 시 손을 세정하고 작업실에 입실한다.","액체세제는 고형의 비누 대비 사용 편리성, 빠른 거품 형성과 풍부한 거품 등으로 사용률이 증가하고 있다.","손 세정은 작업 종료 후에만 실시하면 되고 입실 전에는 생략할 수 있다."],"answer":4},{"id":"bkeff1964b","cat":"유통안전","type":"선다형","q":"손이 다른 신체 부위와 다른 점에 대한 설명으로 옳지 않은 것은?","explain":"손바닥에는 피지샘이 '없다'는 것이 교재의 서술이다. 그 결과 손의 세정 대상은 내인성 피지가 아니라 외인성 오염물이 된다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":264,"diff":2,"origin":"new","kind":"mcq","opts":["끊임없이 오염된다.","사회적 활동에 따라 미생물을 포함한 각종 오염물에 오염된다.","오염물이 피부에 대해서 자극을 발현한다.","손바닥에는 피지샘이 발달되어 있다.","외인성의 오염물이 세정의 대상이 된다."],"answer":3},{"id":"bk9d619dd3","cat":"유통안전","type":"선다형","q":"작업복 기준에 관한 설명 중 교재의 내용과 어긋나는 것은?","explain":"작업복은 작업 시 섬유질의 발생이 '적고' 먼지의 부착성이 '적어야' 하며 세탁이 용이해야 한다. 섬유질과 먼지는 그 자체가 이물 오염원이기 때문이다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":264,"diff":2,"origin":"new","kind":"mcq","opts":["땀의 흡수 및 방출이 용이하고 가벼워야 한다.","보온성이 적당하여 작업에 불편이 없어야 한다.","작업 시 섬유질의 발생이 많고 먼지의 부착성이 높아야 한다.","내구성이 우수하여야 한다.","착용 시 내의가 노출되지 않아야 하며 단추 및 모털이 서있는 의류는 착용하지 않는다."],"answer":2},{"id":"bk7b5b0d6e","cat":"유통안전","type":"빈칸채우기","q":"제조실 근무자의 작업화는 등산화 형식의 안전화이면서 신발 바닥이 (  ) 코팅이 되어 있는 것을 사용한다. 괄호에 들어갈 재질은?","explain":"제조실 근무자는 등산화 형식의 안전화 및 신발 바닥이 우레탄 코팅된 것을 사용한다. 작업화는 기본적으로 가볍고 땀의 흡수·방출이 용이해야 한다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":264,"diff":3,"origin":"new","kind":"short","ans":["우레탄","폴리우레탄","우레탄 코팅"]},{"id":"bk5bea462c","cat":"유통안전","type":"선다형","q":"작업모 기준으로 규정되지 않은 것은?","explain":"작업모의 소각 폐기 규정은 없다. 작업모 기준은 가벼움·착용감, 원형 유지, 머리카락 전체 감쌈, 공기 유통 원활 및 이물 비산 방지의 4가지다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":264,"diff":2,"origin":"new","kind":"mcq","opts":["가볍고 착용감이 좋아야 한다.","착용이 용이하고 착용 후 머리카락 형태가 원형을 유지해야 한다.","착용 시 머리카락을 전체적으로 감싸줄 수 있어야 한다.","공기 유통이 원활하고 분진 기타 이물 등이 나오지 않도록 해야 한다.","작업 종료 후 반드시 소각 폐기해야 한다."],"answer":4},{"id":"bk6f20fcc6","cat":"유통안전","type":"O/X","q":"위생 모자를 쓴 후 2급지 작업실의 상부 작업자는 반드시 방진복을 착용하고 작업소에 입실한다.","explain":"교재 작업복 착용방법 그대로다. 또한 제조실 작업자는 에어 샤워실에 들어가 양팔을 천천히 펴고 몸을 1~2회 회전시켜 청정한 공기로 에어 샤워를 한다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":265,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bkd2efecf9","cat":"유통안전","type":"숫자기준","q":"작업복 관리 기준에서 지급 수량과 세탁 주기를 바르게 짝지은 것은?","explain":"작업복은 1인 2벌을 기준으로 지급하고 주 2회 세탁을 원칙으로 하되, 하절기에는 그 횟수를 늘릴 수 있다. 작업복의 청결상태는 매일 작업 전 생산부서 관리자가 확인한다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":265,"diff":2,"origin":"new","kind":"mcq","opts":["1인 1벌 / 주 1회 세탁","1인 2벌 / 주 2회 세탁","1인 2벌 / 월 2회 세탁","1인 3벌 / 주 2회 세탁","1인 2벌 / 매일 세탁"],"answer":1},{"id":"bk03726c99","cat":"유통안전","type":"빈칸채우기","q":"제조실 작업자는 에어 샤워실에 들어가 양팔을 천천히 펴고 몸을 (  )회 회전시켜 청정한 공기로 에어 샤워를 한다. 괄호에 들어갈 숫자는?","explain":"에어 샤워는 양팔을 천천히 펴고 몸을 1~2회 회전시키며 실시한다. 작업복 착용방법의 마지막 항목이다.","subj":"유통안전","chap":"CHAPTER 04 CGMP - 작업자 위생관리","page":265,"diff":3,"origin":"new","kind":"short","ans":["1~2","1-2","1 ~ 2","1~2회","한두"]},{"id":"bkc1fb48f6","cat":"유통안전","type":"선다형","q":"설비·기구의 유지관리기준으로 옳지 않은 것은?","explain":"모든 제조 관련 설비는 '승인된 자'만 접근·사용할 수 있다. 또한 제품 품질에 영향을 줄 수 있는 검사·측정·시험장비 및 자동화장치는 계획을 수립하여 정기적으로 교정·성능점검하고 결과를 기록한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":266,"diff":2,"origin":"new","kind":"mcq","opts":["설비는 정기적으로 점검하여 화장품의 제조 및 품질관리에 지장이 없도록 유지·관리·기록한다.","결함 발생 및 정비 중인 설비는 적절한 방법으로 표시하고, 고장 등 사용이 불가할 경우 표시한다.","세척한 설비는 다음 사용 시까지 오염되지 않도록 관리한다.","모든 제조 관련 설비는 작업 편의를 위해 모든 작업자가 자유롭게 접근·사용할 수 있어야 한다.","유지관리 작업이 제품의 품질에 영향을 주어서는 안 된다."],"answer":3},{"id":"bk1ee1fb8d","cat":"유통안전","type":"단답형","q":"설비 유지관리 원칙 중 고장이 난 뒤 고치는 것이 아니라 사전에 계획적으로 실시하는 것을 무엇이라 하는가? (영문 표기 포함)","explain":"설비 유지관리 원칙 첫 항목이 '예방적 실시(Preventive maintenance)'다. 이어서 설비마다 절차서 작성, 계획 수립 및 실행(연간계획), 유지하는 '기준'은 절차서에 포함(점검체크시트 사용)이 이어진다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":266,"diff":2,"origin":"new","kind":"short","ans":["예방적 실시","예방적 실시(Preventive maintenance)","Preventive maintenance","preventive maintenance","예방정비","예방 정비"]},{"id":"bkdbfc62d0","cat":"유통안전","type":"분류맞히기","q":"설비 점검항목 중 '기능 측정'에 속하는 항목이 아닌 것은?","explain":"이취는 '외관 검사(더러움, 녹, 이상소음, 이취)'에 속한다. 기능 측정 항목은 회전 수, 전압, 투과율, 감도다. 그 밖의 점검항목으로 작동 점검(스위치, 연동성), 청소(외부 표면·내부), 부품 교환, 개선이 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":266,"diff":3,"origin":"new","kind":"mcq","opts":["회전 수","전압","투과율","감도","이취"],"answer":4},{"id":"bkee639b7b","cat":"유통안전","type":"보기매칭","q":"'조사, 분석, 설계, 설치, 운전, 보전, 그리고 폐기에 이르는 설비 생애(life cycle)의 전 단계에 걸쳐서 설비의 생산성을 높이는 활동'에 해당하는 용어를 보기에서 고르시오.","explain":"설비 관리의 정의다. '설비 보전'은 생산 설비를 최적 상태로 유지하기 위해 일상·정기 점검을 통한 설비 진단과 고장 부위 정비 활동이고, '설비 유지·보수'는 설비 보전 활동 중 기본적인 점검·정비·보수로 국한된 개념이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":266,"diff":3,"origin":"new","kind":"mcq","opts":["설비 관리","설비 보전","설비 유지·보수","설비 생애","예방 정비"],"answer":0},{"id":"bkb96ac68f","cat":"유통안전","type":"선다형","q":"교재가 제시한 설비 생애(life cycle)의 단계에 포함되지 않는 것은?","explain":"설비 생애는 신규 설비 검토 → 설계·제작·설치·검수 → 사용과 유지·관리 → 고장 발생과 수리 → 폐기·매각의 5단계다. 원자재 공급자 승인은 원자재관리(CHAPTER 06) 영역이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":266,"diff":2,"origin":"new","kind":"mcq","opts":["신규 설비 검토 단계","설계, 제작, 설치, 검수 단계","사용과 유지·관리 단계(일상 점검, 정기 점검)","원자재 공급자 승인 단계","폐기, 매각 단계"],"answer":3},{"id":"bk203e5255","cat":"유통안전","type":"혼동쌍구분","q":"설비의 일상 점검과 정기 점검을 바르게 구분한 것은?","explain":"설비의 일상 점검은 일간 또는 주간 주기로 실시하고 결과를 설비 점검표에 기록한다. 정기 점검은 연간 정비 계획서에 따라 정기 정비와 같이 실시하고 설비 점검표에 결과를 기재·보관한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":267,"diff":2,"origin":"new","kind":"mcq","opts":["일상 점검은 일간 또는 주간 주기로 실시하고, 정기 점검은 연간 정비 계획서에 따라 실시한다.","일상 점검은 월간 주기로 실시하고, 정기 점검은 분기별로 실시한다.","일상 점검은 연간 계획서에 따르고, 정기 점검은 일간 주기로 실시한다.","일상 점검과 정기 점검 모두 월 1회 실시한다.","일상 점검은 매 뱃치마다, 정기 점검은 반기별로 실시한다."],"answer":0},{"id":"bk38d6cf6b","cat":"유통안전","type":"분류맞히기","q":"설비 효율을 저해하는 요인(로스)으로 교재에 제시되지 않은 것은?","explain":"설비 효율 저해 요인은 고장 로스, 작업 준비·조정 로스, 일시 정체 로스, 속도 로스, 불량·수정 로스, 초기 수율 로스의 6가지다. 재고 보관 로스는 해당하지 않는다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":267,"diff":3,"origin":"new","kind":"mcq","opts":["고장 로스","작업 준비·조정 로스","일시 정체 로스","재고 보관 로스","초기 수율 로스"],"answer":3},{"id":"bkb7102da5","cat":"유통안전","type":"단답형","q":"사용조건과 설비 관리의 적절성에 따라 단축 또는 연장될 수 있으며, 이것이 종료된 설비는 폐기해야 하는 것은?","explain":"설비의 내구연한은 사용조건과 설비 관리의 적절성에 따라 단축 또는 연장될 수 있으며, 내구연한이 종료된 설비는 폐기해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":267,"diff":2,"origin":"new","kind":"short","ans":["내구연한","내용연한","내구 연한"]},{"id":"bkc2968959","cat":"유통안전","type":"선다형","q":"설비 가동 일지에 기록하는 항목으로 교재에 열거되지 않은 것은?","explain":"설비 가동 일지에는 설비 번호·설비명·설치 장소·설치 연월과 같은 기본 항목 이외에 생산일 및 시간, 조업시간, 정지시간, 부하시간, 가동시간, 가동률을 기록한다. 구입 단가·감가상각비는 이력관리 항목이 아니다. 이러한 이력 관리를 통해 설비 가동률과 고장률을 파악한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":267,"diff":3,"origin":"new","kind":"mcq","opts":["설비 번호, 설비명, 설치 장소, 설치 연월","생산일 및 시간","조업시간, 정지시간, 부하시간","가동시간, 가동률","설비 구입 단가 및 감가상각비"],"answer":4},{"id":"bkdde4cfc1","cat":"유통안전","type":"선다형","q":"탱크의 재질에 관한 설명으로 옳은 것은?","explain":"탱크의 제품 접촉 표면 물질로는 스테인리스 스틸이 일반적으로 선호되며 유형번호 #304, 부식에 더 강한 것이 #316이다. 주형 물질이나 거친 표면은 제품이 뭉쳐 청소가 어렵고 미생물·교차오염 문제를 일으켜 화장품에 추천되지 않는다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":2,"origin":"new","kind":"mcq","opts":["제품 접촉면에는 유형번호 스테인리스 #304가 일반적으로 선호되며, 부식에 강한 것은 #316이다.","제품 접촉면에는 유형번호 스테인리스 #316이 일반적으로 선호되며, 부식에 강한 것은 #304이다.","제품 접촉면에는 알루미늄이 일반적으로 선호된다.","제품 접촉면에는 구리가 일반적으로 선호된다.","제품 접촉면에는 주형 물질(cast material)이 일반적으로 선호된다."],"answer":0},{"id":"bk32772f23","cat":"유통안전","type":"선다형","q":"탱크의 특성에 관한 설명으로 옳지 않은 것은?","explain":"주형 물질 또는 거친 표면은 제품이 뭉치게 되어 깨끗하게 청소하기 어렵고 미생물 또는 교차 오염 문제를 일으킬 수 있으므로 화장품에 추천되지 않는다. 또한 외부 표면의 코팅은 제품에 대해 저항력(product-resistant)이 있어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":2,"origin":"new","kind":"mcq","opts":["미생물학적으로 민감하지 않은 물질 또는 제품에는 유리로 안을 댄 강화 유리섬유 폴리에스터와 플라스틱으로 안을 댄 탱크를 사용할 수 있다.","퍼옥사이드 같은 민감한 물질은 탱크 제작전문가 또는 물질 공급자와 함께 적용 가능성을 상의해야 한다.","기계로 만들고 광을 낸 표면이 선호된다.","주형 물질(cast material) 또는 거친 표면은 청소가 쉬워 화장품 제조에 적극 추천된다.","모든 용접 및 결합 부위는 가능한 한 매끄러우며 평면이 유지되어야 한다."],"answer":3},{"id":"bk2c609e72","cat":"유통안전","type":"선다형","q":"탱크의 구성요건으로 적절하지 않은 것은?","explain":"탱크는 세제 및 소독제와 '반응해서는 안 된다'. 세척·소독 과정에서 다른 물질이 스며들어서도 안 된다. 온도·압력 범위는 조작 전반과 모든 공정 단계의 제품에 적합해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":2,"origin":"new","kind":"mcq","opts":["가열 및 냉각과 압력 및 진공 조작을 할 수 있도록 만들어질 수 있다.","적절한 커버를 갖춰야 하며 청소와 유지관리를 쉽게 할 수 있어야 한다.","제품과의 반응으로 부식되거나 분해를 초래하는 반응이 있어서는 안 된다.","세제 및 소독제와 활발히 반응하여 잔류물을 분해할 수 있어야 한다.","용접, 나사, 나사못, 용구 등을 포함하는 설비 부품들 사이에 전기 화학 반응을 최소화해야 한다."],"answer":3},{"id":"bk959f75fd","cat":"유통안전","type":"단답형","q":"반응할 수 있는 제품의 경우 탱크 표면을 비활성으로 만들기 위해 사용하기 전에 실시하는 표면 처리를 무엇이라 하는가?","explain":"표면 패시베이션(passivation)은 반응성 있는 제품을 다룰 때 표면을 비활성화하는 처리다. 설비의 일부분이 변경될 경우 다시 패시베이션이 필요할 수 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":271,"diff":3,"origin":"new","kind":"short","ans":["패시베이션","passivation","표면 패시베이션","부동태화","패시베이션(passivation)"]},{"id":"bk41f184ea","cat":"유통안전","type":"단답형","q":"스프레이 볼이나 스팀세척기처럼, 제품과 접촉되는 표면에 쉽게 접근할 수 없을 때 설비를 분해하지 않고 세척하는 시스템을 무엇이라 하는가?","explain":"clean-in-place(CIP) 시스템은 접근이 어려운 표면 세척에 쓰이지만, 설비의 악화 또는 손상이 확인되고 처리되는 동안에는 장비를 해체하여 청소해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":271,"diff":3,"origin":"new","kind":"short","ans":["clean-in-place","CIP","clean in place","클린인플레이스","clean-in-place 시스템","정치세척"]},{"id":"bk083424c5","cat":"유통안전","type":"단답형","q":"탱크의 밸브나 파이프 시스템에서 청소하기 어렵고 오염원이 되므로 발생하지 않도록 설치·설계해야 하는 정체 부위를 영문으로 무엇이라 하는가?","explain":"dead leg(막힌 관)는 내용물이 고여 미생물 오염원이 되는 정체 부위다. 밸브는 청소하기 어려운 부분이나 dead leg가 발생하지 않도록 설치하며, 메인 파이프에서 두 번째 라인으로 흘러가도록 밸브를 사용할 때는 dead leg 방지를 위해 주흐름에 가능한 한 가깝게 위치시킨다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":271,"diff":3,"origin":"new","kind":"short","ans":["dead leg","dead-leg","deadleg","막힌 관","데드레그","정체 부위(dead leg)"]},{"id":"bkb8307f54","cat":"유통안전","type":"선다형","q":"탱크의 위생처리에 관한 설명으로 옳지 않은 것은?","explain":"가는 관을 연결하여 사용하는 것은 물리적/미생물 또는 교차오염 문제를 일으킬 수 있으며 청소하기가 어렵다. 나머지는 모두 탱크 위생처리 항목 그대로다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":271,"diff":2,"origin":"new","kind":"mcq","opts":["최초 사용 전에 설비는 세척되어야 하고 사용 목적에 따라 소독되어야 한다.","탱크는 완전히 내용물이 빠지도록 설계되어야 한다.","위생(sanitary) 밸브와 연결부위는 비위생적인 틈을 방지하기 위해 추천된다.","밸브들은 청소하기 어려운 부분이나 정체 부위(dead leg)가 발생하지 않도록 설치해야 한다.","가는 관을 연결하여 사용하면 청소가 쉬워지므로 교차오염 방지에 유리하다."],"answer":4},{"id":"bk5a02a45f","cat":"유통안전","type":"선다형","q":"펌프의 구성 부품으로 교재가 열거한 것을 모두 고른 것은?","explain":"펌프는 모터, 개스킷(gasket), 패킹(packing), 윤활제로 구성된다. 펌프는 다양한 점도의 액체를 이동시키거나 제품을 혼합(재순환 또는 균질화)하기 위해 사용한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":2,"origin":"new","kind":"mcq","opts":["모터, 개스킷(gasket), 패킹(packing), 윤활제","모터, 임펠러, 필터, 개스킷","모터, 개스킷, 카트리지, 스프레이 볼","샤프트, 개스킷, 로드 셀, 윤활제","모터, 패킹, 호퍼, 여과 매체"],"answer":0},{"id":"bkd297f796","cat":"유통안전","type":"분류맞히기","q":"펌프의 형식 분류에서 '용적형'에 해당하는 것은?","explain":"펌프는 터보형(원심식, 사류식, 축류식), 용적형(왕복식, 회전식), 특수형으로 나뉜다. 원심식·사류식·축류식은 모두 터보형이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":3,"origin":"new","kind":"mcq","opts":["원심식","사류식","축류식","왕복식","특수형"],"answer":3},{"id":"bk59e48ecc","cat":"유통안전","type":"O/X","q":"펌프의 기계적인 동작은 에너지를 펌핑된 물질에 가하게 된다.","explain":"교재 인쇄 정답 O. 펌핑(작업)의 기계적인 동작은 에너지를 펌핑된 물질에 가하며, 그 에너지는 물질에 따라 물리적 성질의 변화를 일으킬 수 있다. 그래서 매우 민감한 에멀젼에서는 펌핑 테스트를 통해 영향을 확증한 후 펌프를 최종 선택해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":268,"diff":2,"origin":"book","kind":"ox","answer_ox":"O"},{"id":"bk03692c50","cat":"유통안전","type":"선다형","q":"펌프의 위생처리 및 안전요건으로 옳지 않은 것은?","explain":"펌프 설계는 펌핑 시 생성되는 압력을 고려해야 하고 '적합한 위생적인 압력 해소 장치가 설치되어야' 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":272,"diff":2,"origin":"new","kind":"mcq","opts":["일상적인 예정된 청소와 유지관리를 위하여 허용된 작업 범위에 대해 라벨을 확인해야 한다.","효과적인 청소와 위생을 위해 각각의 펌프 디자인을 검증해야 한다.","철저한 예방적인 유지관리 절차를 준수해야 한다.","펌프 설계는 펌핑 시 생성되는 압력을 고려해야 한다.","위생적인 압력 해소 장치는 오염 위험이 있으므로 설치하지 않는다."],"answer":4},{"id":"bkc8306e5f","cat":"유통안전","type":"빈칸채우기","q":"믹서를 고르는 방법 중 일반적인 접근은 실제 생산 크기의 뱃치 생산 전에 시험적인 정률증가[(  )] 기준을 사용하여 뱃치들을 제조하고, 그렇게 생산된 제품의 안정성과 품질에 따라 믹서의 적합성을 판단하는 것이다. 괄호에 들어갈 영문 용어는?","explain":"정률증가(scale-up)는 소규모 시험 뱃치에서 실제 생산 규모로 확대하는 것을 말한다. 혼합/교반 장치는 제품의 균일성과 희망하는 물리적 성상을 얻기 위해 사용하며 제품의 안정성에도 영향을 미친다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":269,"diff":3,"origin":"new","kind":"short","ans":["scale-up","scale up","스케일업","스케일 업","scaleup"]},{"id":"bkb498a98c","cat":"유통안전","type":"선다형","q":"혼합/교반 장치의 재질에 관한 설명으로 옳은 것은?","explain":"전기화학적 반응(이종 금속 접촉에 의한 부식 등)을 피하기 위해 믹서 재질과 젖는 부분·탱크의 공존 가능성을 확인해야 한다. 대부분의 믹서는 봉인(seal)과 개스킷에 의해 제품과의 접촉으로부터 분리되어 있는 내부패킹과 윤활제를 사용한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":269,"diff":3,"origin":"new","kind":"mcq","opts":["전기화학적인 반응을 피하기 위해 믹서의 재질이 믹서를 설치할 모든 젖은 부분 및 탱크와의 공존이 가능한지를 확인해야 한다.","믹서는 반드시 유리 재질로만 제작되어야 한다.","대부분의 믹서는 개스킷 없이 제품과 직접 접촉하도록 설계된다.","믹서의 재질은 탱크 재질과 반드시 달라야 전기화학적 반응이 억제된다.","믹서의 내부패킹과 윤활제는 제품과 직접 접촉하도록 설계되어야 한다."],"answer":0},{"id":"bkf10f3aea","cat":"유통안전","type":"O/X","q":"혼합기를 작동시키는 사람은 회전하는 샤프트와 잠재적인 위험 요소를 생각하여 안전한 작동 연습을 적절하게 훈련받아야 하며, 이동 가능한 혼합기는 사용할 때 적절하게 고정되어야 한다.","explain":"혼합/교반 장치의 안전요건 그대로다. 설비위치 요건으로는 필요할 때 혼합기가 수리와 청소를 위해 이동하기 용이하게 설치되어야 한다는 점도 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":272,"diff":1,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk8b9cb84e","cat":"유통안전","type":"선다형","q":"호스의 재질로 교재에 제시되지 않은 것은?","explain":"호스 재질은 강화된 식품등급의 고무, 네오프렌, 타이곤(tygon)/강화된 타이곤, 폴리에틸렌 또는 폴리프로필렌, 나일론이다. 스테인리스 #316은 이송 파이프·필터·충전기 등의 재질이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":269,"diff":2,"origin":"new","kind":"mcq","opts":["강화된 식품등급의 고무","네오프렌","타이곤(tygon) 또는 강화된 타이곤","폴리에틸렌 또는 폴리프로필렌","스테인리스 스틸 #316"],"answer":4},{"id":"bk0bf76e7a","cat":"유통안전","type":"O/X","q":"호스의 용이한 위생관리를 위해 투명하고, 짧고 가는 부속품이 바람직하다.","explain":"교재 인쇄 정답 X — '가는 부속품 최소화'. 투명한 재질과 짧은 길이는 선호되지만, 가는 부속품의 사용은 가는 관이 미생물 또는 교차오염 문제를 일으킬 수 있고 청소하기 어렵기 때문에 최소화되어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":272,"diff":3,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bkb032cabf","cat":"유통안전","type":"선다형","q":"사용하지 않는 호스의 보관 방법으로 적절하지 않은 것은?","explain":"사용하지 않는 호스는 세척·건조 후 비위생적인 표면과 접촉하지 않도록 지정 위치(캐비닛, 선반, 벽걸이 등)에 보관하며 배출구를 위생 뚜껑이나 플라스틱·비닐로 덮어야 한다. 바닥에 개방 상태로 두면 오염된다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":272,"diff":2,"origin":"new","kind":"mcq","opts":["세척하고 건조하여 오염을 최소화한다.","비위생적인 표면과의 접촉을 막을 수 있는 캐비닛, 선반, 벽걸이 등 지정 위치에 보관한다.","깨끗한 호스는 과도한 액체를 배내고 보관한다.","적절하게 알맞은 위생 뚜껑을 덮거나 플라스틱 또는 비닐로 배출구를 싸서 덮어 보관한다.","다음 사용 시 빠르게 연결할 수 있도록 배출구를 개방한 채 작업장 바닥에 눕혀 보관한다."],"answer":4},{"id":"bk803ac813","cat":"유통안전","type":"선다형","q":"이송 파이프의 재질로 교재에 제시되지 않은 것은?","explain":"이송 파이프는 유리, 스테인리스 스틸 #304 또는 #316, 구리, 알루미늄 등으로 구성된다. 네오프렌은 호스의 재질이다. 유형 #304와 #316 스테인리스 스틸에 추가해서 유리, 플라스틱, 표면이 코팅된 폴리머가 제품에 접촉하는 표면에 사용된다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":269,"diff":2,"origin":"new","kind":"mcq","opts":["유리","스테인리스 스틸 #304 또는 #316","구리","알루미늄","네오프렌 고무"],"answer":4,"compare":[["이송 파이프","스테인리스 스틸 #304 또는 #316"],["탱크","스테인리스 스틸 #304(일반), #316(부식에 강함)"],["필터/여과기/체","스테인리스 #316(원료와 처방에 대해 선호)"],["제품 충전기","300시리즈 스테인리스 스틸 (#304, 더 부식에 강한 #316)"]]},{"id":"bk44159b90","cat":"유통안전","type":"O/X","q":"파이프 시스템의 설계는 생성되는 최고의 압력을 고려해야 하며, 사용 전에 시스템은 정수압적으로 시험되어야 한다.","explain":"이송 파이프의 특성 및 안전요건에 그대로 기재되어 있다. 필터/여과기/체의 안전요건도 마찬가지로 '여과조건하에서 생기는 최고 압력'을 고려해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":269,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk1348becb","cat":"유통안전","type":"선다형","q":"이송 파이프의 위생처리 원칙으로 옳지 않은 것은?","explain":"파이프 시스템은 축소와 확장을 '최소화'하도록 고안되어야 한다. 관경 변화 부위는 유속 변화와 잔류를 일으켜 오염원이 된다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":273,"diff":2,"origin":"new","kind":"mcq","opts":["청소와 정규 검사를 위해 쉽게 해체될 수 있는 파이프 시스템이 고려되어야 한다.","정상적으로 가동하는 동안 가득 차도록 하고, 가동하지 않을 때는 배출하도록 고안되어야 한다.","오염시킬 수 있는 막힌 관(dead leg)이 없도록 한다.","파이프 시스템은 축소와 확장을 최대화하도록 고안되어야 한다.","밸브와 부속품이 일반적인 오염원이기 때문에 최소의 숫자로 설계되어야 한다."],"answer":3,"compare":[["이송 파이프","스테인리스 스틸 #304 또는 #316"],["탱크","스테인리스 스틸 #304(일반), #316(부식에 강함)"],["필터/여과기/체","스테인리스 #316(원료와 처방에 대해 선호)"],["제품 충전기","300시리즈 스테인리스 스틸 (#304, 더 부식에 강한 #316)"]]},{"id":"bk723d6ae1","cat":"유통안전","type":"숫자기준","q":"필터/여과기/체의 재질에 관한 설명으로 옳은 것은?","explain":"필터/여과기/체는 내용물과 반응하지 않는 스테인레스스틸 및 비반응성 섬유가 선호되며, 원료와 처방에 대해 스테인리스 #316이 제품 제조를 위해 선호된다. 여과 매체(체, 가방, 카트리지, 필터 보조물)는 효율성, 청소의 용이성, 처분의 용이성, 제품 적합성으로 평가한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":270,"diff":2,"origin":"new","kind":"mcq","opts":["내용물과 반응하지 않는 스테인레스스틸 및 비반응성 섬유가 선호되며, 원료와 처방에 대해서는 스테인리스 #316이 선호된다.","내용물과 반응하지 않는 알루미늄이 선호되며, 원료와 처방에 대해서는 스테인리스 #304가 선호된다.","구리 및 반응성 섬유가 선호되며, 원료와 처방에 대해서는 스테인리스 #304가 선호된다.","네오프렌 및 나일론이 선호되며, 원료와 처방에 대해서는 스테인리스 #316이 선호된다.","주형 물질(cast material)이 선호되며, 원료와 처방에 대해서는 스테인리스 #430이 선호된다."],"answer":0,"compare":[["필터/여과기/체","스테인리스 #316(원료와 처방에 대해 선호)"],["탱크","스테인리스 스틸 #304(일반), #316(부식에 강함)"],["이송 파이프","스테인리스 스틸 #304 또는 #316"],["제품 충전기","300시리즈 스테인리스 스틸 (#304, 더 부식에 강한 #316)"]]},{"id":"bk8fc957b2","cat":"유통안전","type":"O/X","q":"호스는 원치 않는 불순물을 제거하기 위해서 체와 필터의 사용 시 불순물이 아닌 성분을 제거한다.","explain":"교재 인쇄 정답 X — 이는 '필터'에 대한 설명이다. 호스는 한 위치에서 다른 위치로 제품을 전달하기 위해 사용하는 유연한 설비다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":270,"diff":2,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk3ad9950c","cat":"유통안전","type":"O/X","q":"칭량장치의 오차 허용도는 칭량에서 허락된 오차 허용도보다 작아야 한다.","explain":"교재 인쇄 정답 O. 교재 본문은 '칭량장치의 오차 허용도는 칭량에서 허락된 오차 허용도보다 커서는 안 된다'고 서술한다. 즉 장치 오차가 허용 오차보다 작아야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":270,"diff":3,"origin":"book","kind":"ox","answer_ox":"O"},{"id":"bkd049d471","cat":"유통안전","type":"분류맞히기","q":"칭량장치의 작동원리 유형으로 교재에 제시되지 않은 것은?","explain":"칭량장치의 유형은 기계식, 광선타입, 진자타입, 전자식, 로드 셀(Load cell)이다. 원심식은 펌프(터보형)의 분류다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":270,"diff":3,"origin":"new","kind":"mcq","opts":["기계식","광선타입","진자타입","전자식","원심식"],"answer":4},{"id":"bkf936b169","cat":"유통안전","type":"숫자기준","q":"저울의 '수치' 점검에 관한 기준으로 옳은 것은?","explain":"수치 점검은 1개월 주기로 표준 분동을 이용하며 판정기준은 직선성/정밀성 0.5% 이내, 편심오차 0.1% 이내다. 이상 시 수리 의뢰 및 필요조치를 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":273,"diff":3,"origin":"new","kind":"mcq","opts":["점검주기 1개월, 표준 분동으로 점검, 직선성/정밀성 0.5% 이내·편심오차 0.1% 이내","점검주기 매일, 표준 분동으로 점검, 직선성/정밀성 0.1% 이내·편심오차 0.5% 이내","점검주기 1주일, 육안 확인, 직선성/정밀성 1% 이내·편심오차 0.5% 이내","점검주기 1개월, 0점 setting, 직선성/정밀성 0.1% 이내·편심오차 0.5% 이내","점검주기 6개월, 표준 분동으로 점검, 직선성/정밀성 0.5% 이내·편심오차 0.1% 이내"],"answer":0},{"id":"bk1ba6d398","cat":"유통안전","type":"혼동쌍구분","q":"저울의 '영점'과 '수평' 점검을 바르게 설명한 것은?","explain":"영점과 수평 모두 점검주기는 매일, 점검시기는 가동 전이다. 점검방법은 영점이 0점 setting('0' Setting 확인), 수평이 육안 확인(수평 확인)이다. 수평 이상 시에는 자가 조절 후 수리 의뢰 및 필요조치를 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":273,"diff":3,"origin":"new","kind":"mcq","opts":["둘 다 매일 가동 전에 실시하며, 영점은 0점 setting으로, 수평은 육안 확인으로 점검한다.","둘 다 1개월 주기로 실시하며, 영점은 육안 확인으로, 수평은 표준 분동으로 점검한다.","영점은 매일 가동 전 육안 확인, 수평은 1개월 주기 0점 setting으로 점검한다.","영점은 1개월 주기, 수평은 매일 실시하며 둘 다 표준 분동으로 점검한다.","둘 다 가동 후에 실시하며, 이상 시 즉시 폐기한다."],"answer":0},{"id":"bk265b64a7","cat":"유통안전","type":"선다형","q":"게이지와 미터가 측정 및/또는 기록하기 위해 사용되는 화장품의 특성으로 교재에 열거되지 않은 것은?","explain":"게이지와 미터는 온도, 압력, 흐름, pH, 점도, 속도, 부피 그리고 다른 화장품의 특성을 측정 및/또는 기록하기 위해 사용되는 기구다. 미생물 한도는 시험실 시험 항목이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":270,"diff":2,"origin":"new","kind":"mcq","opts":["온도, 압력","흐름, pH","점도, 속도","부피","미생물 한도"],"answer":4},{"id":"bkf4eab095","cat":"유통안전","type":"O/X","q":"게이지와 미터의 전기 구성품들은 설비 지역에 있을 수 있는 폭발위험물로부터 안전한 곳에 보관되어야 한다.","explain":"게이지/미터의 예방정비(안전요건) 항목이다. 설비위치 요건으로는 인라인 게이지와 미터는 읽기 쉽고 보호할 수 있는 위치여야 하며, 위치는 유지관리와 정규 표준화에 적절해야 한다는 규정이 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":274,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bke902a014","cat":"유통안전","type":"선다형","q":"제품 충전기에서 제품과 접촉되는 표면 물질로 가장 널리 사용되는 것은?","explain":"제품 충전기에서 가장 널리 사용되는 제품 접촉 표면물질은 300시리즈 스테인리스 스틸이며, 그중 유형 #304와 더 부식에 강한 #316이 가장 널리 사용된다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":271,"diff":2,"origin":"new","kind":"mcq","opts":["300시리즈 스테인리스 스틸(#304와 더 부식에 강한 #316)","400시리즈 스테인리스 스틸(#430과 #446)","알루미늄 합금","구리 합금","강화 유리섬유 폴리에스터"],"answer":0,"compare":[["제품 충전기","300시리즈 스테인리스 스틸 (#304, 더 부식에 강한 #316)"],["탱크","스테인리스 스틸 #304(일반), #316(부식에 강함)"],["이송 파이프","스테인리스 스틸 #304 또는 #316"],["필터/여과기/체","스테인리스 #316(원료와 처방에 대해 선호)"]]},{"id":"bk96b590b1","cat":"유통안전","type":"선다형","q":"제품 충전기의 위생처리에 관한 설명으로 옳지 않은 것은?","explain":"청소를 위한 충전기의 '해체가 용이할 것이 권장'된다. 또한 청소와 위생 처리 과정의 효과는 적절한 방법으로 확인되어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":274,"diff":2,"origin":"new","kind":"mcq","opts":["청소, 위생 처리 및 정기적인 감사가 용이하도록 설계되어야 한다.","조작 중에 제품이 뭉치는 것을 최소화하도록 설계되어야 하며 설비에서 물질이 완전히 빠져나가도록 해야 한다.","제품이 고여서 설비의 오염이 생기는 사각지대가 없도록 해야 한다.","고온세척 또는 화학적 위생 처리 조작을 할 때 구성 물질과 다른 설계 조건에 있어 문제가 일어나지 않아야 한다.","청소를 위한 충전기의 해체는 오염 위험이 있으므로 금지된다."],"answer":4,"compare":[["제품 충전기","300시리즈 스테인리스 스틸 (#304, 더 부식에 강한 #316)"],["탱크","스테인리스 스틸 #304(일반), #316(부식에 강함)"],["이송 파이프","스테인리스 스틸 #304 또는 #316"],["필터/여과기/체","스테인리스 #316(원료와 처방에 대해 선호)"]]},{"id":"bk78c1a41b","cat":"유통안전","type":"O/X","q":"사용 중일 때 뚜껑, 봉인, 마개 또는 펌프를 포함하는 호퍼(hoppers)는 반드시 덮여야 하며, 공급 메커니즘(feed mechanism)은 변경 시 쉽게 비울 수 있고 검사할 수 있어야 한다.","explain":"'뚜껑 덮는 장치, 봉인장치, 플러거, 펌프주입기' 항목의 규정이다. 이들 장치는 물리적인 오염, 먼지와 제품이 쌓이는 것을 방지하도록 설계되어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":274,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk2d38aff1","cat":"유통안전","type":"선다형","q":"용기 세척기에 관한 설명으로 옳지 않은 것은?","explain":"'다 쓴 공기는 다른 부위를 오염시켜서는 안 된다'가 교재 규정이다. 세척 공기 자체가 오염물을 실어 나르는 매개가 되기 때문이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":275,"diff":2,"origin":"new","kind":"mcq","opts":["용기세척기는 충전될 용기 내부로부터 유리된 물질을 제거한다.","수집장치는 쉽고 빈번하게 비울 수 있어야 한다.","용기세척기의 효율성은 적절한 작동을 하여 평가되어야 한다.","세척을 위해 사용되는 공기의 품질을 알아야 하며 기름, 물, 미생물 함량 등 오염물질을 피하기 위해 주기적으로 평가되어야 한다.","세척에 다 쓴 공기는 이미 오염물을 제거했으므로 다른 부위로 배출해도 무방하다."],"answer":4},{"id":"bkdbac9d4c","cat":"유통안전","type":"선다형","q":"코드화 기기(착인기)로 코드를 표시하는 방법으로 교재가 열거한 것은?","explain":"코드화기기의 목적은 라벨, 용기 또는 출하상자에 읽을 수 있는 영구적인 코드를 표시하는 것이며, 잉크로 인쇄하거나 엠보싱(embossing), 디보싱(debossing) 등으로 코드를 표시한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":275,"diff":2,"origin":"new","kind":"mcq","opts":["잉크로 인쇄, 엠보싱(embossing), 디보싱(debossing)","잉크로 인쇄, 라미네이팅, 실크스크린","레이저 각인, 엠보싱, 라벨 부착","핫스탬핑, 디보싱, 접착제 도포","잉크로 인쇄, 열수축 필름, 봉인"],"answer":0},{"id":"bk50dfad58","cat":"유통안전","type":"단답형","q":"용기 또는 다른 종류의 포장에 라벨 또는 포장의 손상 없이 라벨을 붙이는 데 이용되며, 변경 시 다른 코드나 다른 제품의 라벨이 혼입되지 않도록 호퍼 등의 검사가 쉽도록 설계되어야 하는 설비는?","explain":"라벨기기에 대한 설명이다. 접착제나 유출된 제품에 노출되는 구역은 용기의 오염을 유발할 수 있는 제품의 축적을 방지하기 위해 육안으로 볼 수 있고 청소가 용이하도록 설계되어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":275,"diff":2,"origin":"new","kind":"short","ans":["라벨기기","라벨 기기","라벨링기","라벨링 기기"]},{"id":"bk4b191332","cat":"유통안전","type":"선다형","q":"설비·기구의 위생기준으로 옳지 않은 것은?","explain":"천정 주위의 대들보·파이프·도관 등은 '가급적 노출되지 않도록' 설계하고, 파이프는 받침대로 고정하되 '벽에 닿지 않게' 하여 청소가 용이하도록 설계한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":276,"diff":2,"origin":"new","kind":"mcq","opts":["사용하지 않는 설비기구는 건조한 상태로 유지하고 먼지, 얼룩 또는 다른 오염으로부터 보호한다.","설비는 제품의 오염을 방지하고 배수가 용이하도록 설계 및 설치한다.","설비는 제품 및 청소 소독제와 화학반응을 일으키지 않을 것","배수관은 역류되지 않아야 하고 청결을 유지한다.","천정 주위의 대들보, 파이프, 도관 등은 청소 편의를 위해 최대한 노출시켜 설계하고 벽에 밀착 고정한다."],"answer":4},{"id":"bk9f0b8b20","cat":"유통안전","type":"빈칸채우기","q":"설비가 오염되지 않도록 배관과 배수관을 설치하며, 배수관은 (  )되지 않아야 하고 청결을 유지한다. 괄호에 들어갈 말은?","explain":"배수관의 역류는 오수와 오염물이 작업소 내로 되돌아오게 하므로 반드시 방지해야 한다. 설비 위치는 원자재나 직원의 이동으로 인해 제품의 품질에 영향을 주지 않도록 해야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":276,"diff":2,"origin":"new","kind":"short","ans":["역류","역류(逆流)"]},{"id":"bk9e62cbf0","cat":"유통안전","type":"혼동쌍구분","q":"설비세척에서 '언제 어떻게 설비를 세척하는지'에 대한 판단과 책무는 누구에게 있는가?","explain":"화장품 설비 세척 시 작업자의 독자적인 판단에 맡겨서는 안 되고, 언제 어떻게 설비를 세척하는지의 판단과 책무는 제조책임자에게 있다. 그래서 회사는 '설비세척의 원칙'을 반드시 마련해 놓아야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":277,"diff":3,"origin":"new","kind":"mcq","opts":["작업자 개인","제조책임자","품질보증 책임자","책임판매관리자","맞춤형화장품조제관리사"],"answer":1},{"id":"bk956dd8ea","cat":"유통안전","type":"선다형","q":"'설비세척의 원칙'으로 옳지 않은 것은?","explain":"설비세척의 원칙은 '가능한 한 세제를 사용하지 않는다'이다. 세제는 설비 내벽에 남기 쉽고, 잔존한 세척제는 제품에 악영향을 미치며, 세제가 잔존하지 않음을 설명하려면 고도의 화학 분석이 필요하기 때문이다. 그 밖에 증기 세척은 좋은 방법이며 브러시 등으로 문질러 지우는 것도 고려한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":277,"diff":2,"origin":"new","kind":"mcq","opts":["위험성이 없는 용제(물이 최적)로 세척한다.","세척력을 높이기 위해 가능한 한 세제를 적극적으로 사용한다.","분해할 수 있는 설비는 분해해서 세척한다.","세척 후는 '판정'한다.","판정 후의 설비는 건조·밀폐해서 보존하고, 사용 전 육안으로 재확인하여 적합한 것만을 제조에 사용한다."],"answer":1},{"id":"bk5cd675e4","cat":"유통안전","type":"O/X","q":"설비세척의 원칙으로 증기 세척은 좋은 방법이다.","explain":"교재 인쇄 정답 O. 물 또는 증기만으로 세척할 수 있으면 가장 좋으며, 브러시 등의 세척 기구를 적절히 사용해 세척하는 것도 좋다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":283,"diff":1,"origin":"book","kind":"ox","answer_ox":"O"},{"id":"bk1f01289b","cat":"유통안전","type":"O/X","q":"설비세척의 원칙으로 세척 전에는 '판정'해야 한다.","explain":"교재 인쇄 정답 X — 판정은 '세척 후'에 한다. 세척 → 판정 → 건조·밀폐 보존 → 사용 전 육안 재확인의 순서다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":283,"diff":2,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk571f629f","cat":"유통안전","type":"혼동쌍구분","q":"세제(계면활성제)를 사용한 설비세척을 권장하지 않는 이유로 교재가 제시한 것이 아닌 것은?","explain":"세제를 권장하지 않는 이유는 잔류 가능성, 잔류 시 제품 악영향, 잔류 없음을 입증하기 위한 고도 화학 분석 필요의 3가지다. 세척력이 약해서가 아니라 '잔류 위험' 때문이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":278,"diff":3,"origin":"new","kind":"mcq","opts":["세제는 설비 내벽에 남기 쉽다.","잔존한 세척제는 제품에 악영향을 미친다.","세제가 잔존하고 있지 않은 것을 설명하기에는 고도의 화학 분석이 필요하다.","세제는 물이나 증기보다 세척력이 약해 오염 제거가 되지 않는다.","해당 없음(위 세 가지가 모두 이유이다)"],"answer":3},{"id":"bk722b8270","cat":"유통안전","type":"숫자기준","q":"제조탱크/저장탱크의 세척 및 소독 관리 표준서에서 사용하는 세제 및 소독액을 바르게 짝지은 것은?","explain":"제조탱크/저장탱크(일반제품)의 세제 및 소독액은 일반 주방 세제(0.5%)와 70% 에탄올이다. 믹서, 호모게나이저, 펌프, 필터, 카트리지필터도 동일하게 일반 주방 세제(0.5%)와 70% 에탄올을 쓴다. 세척 도구는 스펀지, 수세미, 솔, 스팀 세척기다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":278,"diff":2,"origin":"new","kind":"mcq","opts":["일반 주방 세제(0.5%), 70% 에탄올","일반 주방 세제(5%), 95% 에탄올","연마 세제(0.5%), 70% 아이소프로판올","일반 주방 세제(1.5%), 35% 과산화수소","중성 세제(0.05%), 70% 에탄올"],"answer":0},{"id":"bk6331f412","cat":"유통안전","type":"숫자기준","q":"제조탱크의 세척 및 소독주기로 규정되지 않은 것은?","explain":"세척 및 소독주기는 ① 제품 변경 시 또는 작업 완료 후 ② 설비 미사용 72시간 경과 후, 밀폐되지 않은 상태로 방치 시 ③ 오염 발생 혹은 시스템 문제 발 ubj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":279,"diff":3,"origin":"new","kind":"mcq","opts":["3분","5분","10분","30분","60분"],"answer":2},{"id":"bk6e833d31","cat":"유통안전","type":"단답형","q":"설비 세척 및 소독의 점검방법에서, 품질 관리 담당자가 세척 및 소독 후 마지막 헹굼수를 채취하여 미생물 유무를 시험하는 주기는?","explain":"점검 책임자는 육안으로 세척 상태를 점검하고 결과를 점검표에 기록하며, 품질 관리 담당자는 매 분기별로 세척 및 소독 후 마지막 헹굼수를 채취하여 미생물 유무를 시험한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":278,"diff":3,"origin":"new","kind":"short","ans":["매 분기별","분기별","분기","매 분기","분기마다"]},{"id":"bk6314d62a","cat":"유통안전","type":"혼동쌍구분","q":"설비 세척 후 실시하는 '판정' 방법의 우선순위를 바르게 나열한 것은?","explain":"판정방법에는 육안 판정, 닦아내기 판정, 린스 정량이 있으며 우선순위도 이 순서다. 제1선택지를 육안 판정으로 하고, 육안 판정을 할 수 없는 부분에는 닦아내기 판정을, 닦아내기 판정을 실시할 수 없으면 린스 정량을 실시한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":279,"diff":2,"origin":"new","kind":"mcq","opts":["육안 판정 → 닦아내기 판정 → 린스 정량","닦아내기 판정 → 육안 판정 → 린스 정량","린스 정량 → 육안 판정 → 닦아내기 판정","육안 판정 → 린스 정량 → 닦아내기 판정","닦아내기 판정 → 린스 정량 → 육안 판정"],"answer":0},{"id":"bk2d03d7e1","cat":"유통안전","type":"선다형","q":"세척 후 '육안 판정'에 관한 설명으로 옳지 않은 것은?","explain":"판정 장소는 '말로 표현하는 것이 아닌 그림으로 제시하는 것이 바람직'하다. 말로 하면 사람마다 다른 곳을 볼 수 있기 때문이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":279,"diff":3,"origin":"new","kind":"mcq","opts":["세척 육안 판정 자격자는 생산책임자가 작업자의 교육 훈련 이력과 경험 연수를 토대로 선임한다.","각각의 설비에 맞는 소도구(손전등, 지시 봉, 거울 등)를 준비한다.","육안 판정의 장소는 미리 정해 놓고 판정 결과는 기록서에 기재한다.","판정 장소는 그림이 아닌 말로 표현하여 전달하는 것이 바람직하다.","육안 판정은 판정방법 중 제1선택지로 삼는다."],"answer":3},{"id":"bk91bdb17c","cat":"유통안전","type":"빈칸채우기","q":"닦아내기 판정은 흰 천/검은 천으로 표면을 닦아내고 천 표면의 잔류물 유무로 세척 결과를 판정하는데, 이때 천은 (  )(無塵布)가 바람직하다. 괄호에 들어갈 말은?","explain":"닦아내기 판정에는 무진포(無塵布)가 바람직하다. 천 자체에서 섬유가 떨어지면 판정이 왜곡되기 때문이다. 판정 적격자를 선임하며, 설비마다 방법이 다르므로 각 회사에서 판정방법을 결정한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":279,"diff":3,"origin":"new","kind":"short","ans":["무진포","무진포(無塵布)","무진천"]},{"id":"bk840b564d","cat":"유통안전","type":"선다형","q":"린스액의 정량방법으로 교재가 열거한 것이 아닌 것은?","explain":"린스액의 정량방법은 HPLC, TLC(간편정량으로 잔존물 유무 확인), TOC(총유기탄소), UV(자외선)의 4가지다. IR은 열거되지 않았다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":280,"diff":3,"origin":"new","kind":"mcq","opts":["HPLC(고성능액체크로마토그래피)","TLC(박층크로마토그래피)","TOC(총유기탄소)","UV(자외선)","IR(적외선분광법)"],"answer":4},{"id":"bk4e3268bb","cat":"유통안전","type":"혼동쌍구분","q":"린스 정량법(rinse water)에 관한 설명으로 옳지 않은 것은?","explain":"린스 정량법은 잔존하는 불용물(biofilm 등)을 정량할 수 없으므로 오히려 신뢰도가 떨어진다. 정량적이지만 Biofilm의 측정이 불가능할 수 있고, 상세한 조작이 필요하며 샘플 처리 과정이 실험 결과에 영향을 미칠 수 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":280,"diff":3,"origin":"new","kind":"mcq","opts":["특정 멸균액(예 물)을 설비의 표면에 흘려서 시료를 채취하는 방법이다.","호스, 틈새 등 접근이 어려운 곳을 측정할 수 있다.","상대적으로 복잡하지만 수치로 결과를 확인할 수 있다.","잔존하는 불용물(biofilm 등)까지 정확하게 정량할 수 있어 신뢰도가 가장 높다.","제조장치의 내부 표면처럼 접근이 어려운 곳의 측정에 사용 가능하고 샘플링 면적이 커질 수 있다."],"answer":3},{"id":"bkb5abb390","cat":"유통안전","type":"혼동쌍구분","q":"미생물 표면균 채취방법 중 '면봉 시험법(swab test)'과 '콘택트 플레이트법(contact plate)'을 비교한 설명으로 옳은 것은?","explain":"면봉 시험법은 저렴하고 간편하며 불규칙한 표면과 오염이 심한 곳에 적합하다. 반면 콘택트 플레이트법은 매회 동일한 면적의 샘플링이 가능하다는 장점이 있으나 가격이 높고 보관기간이 짧으며 불규칙한 표면에는 적합하지 않고 미생물의 과도 증식 문제가 있다. 두 방법 모두 정성적 또는 정량적일 수 있다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":280,"diff":3,"origin":"new","kind":"mcq","opts":["면봉 시험법은 불규칙한 표면에 적합하고, 콘택트 플레이트법은 불규칙한 표면에 적합하지 않다.","면봉 시험법은 매회 동일한 면적의 샘플링이 가능하고, 콘택트 플레이트법은 불가능하다.","면봉 시험법은 가격이 높고, 콘택트 플레이트법은 저렴하고 간편하다.","면봉 시험법은 보관기간이 짧고, 콘택트 플레이트법은 보관기간이 길다.","두 방법 모두 정량적일 수 없고 정성적으로만 판정한다."],"answer":0},{"id":"bkf5866bd9","cat":"유통안전","type":"선다형","q":"면봉 시험법(swab test)의 단점으로 교재가 제시한 것은?","explain":"면봉 시험법의 단점은 면봉으로부터 미생물 용출이 어려워 까다로운 미생물의 검출을 억제할 수 있다는 점과, 샘플링 후 표면에 잔류물 또는 미생물 배지가 남을 수 있어 배지 잔류물을 제거해야 한다는 점이다. 가격이 높고 보관기간이 짧으며 불규칙한 표면에 부적합한 것은 콘택트 플레이트법, Biofilm 측정 불가는 린스 정량법의 단점이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":280,"diff":3,"origin":"new","kind":"mcq","opts":["가격이 높고 보관기간이 짧다.","면봉으로부터 미생물 용출이 어려워 까다로운 미생물의 검출을 억제할 수 있다.","불규칙한 표면에 적합하지 않다.","미생물의 과도 증식 문제가 있다.","Biofilm의 측정이 불가능하다."],"answer":1},{"id":"bk37a9269f","cat":"유통안전","type":"숫자기준","q":"면봉을 이용한 표면균 시험방법에서 멸균 조건과 문지르는 표면 면적을 바르게 나타낸 것은?","explain":"포일로 싼 면봉과 멸균액을 고압 멸균기에 121℃, 20분간 멸균하고, 면봉으로 일정 크기의 면적 표면(보통 24~30cm²)을 문지른다. 채취한 검체가 묻은 면봉을 희석액에 담가 희석하고, 1mL를 취해 한천평판배지에 도말하거나 배지를 부어 배양한 뒤 집락 수에 희석 배율을 곱해 면봉 1개당 미생물 수(CFU/면봉)를 계산한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":281,"diff":3,"origin":"new","kind":"mcq","opts":["고압 멸균기에 121℃, 20분 / 보통 24~30cm²","고압 멸균기에 100℃, 30분 / 보통 24~30cm²","고압 멸균기에 121℃, 20분 / 보통 10~15cm²","건열 멸균기에 121℃, 60분 / 보통 24~30cm²","고압 멸균기에 134℃, 10분 / 보통 50~60cm²"],"answer":0},{"id":"bk5e9c00ed","cat":"유통안전","type":"단답형","q":"콘택트 플레이트법에서 검체 채취가 완료된 표면을 소독하면서 배지의 잔류물이 남지 않도록 할 때 사용하는 소독제의 농도와 종류는?","explain":"검체 채취가 완료된 표면은 70% 에탄올로 소독과 함께 배지의 잔류물이 남지 않도록 한다. 채취가 끝난 콘택트 플레이트는 테이프로 봉하여 열리지 않도록 하여 오염을 방지한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":281,"diff":3,"origin":"new","kind":"short","ans":["70% 에탄올","70%에탄올","에탄올 70%","70퍼센트 에탄올"]},{"id":"bk8b3e758c","cat":"유통안전","type":"분류맞히기","q":"다음 중 '표면 부착 미생물 평가 시험'에 해당하지 않는 것은?","explain":"표면 부착 미생물 평가 시험은 면봉 시험법, 콘택트 플레이트법, 린스 정량법의 3가지다. 낙하균 측정법은 '공기 중 미생물 평가 시험'에 속한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":281,"diff":2,"origin":"new","kind":"mcq","opts":["면봉 시험법(swab test)","콘택트 플레이트법(contact plate)","린스 정량법(rinse water)","낙하균 측정법","해당 없음(위 세 가지가 모두 표면 부착 시험이다)"],"answer":3},{"id":"bka9140006","cat":"유통안전","type":"분류맞히기","q":"공기 중 미생물 평가 시험 중 '충돌법'에 속하지 않는 것은?","explain":"공기 중 미생물 평가 시험은 ① 낙하균 측정법 ② 충돌법(slit to agar sampler법, impinger sampler법, andersen sampler법) ③ 여과형 샘플러법으로 나뉜다. 여과형 샘플러법은 충돌법과 별개의 항목이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":281,"diff":3,"origin":"new","kind":"mcq","opts":["slit to agar sampler법","impinger sampler법","andersen sampler법","여과형 샘플러법","해당 없음(위 세 가지가 모두 충돌법이다)"],"answer":3},{"id":"bk58219abf","cat":"유통안전","type":"O/X","q":"탱크는 외부 표면의 코팅이 제품에 저항력이 없어야 한다.","explain":"교재 인쇄 정답 X — '저항력 있어야 함'. 외부 표면의 코팅은 제품에 대해 저항력(product-resistant)이 있어야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":282,"diff":2,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk37db11de","cat":"유통안전","type":"보기매칭","q":"다음 설명에 적절한 설비를 고르시오. • 해당 시스템 설계는 생성되는 최고의 압력을 고려해야 함 • 해당 시스템은 제품 점도, 유속 등을 고려해야 함 • 해당 설비의 밸브와 부속품은 흐름을 전환, 조작, 조절과 정지하기 위해 사용함","explain":"교재 인쇄 정답 ㉤ 이송파이프. 파이프 시스템은 제품을 한 위치에서 다른 위치로 운반하며, 밸브와 부속품으로 흐름을 전환·조작·조절·정지한다. 설계 시 최고 압력을 고려하고 사용 전 정수압적으로 시험한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":282,"diff":2,"origin":"book","kind":"mcq","opts":["탱크","펌프","교반장치","호스","이송파이프","칭량장치","충전기","필터","게이지/미터"],"answer":4},{"id":"bkcc449e8b","cat":"유통안전","type":"보기매칭","q":"다음 설명에 적절한 설비를 고르시오. • 다른 화장품의 특성을 측정 또는 기록하기 위해 사용되는 기구 • 인라인 설비는 읽기 쉽고 보호할 수 있는 위치여야 함 • 온도, 압력, pH 등의 측정용으로 사용됨","explain":"교재 인쇄 정답 ㉨ 게이지/미터. 온도, 압력, 흐름, pH, 점도, 속도, 부피 등을 측정·기록하는 기구이며, 인라인 게이지와 미터는 읽기 쉽고 보호할 수 있는 위치여야 한다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":282,"diff":2,"origin":"book","kind":"mcq","opts":["탱크","펌프","교반장치","호스","이송파이프","칭량장치","충전기","필터","게이지/미터"],"answer":8},{"id":"bkd03200a6","cat":"유통안전","type":"보기매칭","q":"다음 설명에 적절한 설비를 고르시오. • 재질로 네오프렌, 타이곤(tygon), 폴리에틸렌 또는 폴리프로필렌, 나일론 등을 사용 • 설계와 선택은 적용시의 사용 압력/온도범위를 고려해야 함 • 한 위치에서 또 다른 위치로 제품의 전달을 위해 화장품 산업에서 광범위하게 사용","explain":"교재 인쇄 정답 ㉣ 호스. 네오프렌·타이곤·폴리에틸렌·폴리프로필렌·나일론은 호스의 재질이다. 이송파이프(유리, 스테인리스 #304/#316, 구리, 알루미늄)와 재질로 구분하는 것이 핵심이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":282,"diff":2,"origin":"book","kind":"mcq","opts":["탱크","펌프","교반장치","호스","이송파이프","칭량장치","충전기","필터","게이지/미터"],"answer":3},{"id":"bkf97481ff","cat":"유통안전","type":"선다형","q":"설비 세척에서 '세척대상 물질'로 분류되지 않는 것은?","explain":"단단한 표면(용기내부)·부드러운 표면(호스)은 '세척대상 설비'의 분류다. 세척대상 설비에는 설비·배관·용기·호스·부속품, 큰 설비/작은 설비, 세척이 곤란한 설비/용이한 설비가 포함된다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":277,"diff":3,"origin":"new","kind":"mcq","opts":["화학물질(원료, 혼합물), 미립자, 미생물","동일제품, 이종제품","쉽게 분해되는 물질, 안정된 물질","검출이 곤란한 물질, 쉽게 검출할 수 있는 물질","단단한 표면(용기내부), 부드러운 표면(호스)"],"answer":4},{"id":"bk94bbebe9","cat":"유통안전","type":"단답형","q":"설비의 위생상태 점검항목 5가지 중 '더러움, 녹, 이상소음, 이취 등'을 확인하는 항목의 명칭은?","explain":"위생상태 점검항목은 ① 외관검사(더러움, 녹, 이상소음, 이취 등) ② 작동 점검(스위치, 연동성 등) ③ 기능 측정(회전 수, 전압, 투과율, 감도 등) ④ 청소(외부 표면, 내부) ⑤ 부품 교환 및 개선이다.","subj":"유통안전","chap":"CHAPTER 05 CGMP - 설비 및 기구관리","page":276,"diff":2,"origin":"new","kind":"short","ans":["외관검사","외관 검사","외관"]},{"id":"bk2c18e01b","cat":"유통안전","type":"선다형","q":"원자재 용기 및 시험기록서의 필수적인 기재사항에 해당하지 않는 것은?","explain":"필수 기재사항은 ① 원자재 공급자가 정한 제품명 ② 원자재 공급자명 ③ 수령일자 ④ 공급자가 부여한 제조번호 또는 관리번호의 4가지다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":284,"diff":2,"origin":"new","kind":"mcq","opts":["원자재 공급자가 정한 제품명","원자재 공급자명","수령일자","공급자가 부여한 제조번호 또는 관리번호","원자재의 사용기한 및 보관 온도"],"answer":4},{"id":"bk63c5055a","cat":"유통안전","type":"빈칸채우기","q":"원자재 용기에 제조번호가 없는 경우에는 (  )를 부여하여 보관하여야 한다. 괄호에 들어갈 말은?","explain":"제조번호가 없는 원자재에는 관리번호를 부여하여 보관한다. 시험기록서에도 '공급자가 부여한 제조번호 또는 관리번호'를 기재한다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":284,"diff":2,"origin":"new","kind":"short","ans":["관리번호","관리 번호"]},{"id":"bk11128134","cat":"유통안전","type":"선다형","q":"원자재 입고관리에 관한 설명으로 옳지 않은 것은?","explain":"'다만, 동일 수준의 보증이 가능한 다른 시스템이 있다면 대체할 수 있다'고 규정되어 있다. 나머지는 원자재 입고관리 조항 그대로다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":284,"diff":2,"origin":"new","kind":"mcq","opts":["원자재의 입고 시 구매 요구서, 원자재 공급업체 성적서 및 현품이 서로 일치하여야 한다.","필요한 경우 운송 관련 자료를 추가적으로 확인할 수 있다.","입고절차 중 육안확인 시 물품에 결함이 있을 경우 입고를 보류하고 격리보관 및 폐기하거나 원자재 공급업자에게 반송하여야 한다.","입고된 원자재는 '적합', '부적합', '검사 중' 등으로 상태를 표시하여야 한다.","상태 표시는 어떤 경우에도 다른 시스템으로 대체할 수 없다."],"answer":4},{"id":"bke779d2a2","cat":"유통안전","type":"보기매칭","q":"원자재 발주 및 불출 절차의 순서로 옳은 것은?","explain":"발주 → 입고 → 라벨 첨부 → 보관 → 불출 순이다. 입고 단계에서 입고 대장 기입과 입고 육안 검사가, 라벨 첨부 단계에서 시료 채취 후 입고 대장 기입과 합격 라벨 부착이 이루어진다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":285,"diff":2,"origin":"new","kind":"mcq","opts":["발주 → 입고 → 라벨 첨부 → 보관 → 불출","발주 → 라벨 첨부 → 입고 → 보관 → 불출","입고 → 발주 → 보관 → 라벨 첨부 "CHAPTER 06 CGMP - 원자재·내용물 관리","page":288,"diff":2,"origin":"new","kind":"mcq","opts":["PET, PP, PS","PE, ABS, PET","페놀, 멜라민, 에폭시수지","PP, PS, ABS","PET, 페놀, PE"],"answer":2},{"id":"bkdba89ada","cat":"유통안전","type":"단답형","q":"PET, PP, PS, PE, ABS 등과 같이 열을 가하면 물러지는 성질을 가진 플라스틱 수지를 무엇이라 하는가?","explain":"열가소성 수지에는 PET, PP, PS, PE, ABS 등이 있고, 열경화성 수지에는 페놀, 멜라민, 에폭시수지 등이 있다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":288,"diff":1,"origin":"new","kind":"short","ans":["열가소성 수지","열가소성수지","열가소성"]},{"id":"bk17c679e7","cat":"유통안전","type":"선다형","q":"금속 포장재의 특성에 관한 설명으로 옳지 않은 것은?","explain":"금속은 가격이 높다는 점이 단점이다. 철, 스테인리스강, 놋쇠, 알루미늄, 주석 등이 튜브, 뚜껑, 에어로졸 용기, 립스틱 케이스에 쓰인다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":288,"diff":2,"origin":"new","kind":"mcq","opts":["기계적 강도가 크고 얇아도 충분한 강도가 있다","충격에 강하고 가스 등을 투과시키지 않는다","도금, 도장 등의 표면가공이 쉽다","녹에 대해 주의해야 하고 불투명하며 무겁다","가격이 저렴하여 대량 포장에 유리하다"],"answer":4},{"id":"bk9b9bc258","cat":"유통안전","type":"보기매칭","q":"'반투명, 광택, 내약품성 우수, 내충격성 우수, 잘 부러지지 않음'의 품질 특성을 가지며 원터치 캡에 주로 사용되는 포장재는?","explain":"PP는 반투명·광택·내약품성 및 내충격성이 우수하고 잘 부러지지 않아 원터치 캡에 사용된다. LDPE는 병·튜브·마개·패킹, PS는 콤팩트·스틱 용기·캡에 쓰인다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":289,"diff":3,"origin":"new","kind":"mcq","opts":["저밀도 폴리에틸렌(LDPE)","고밀도 폴리에틸렌(HDPE)","폴리프로필렌(PP)","폴리스티렌(PS)","PVC"],"answer":2},{"id":"bkd8015992","cat":"유통안전","type":"선다형","q":"'광택이 없고 수분 투과가 적음'이라는 품질 특성을 가지며 화장수, 유화 제품, 린스 등의 용기와 튜브에 사용되는 포장재는?","explain":"HDPE는 광택이 없고 수분 투과가 적어 화장수, 유화 제품, 린스 등의 용기·튜브에 사용된다. LDPE는 반투명·광택·유연성이 우수하다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":289,"diff":3,"origin":"new","kind":"mcq","opts":["저밀도 폴리에틸렌(LDPE)","고밀도 폴리에틸렌(HDPE)","AS 수지","PET","소다 석회 유리"],"answer":1},{"id":"bk4f5e8013","cat":"유통안전","type":"보기매칭","q":"굴절률이 매우 높아 고급 용기나 향수 용기 등에 사용되는 포장재는?","explain":"칼리 납 유리는 굴절률이 매우 높아 고급 용기·향수 용기에 사용된다. 소다 석회 유리는 투명 유리로 스킨·로션·크림 용기에, 유백색 유리는 크림·로션 용기에 쓰인다.","subj":"유통안전","chap":"CHAPTER 06 CGMP - 원자재·내용물 관리","page":289,"diff":  확인코드","제조번호","검체채취 일자","가능한 경우 검체채취 지점(point)","사용기한 또는 개봉 후 사용기간"],"answer":4},{"id":"bk946f81a5","cat":"유통안전","type":"선다형","q":"시험용 검체를 채취할 때의 주의사항으로 옳지 않은 것은?","explain":"검체 채취는 품질부서에서 실시하며 제품 시험을 책임진다.","subj":"유통안전","chap":"CHAPTER 07 CGMP - 품질관리","page":294,"diff":2,"origin":"new","kind":"mcq","opts":["오염되거나 변질되지 아니하도록 채취한다","채취한 후에는 원상태에 준하는 포장을 해야 한다","검체가 채취되었음을 표시하여야 한다","검체 채취자에게는 절차 및 주의사항을 교육·훈련시켜야 한다","검체 채취는 생산부서에서 실시하고 품질부서는 결과만 확인한다"],"answer":4},{"id":"bk00f66477","cat":"유통안전","type":"숫자기준","q":"보관용 검체에 개봉 후 사용기간을 기재하는 경우 보관 기간은?","explain":"보관용 검체는 제조단위별로 '사용기한 경과 후 1년간' 보관하는 것이 원칙이며, 개봉 후 사용기간을 기재하는 경우에는 '제조일로부터 3년간' 보관한다(CGMP 고시 제21조제3항). 선지 ⑤의 '사용기한 경과 후 1년간'은 원칙 조항으로, 개봉 후 사용기간을 기재한 경우의 답이 아니다.","subj":"유통안전","chap":"CHAPTER 07 CGMP - 품질관리","page":294,"diff":2,"origin":"new","flag":"law","kind":"mcq","opts":["제조일로부터 1년간","제조일로부터 2년간","제조일로부터 3년간","제조일로부터 5년간","사용기한 경과 후 1년간"],"answer":2},{"id":"bk699e2686","cat":"유통안전","type":"빈칸채우기","q":"보관용 검체는 적절한 보관조건 하에 지정된 구역 내에서 제조단위별로 (   ) 보관하여야 한다. 다만, 개봉 후 사용기간을 기재하는 경우에는 제조일로부터 3년간 보관한다. 괄호에 들어갈 말은?","explain":"「우수화장품 제조 및 품질관리기준」 제21조제3항: 완제품의 보관용 검체는 적절한 보관조건 하에 지정된 구역 내에서 제조단위별로 '사용기한 경과 후 1년간' 보관하여야 한다. 다만 개봉 후 사용기간을 기재하는 경우에는 제조일로부터 3년간 보관한다. '사용기한까지'가 아님에 주의한다.","subj":"유통안전","chap":"CHAPTER 07 CGMP - 품질관리","page":294,"diff":2,"origin":"new","flag":"law","kind":"short","ans":["사용기한 경과 후 1년간","사용기한 경과 후 1년","사용기한이 지난 후 1년간","사용기한 경과 후 1년간 보관"]},{"id":"bkd6997978","cat":"유통안전","type":"선다형","q":"시험관리에 관한 설명으로 옳지 않은 것은?","explain":"기준일탈이 된 경우는 규정에 따라 책임자에게 보고한 후 조사하여야 하며, 조사결과는 책임자에 의해 일탈, 부적합, 보류가 명확히 판정되어야 한다.","subj":"유통안전","chap":"CHAPTER 07 CGMP - 품질관리","page":295,"diff":2,"origin":"new","kind":"mcq","opts":["품질관리를 위한 시험업무에 대해 문서화된 절차를 수립하고 유지하여야 한다","원자재·반제품·벌크 제품·완제품은 적합판정이 된 것만을 사용하거나 출고하여야 한다","정해진 보관기간이 경과된 원자재·반제품·벌크 제품은 재평가하여 품질기준에 적합한 경우 제조에 사용할 수 있다","모든 시험이 적절하게 이루어졌는지 시험기록은 검토한 후 적합, 부적합, 보류를 판정하여야 한다","기준일탈이 된 경우에는 책임자 보고 없이 시험자가 즉시 폐기 여부를 결정한다"],"answer":4},{"id":"bk56015dc3","  소분장치에 전량 충전하여 판매한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":323,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk327adfca","cat":"맞춤형","type":"단답형","q":"판매 중인 내용물의 유통화장품 안전기준 부합 여부 확인을 위해 화장품책임판매업자로부터 제공받아 확인하는 자료 두 가지를 쓰시오.","explain":"'매장의 품질, 안전관리 예시'에서 책임판매업자로부터 제공받아 확인하는 자료의 예로 방부력 시험자료, 미생물한도시험 결과 등이 제시된다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":323,"diff":3,"origin":"new","kind":"short","ans":["방부력 시험자료, 미생물한도시험 결과","방부력 시험자료와 미생물한도시험 결과","방부력시험자료, 미생물한도시험결과"]},{"id":"bka4bb5fc2","cat":"맞춤형","type":"선다형","q":"시험환경 차이로 결과가 다를 수 있으므로 판매장에서도 주기적으로 시험 관리를 권고한다. 그 예로 제시된 것은?","explain":"판매장에서도 분기 또는 반기별로 판매 중인 내용물을 판매 용기에 직접 샘플링하여 미생물 시험을 의뢰하도록 권고한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":323,"diff":3,"origin":"new","kind":"mcq","opts":["분기 또는 반기별로 판매 중인 내용물을 판매 용기에 직접 샘플링하여 미생물 시험 의뢰","매일 판매 종료 후 내용물의 pH를 측정","매월 중금속 시험을 자체 실시","연 1회 책임판매업자가 방문하여 전량 회수 검사","판매 시마다 소비자 앞에서 방부력 시험 실시"],"answer":0},{"id":"bkee5cfe3e","cat":"맞춤형","type":"선다형","q":"소분(리필) 장치 관리에 대한 설명으로 옳지 않은 것은?","explain":"필요 시 내용물을 공급하는 화장품책임판매업자로부터 기기의 작동, 관리방법 등 정보를 제공받는다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":323,"diff":2,"origin":"new","kind":"mcq","opts":["판매장은 내용물의 오염과 해충 등을 방지할 수 있도록 항상 청결하게 유지한다","소분에 사용되는 장치·기구 등은 제품의 유형, 제형 등을 고려하여 적합한 것을 사용한다","소분장치나 저울 등 소분에 사용하는 기기의 매뉴얼을 마련하여 관리하고 정상 작동을 주기적으로 점검한다","장시간 소분장치를 이용하지 않는 경우, 토출부의 내용물이 펌프나 노즐 주위에 굳어 있거나 흘러내리지 않도록 밀폐한다","소분장치의 작동·관리방법은 판매장이 자체적으로만 정해야 하며 화장품책임판매업자로부터 정보를 제공받아서는 안 된다"],"answer":4},{"id":"bkd42d6f82","cat":"맞춤형","type":"숫자기준","q":"충진 튜브, 노즐, 펌프 등 소분 장치의 세척 후 소독에 사용하는 에탄올의 농도는?","explain":"세척제를 사용하여 상수도로 세척하고, 에탄올(70%) 등으로 소독한다. 리필 용기 소독에도 에탄올(70%)이 예시로 제시된다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":324,"diff":2,"origin":"new","kind":"short","ans":["70%","에탄올 70%","70퍼센트"]},{"id":"bk4755b5b3","cat":"맞춤형","type":"선다형","q":"소분 장치, 기구 등의 사용 전 확인사항으로 옳지 않은 것은?","explain":"내용물 벌크용기 교체 시 튜브는 세척·건조된 깨끗한 것으로 사용하고, 튜브와 일체형인 펌프의 경우는 세척보다는 '새 것으로 교체'한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":324,"diff":3,"origin":"new","kind":"mcq","opts":["충진 튜브, 노즐, 펌프 등은 장치에 적합한 청소용품을 사용하여 주기적으로 세척하며, 소모품은 교체주기에 따라 교체한다","소분장치의 위생 상태를 주기적으로 확인하며, 필요 시 직접 미생물 검사를 의뢰하고 부적합하다고 판단되는 경우 폐기한다","내용물 토출부는 소분 전·후 잔여물이 없도록 청소하고 필요 시 소독한다","펌프나 밸브에 고여 있던 내용물이 바닥으로 떨어지는 것을 방지할 수 있도록 받침용 접시, 받침통 등을 비치한다","내용물 벌크용기 교체 시 튜브와 일체형인 펌프는 반드시 세척하여 재사용한다"],"answer":4},{"id":"bka9ac258f","cat":"맞춤형","type":"O/X","q":"세척하여 재사용하는 부속품은 가능한 동일한 내용물에 적용되도록 관리한다.","explain":"소분 장치·기구 사용 전 확인사항 6번에 명시되어 있다. 서로 다른 내용물 간 교차오염을 막기 위한 조치다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":324,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bkf35e6258","cat":"맞춤형","type":"선다형","q":"리필용 재사용 용기 관리에 대한 설명으로 옳지 않은 것은?","explain":"일부 플라스틱 용기는 UV 살균에 적합하지 않을 수 있다. 에탄올(70%) 소독, UV 살균기 살균 등은 제품과 용기 특성을 고려해 선택한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":324,"diff":3,"origin":"new","kind":"mcq","opts":["화장품 내용물과 용기의 구성물질 간 상호작용을 고려하여 사용 가능한 용기의 범위(기준)를 마련하고 용기의 특성에 따라 재사용 가능 여부를 판단한다","펌프와 튜브는 세척이 어려운 구조로 세척 후에도 오염물이 눈에 안 띄어 재사용이 어렵다","재사용 용기에 내용물을 리필하기 전 잔여물 잔류 여부, 완전 건조 여부, 금이 가거나 깨진 곳이 없는지 등을 확인한다","유성화장품 용기 세척 시 물은 잔류물 제거 효과가 떨어지므로 적절한 다른 세척제를 선택한다","모든 플라스틱 용기는 UV 살균기로 살균하는 것이 가장 적합하다"],"answer":4},{"id":"bkb23992fe","cat":"맞춤형","type":"단답형","q":"판매장 전용 용기와 관련하여, 내용물을 공급하는 화장품책임판매업자로부터 제공받아 확인해야 하는 것은 무엇인가?","explain":"판매장 전용 용기는 내용물을 공급하는 화장품책임판매업자로부터 소분(리필) 용기와 내용물 간의 적합성 검토결과를 제공받아 확인한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":324,"diff":3,"origin":"new","kind":"short","ans":["소분(리필) 용기와 내용물 간의 적합성 검토결과","용기와 내용물 간 적합성 검토결과","적합성 검토결과"]},{"id":"bk7ba33c24","cat":"맞춤형","type":"선다형","q":"소비자 제공 용기를 사용하는 경우의 조치로 옳지 않은 것은?","explain":"판매내역서 비고란에 소비자 제공 용기의 사용 여부를 기록해야 한다.","subj":"맞춤형","chap":"CHAPTER 03 소분(리필) 내용물의 품질·안전관리","page":325,"diff":2,"origin":"new","kind":"mcq","opts":["가급적 원래의 내용물이 담겨 있던 용기에 동일한 내용물을 리필하여 판매할 것을 권장한다","원래의 내용물이 담겨있던 용기가 :"O"},{"id":"bkd0c88da9","cat":"맞춤형","type":"혼동쌍구분","q":"케라토히알린과립과 층판과립의 역할을 바르게 구분한 것은?","explain":"케라토히알린과립 = 단백질과립 → 필라그린 분해 → NMF(아미노산), 층판과립 = 지질과립 → 세포간지질. 두 과립의 이름과 산물을 바꿔 놓은 선지가 전형적 함정이다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":328,"diff":3,"origin":"new","kind":"mcq","opts":["케라토히알린과립(단백질과립)은 필라그린 분해를 거쳐 아미노산(NMF)을 형성하고, 층판과립(지질과립)은 세포간지질을 형성한다","케라토히알린과립(지질과립)은 세포간지질을 형성하고, 층판과립(단백질과립)은 아미노산(NMF)을 형성한다","두 과립 모두 세포간지질만을 형성한다","두 과립 모두 아미노산(NMF)만을 형성한다","케라토히알린과립은 멜라닌을, 층판과립은 케라틴을 형성한다"],"answer":0},{"id":"bkf88dff76","cat":"맞춤형","type":"O/X","q":"각화과정에서 각층의 분화된 세포들은 모두 각질을 형성하는 과정에 있는 세포들이므로 통틀어 각질형성세포라고 부른다.","explain":"'미리 알아두기!' 항목의 내용이다. 기저세포·유극세포·과립세포·각질세포는 모두 각질형성세포로 통칭된다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":327,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk28138b55","cat":"맞춤형","type":"단답형","q":"각질세포 사이에 존재하는 지질층·피지와 함께 각질층의 수분을 유지하는, 수용성 아미노산으로 이루어진 인자를 무엇이라 하는가?","explain":"교재는 이를 '자연보습인자(천연보습인자, NMF, Natural Moisturizing Factor)'로 표기한다. 각질층은 NMF와 각질세포 사이 지질층, 피지선에서 분비되는 피지에 의해 수분을 유지한다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":329,"diff":1,"origin":"book","kind":"short","ans":["자연보습인자","천연보습인자","NMF","Natural Moisturizing Factor"]},{"id":"bkd8c9f9be","cat":"맞춤형","type":"빈칸채우기","q":"자연보습인자(NMF)를 구성하는 수용성 아미노산은 ( )이(가) 각질층세포의 하층으로부터 표층으로 이동함에 따라 각질층 내의 단백질분해효소에 의해 분해된 것이다. 괄호에 들어갈 단백질은?","explain":"NMF의 아미노산은 필라그린(filaggrin)이 각질층 하층→표층으로 이동하면서 각질층 내 단백질분해효소에 의해 분해되어 만들어진다. 케라틴 자체가 분해된 것이 아니다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":329,"diff":2,"origin":"book","kind":"short","ans":["필라그린","filaggrin","휠라그린"]},{"id":"bkdca434d7","cat":"맞춤형","type":"선다형","q":"자연보습인자(NMF)의 생성 기전에 대한 설명으로 옳은 것은?","explain":"NMF의 수용성 아미노산은 필라그린이 각질층 하층에서 표층으로 이동하며 단백질분해효소에 의해 분해된 산물이다. 층판과립은 세포간지질의 공급원이고, 멜라노좀은 멜라닌 합성 소기관이며, 섬유아세포는 진피의 세포외기질을 만든다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":329,"diff":2,"origin":"new","kind":"mcq","opts":["층판과립이 세포 밖으로 방출되어 그대로 NMF가 된다","필라그린이 각질층 내 단백질분해효소에 의해 분해되어 수용성 아미 "약 100만개 / 평균 10만여 개"],"answer":1},{"id":"bk6fd1a055","cat":"맞춤형","type":"선다형","q":"모발의 구조 그림에서 모간부를 이루는 세 층으로 옳게 묶인 것은?","explain":"모간부의 단면은 바깥에서 안쪽으로 모표피, 모피질, 모수질의 세 층으로 이루어진다. 내모근초·외모근초는 모낭에서 모발을 감싸는 부위다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":2,"origin":"new","kind":"mcq","opts":["모표피 - 모피질 - 모수질","모표피 - 모낭 - 모유두","내모근초 - 외모근초 - 모낭","모구부 - 모근부 - 모간부","각질층 - 과립층 - 유극층"],"answer":0},{"id":"bkb9e3f16a","cat":"맞춤형","type":"O/X","q":"모발의 단면 구조에서 가장 바깥층은 모수질이고 가장 안쪽이 모표피이다.","explain":"순서가 반대다. 가장 바깥이 모표피, 가운데가 모피질, 가장 안쪽이 모수질이다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":1,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk55cf2365","cat":"맞춤형","type":"선다형","q":"모구부(hair bulb)에 대한 설명으로 옳은 것은?","explain":"모구부는 모근부의 아랫부분으로 새로운 모발을 위한 세포분열이 일어나고 모발 성장·형성에 필요한 생물학적 반응이 진행되는 핵심 부분이며, 그 아래 움푹 팬 부분에 모유두가 들어있다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":2,"origin":"new","kind":"mcq","opts":["모근부의 아랫부분으로 새로운 모발을 위한 세포분열이 발생하는 모발 형성의 핵심 부분이다","피부 외부로 나온 모발의 줄기 부분이다","모발이 완전히 각화된 뒤 비듬이 되어 떨어지는 부위다","두피의 세 개 층 중 가장 바깥층이다","피지를 분비하여 모발을 코팅하는 기관이다"],"answer":0},{"id":"bk8b9e5bc3","cat":"맞춤형","type":"단답형","q":"모근의 최하부에 위치하여 모세혈관이 엉켜 있어 두발을 성장시키는 영양분과 산소를 운반하는 역할을 하는 부위는?","explain":"모유두다. 모유두와 접하고 있는 모모세포가 영양분을 받아 분열하고, 분열된 세포가 각화하면서 두발을 만들며 두피 밖으로 밀려나온다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":2,"origin":"new","kind":"short","ans":["모유두","hair papilla","모유두(hair papilla)"]},{"id":"bk3df86eb0","cat":"맞춤형","type":"혼동쌍구분","q":"모유두(hair papilla)와 모모세포(germinal matrix)를 바르게 구분한 것은?","explain":"모유두는 모근 최하부에서 모세혈관을 통해 영양분과 산소를 운반하는 '조직'이고, 모모세포는 모유두에 접하여 영양분을 흡수해 분열·증식함으로써 두발을 실제로 만들어 내는 '세포'다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":3,"origin":"new","kind":"mcq","opts":["모유두 — 모세혈관이 엉켜 영양분·산소를 운반 / 모모세포 — 영양분을 흡수해 분열·증식하여 두발을 형성","모유두 — 두발을 만들어 내는 세포 / 모모세포 — 모세혈관이 엉켜 있는 부위","둘 다 피부 외부에 위치한다","모유두는 모간부에, 모모세포는 모구부에 있다","모모세포는 비듬이 되어 떨어져 나간다"],"answer":0},{"id":"bkb926c3f3","cat":"맞춤형", 0fe2","cat":"맞춤형","type":"선다형","q":"교재의 '진피 내 부속기관' 모식도에 표시된 기관이 아닌 것은?","explain":"모식도에는 피지선, 에크린선(소한선), 아포크린선(대한선)과 모발·모낭이 표피·진피·피하조직과 함께 표시되어 있다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":333,"diff":1,"origin":"new","kind":"mcq","opts":["피지선","에크린선(소한선)","아포크린선(대한선)","모낭","췌장"],"answer":4},{"id":"bke61d6c2f","cat":"맞춤형","type":"선다형","q":"접촉 피부염의 증상 특징으로 교재에 제시되지 않은 것은?","explain":"접촉 피부염의 증상은 발진 및 발적, 다양한 발병 위치, 가려움증, 발병 시기의 다양성, 급성 및 만성, 원인물질의 다양성으로 서술된다. 전신 대칭 발생은 언급되지 않는다.","subj":"맞춤형","chap":"CHAPTER 04 피부의 생리구조","page":337,"diff":2,"origin":"new","kind":"mcq","opts":["발진 및 발적","다양한 발병 위치","가려움증","발병 시기의 다양성, 급성 및 만성","반드시 전신에 대칭적으로 발생"],"answer":4},{"id":"bkfba58483","cat":"맞춤형","type":"단답형","q":"모발에서 피부 외부에 위치한 부분을 가리키는 용어의 영문 표기는?","explain":"피부 외부에 위치한 부분이 모간(hair shaft), 피부 내부에 위치한 부분이 모근(hair root)이다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":2,"origin":"new","kind":"short","ans":["hair shaft","모간","hair shaft(모간)"]},{"id":"bk8b14b482","cat":"맞춤형","type":"빈칸채우기","q":"모구부의 아래 움푹 팬 부분에는 ( )세포층에서 나온 모유두가 들어있다. 괄호에 들어갈 말은?","explain":"모구부 아래 움푹 팬 부분에는 진피세포층에서 나온 모유두가 들어있다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":341,"diff":3,"origin":"new","kind":"short","ans":["진피","진피세포층","진피 세포층"]},{"id":"bk5993494a","cat":"맞춤형","type":"단답형","q":"내모근초를 이루는 세 층 중 표피의 과립층에 해당하는 층의 이름은?","explain":"내모근초는 모발에 접하는 부위부터 초표피(표피의 각질층), 헉슬리층(과립층), 헨레층(유극층)으로 구성된다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":342,"diff":3,"origin":"new","kind":"short","ans":["헉슬리층","헉슬리층(과립층)","Huxley layer","헉슬리"]},{"id":"bk979d3c92","cat":"맞춤형","type":"단답형","q":"두피에서 수축과 이완을 통해 모공을 개폐하여 체온을 유지하는 근육의 이름은?","explain":"입모근은 수축·이완으로 모공을 개폐해 체온을 유지하며, 모세혈관의 혈류량 조절과 함께 체온을 조절한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":344,"diff":2,"origin":"new","kind":"short","ans":["입모근","기모근","arrector pili"]},{"id":"bk60e52185","cat":"맞춤형","type":"선다형","q":"두피의 보호 기능에 대한 설명으로 옳지 않은 것은?","explain":"두피 표면은 '산성막'으로 되어 있어 외부 감염과 미생물의 침입으로부터 두피를 보호한다. 알칼리성막이라는 서술은 틀렸다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":343,"diff":2,"origin":"new","kind":"mcq","opts":["멜라닌 색소와 표피는 광선으로부터 두피를 보호한다","표면이 산성막으로 되어 있어 외부 감염과 미생물의 침입으로부터 두피를 보호한다","각질층, 피하조직, 결합조직으로 인해 외부 마찰에 대응한다","두피가 건조되지 않도록 한다","표면이 알칼리성막으로 되어 있어 미생물의 증식을 촉진한다"],"answer":4},{"id":"bkdaab3fc1","cat":"맞춤형","type":"선다형","q":"원형 탈모증에 대한 설명으로 옳지 않은 것은?","explain":"원형 탈모증은 재발가능성이 있으며, 모발이 다시 자라는 것과 모발 감소가 번갈아가며 나타날 수 있다. 나머지 선지는 모두 교재의 원형 탈모증 설명 그대로다. 특히 '일과성 탈모질환'이라는 점, '대부분 스트레스에 의한 것'이라는 점을 함께 기억한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"mcq","opts":["급격하게 모발이 떨어지는 특징을 가진다.","갑자기 모발이 뿌리에서 떨어져 원형 또는 타원형의 범위를 형성한다.","대부분 스트레스에 의한 것이나 유전적 소인, 알레르기, 자가 면역성 소인 등 복합적 요인으로 발생한다.","한 번 발생하면 재발하지 않으며 모발이 다시 자라는 일도 없다.","전체적으로 확산되어 모발 전체의 감소를 초래하면 전체성 탈모라고 한다."],"answer":3},{"id":"bk49ca2d90","cat":"맞춤형","type":"선다형","q":"교재가 제시한 '모발의 성장 및 탈모와 관계있는 호르몬'에 포함되지 않는 것은?","explain":"교재가 나열한 호르몬은 테스토스테론, DHT, 에스트로겐, 프로게스테론, 갑상선 호르몬, 인슐린, 스트레스 호르몬(코티솔)이다. 옥시토신은 여기에 포함되지 않는다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"mcq","opts":["테스토스테론","프로게스테론","갑상선 호르몬","옥시토신","코티솔"],"answer":3},{"id":"bk2aa37a24","cat":"맞춤형","type":"선다형","q":"다이어트로 결핍될 경우 탈모를 촉진한다고 교재가 제시한 미네랄에 해당하지 않는 것은?","explain":"교재는 미네랄로 아연·철·마그네슘을 들었다. 칼슘은 해당 목록에 없다. 함께 제시된 비타민은 D, A, E, C이며 단백질 결핍도 탈모를 촉진한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":2,"origin":"new","kind":"mcq","opts":["아연","철","마그네슘","칼슘"],"answer":3},{"id":"bkf6a473ee","cat":"맞춤형","type":"선다형","q":"식품의약품안전처 고시 탈모 기능성 성분으로 볼 수 없는 것은?","explain":"고시 탈모 기능성 성분은 덱스판테놀, 비오틴, 엘-멘톨, 징크피리치온 4가지다. 살리실릭애씨드는 보존제(및 여드름성 피부 완화 성분)로 탈모 기능성 고시 성분이 아니다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":2,"origin":"new","kind":"mcq","opts":["덱스판테놀","비오틴","엘-멘톨","징크피리치온","살리실릭애씨드"],"answer":4},{"id":"bkab097c95","cat":"맞춤형","type":"선다형","q":"외부포장에 '질병의 예방 및 치료를 위한 의약품이 아님'이라는 문구를 기재해야 하는 화장품법 시행규칙 제2조 제8호~제11호 기능성화장품에 해당하지 않는 것은?","explain":"제8호~제11호는 탈모, 여드름, 피부장벽, 튼살이다. 미백은 제1호 계열로 해당 문구 기재 대상이 아니다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":3,"origin":"new","kind":"mcq","opts":["탈모 증상의 완화에 도움을 주는 화장품","여드름성 피부를 완화하는 데 도움을 주는 화장품","피부장벽의 기능을 회복하여 가려움 등의 개선에 도움을 주는 화장품","튼살로 인한 붉은 선을 엷게 하는 데 도움을 주는 화장품","피부의 미백에 도움을 주는 화장품"],"answer":4},{"id":"bk8386df5a","cat":"맞춤형","type":"선다형","q":"모표피(Cuticle)에 대한 설명으로 옳지 않은 것은?","explain":"모표피는 화학적 저항성이 강한 층이다. 친수성을 띠어 화학약품의 작용을 쉽게 받는 층은 모피질(Cortex)이다. 나머지는 모두 교재의 모표피 설명과 일치한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":2,"origin":"new","kind":"mcq","opts":["색깔이 없는 투명층이며 모간의 가장 외측 부분으로 비늘 형태로 겹쳐져 있다.","판상 형태의 세포로 일반적으로 5~15층이며 20층인 것도 있다.","전체 두발의 10~15%를 차지한다.","친수성이 강해 화학약품의 작용을 쉽게 받는 층이다.","두꺼울수록 두발은 단단하고 저항성이 높다."],"answer":3},{"id":"bk86437ead","cat":"맞춤형","type":"선다형","q":"최외각층으로 소수성을 띠며 화학약품에 저항성이 강하고, 물은 통과시키지 못하지만 수증기와 공기는 통과시키며 물리적인 자극에 약한 모표피의 층은?","explain":"에피큐티클에 대한 설명이다. 엑소큐티클은 시스틴이 많아 펌제의 작용을 받기 쉽고, 엔도큐티클은 시스틴이 적고 친수성이며 알칼리에 약하다. CMC는 층이 아니라 접착체 역할을 하는 세포막복합체다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":2,"origin":"new","kind":"mcq","opts":["에피큐티클(Epicuticle)","엑소큐티클(Exocuticle)","엔도큐티클(Endocuticle)","세포막복합체(CMC)"],"answer":0},{"id":"bk39ef561e","cat":"맞춤형","type":"선다형","q":"시스틴이 많이 포함되어 있어 펌제 등의 작용을 받기 쉬우며 비교적 소수성인 모표피의 층은?","explain":"엑소큐티클이다. 시스틴이 많다는 점이 핵심으로, 퍼머넌트웨이브 1제(환원제)의 작용을 받는 층이다. 엔도큐티클은 반대로 시스틴 함유량이 적다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":2,"origin":"new","kind":"mcq","opts":["에피큐티클(Epicuticle)","엑소큐티클(Exocuticle)","엔도큐티클(Endocuticle)","모피질(Cortex)"],"answer":1},{"id":"bk02b7db7c","cat":"맞춤형","type":"선다형","q":"시스틴 함유량이 적으며 알칼리에 약하고 친수성을 띠는 모표피의 층은?","explain":"엔도큐티클이다. 이 층의 내측은 세포막복합체(CMC)가 접착체 역할을 하여 인접한 모표피를 밀착시킨다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":2,"origin":"new","kind":"mcq","opts":["에피큐티클(Epicuticle)","엑소큐티클(Exocuticle)","엔도큐티클(Endocuticle)","모수질(Medulla)"],"answer":2},{"id":"bk569f8c39","cat":"맞춤형","type":"선다형","q":"모피질(Cortex)에 대한 설명으로 옳지 않은 것은?","explain":"모피질은 친수성을 띠기 때문에 화학약품의 작용을 쉽게 받는다. 그래서 염색·퍼머넌트웨이브와 밀접하게 관련된 층이다. 소수성으로 화학약품의 작용을 잘 받지 않는 것은 모표피(특히 에피큐티클)이다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"mcq","opts":["각화된 케라틴 피질세포가 두발의 길이 방향으로 규칙적으로 나열되어 있다.","피질세포 사이에 간층물질(matrix)이 채워져 있다.","소수성을 띠기 때문에 화학약품의 작용을 거의 받지 않는다.","멜라닌색소가 함유되어 모발의 색을 결정 짓는다.","모발의 색, 탄력, 강도, 모질 등을 결정하는 중요한 부위이다."],"answer":2},{"id":"bka0a76701","cat":"맞춤형","type":"선다형","q":"모수질(Medulla)에 대한 설명으로 옳지 않은 것은?","explain":"모수질이 '많은' 두발이 웨이브 펌이 잘되고, 모수질이 적은 두발은 웨이브 형성이 잘 안 되는 경향이 있다. 방향이 반대인 선지다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"mcq","opts":["모발의 가장 중심부로 빈 구멍이 존재한다.","약간의 멜라닌 색소와 시스틴이 함유되어 있다.","굵은 모발에서만 발견되며 모발에 따라 존재하지 않을 수 있다.","한랭지 서식 동물의 털에서 비율이 높아 보온의 역할을 하는 것으로 본다.","모수질이 적은 두발일수록 웨이브 펌이 잘 되는 경향이 있다."],"answer":4},{"id":"bk28709675","cat":"맞춤형","type":"선다형","q":"멜라닌색소를 함유하여 모발의 색을 결정하고 탄력·강도·모질까지 좌우하며 염색과 퍼머넌트웨이브에 직접 관여하는 모발의 층은?","explain":"모피질(Cortex)이다. 두발 대부분(85~90%)을 차지하고 친수성이어서 화학 시술의 주 무대가 된다. 모표피는 보호·저항층, 모수질은 중심부의 빈 구멍 부위다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":1,"origin":"new","kind":"mcq","opts":["모표피","모피질","모수질","모낭"],"answer":1},{"id":"bk7e921da7","cat":"맞춤형","type":"선다형","q":"탈색·염색의 원리에서 머리카락 속의 멜라닌 색소를 파괴하여 두발 원래의 색을 지워주는 역할을 하는 것은?","explain":"멜라닌 탈색은 산화제인 과산화수소가 담당한다. 암모니아(알칼리제)는 모표피를 손상시켜 약제 통로를 형성하고, 염료는 파괴된 멜라닌 자리에 착색된다. 치오글라이콜릭애씨드는 환원제로 퍼머넌트웨이브·제모제에 쓰인다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"mcq","opts":["암모니아(알칼리제)","과산화수소(산화제)","치오글라이콜릭애씨드(환원제)","염료","계면활성제"],"answer":1},{"id":"bkb373aca5","cat":"맞춤형","type":"선다형","q":"퍼머넌트웨이브에서 1제와 2제의 역할을 옳게 설명한 것은?","explain":"1제(환원제, 치오글라이콜릭애씨드)가 시스틴 결합을 절단(시스테인 절단)하고, 2제(산화제·중화제, 과산화수소)가 절단된 시스틴 결합을 재결합(시스테인 재형성)시킨다. 알칼리제(암모니아)는 약제 통로를 형성한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"mcq","opts":["1제는 환원제로 시스틴 결합을 절단하고, 2제는 산화제(중화제)로 시스틴 결합을 재결합시킨다.","1제는 산화제로 시스틴 결합을 재결합시키고, 2제는 환원제로 시스틴 결합을 절단한다.","1제와 2제 모두 과산화수소를 주성분으로 한다.","1제는 멜라닌을 파괴하고 2제는 염료를 착색시킨다.","1제는 모표피를 밀착시키고 2제는 모표피를 팽윤시킨다."],"answer":0},{"id":"bk3dcdab3d","cat":"맞춤형","type":"선다형","q":"탈색·염색이 이루어지는 순서로 옳은 것은?","explain":"① 약제 통로 형성(알칼리제/암모니아) → ② 멜라닌 탈색(산화제/과산화수소) → ③ 염색약 착색(염료) 순이다. 염색약을 도포한 후 충분한 시간을 두는 이유는 멜라닌 파괴와 염료 착색에 시간이 필요하기 때문이다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"mcq","opts":["약제 통로 형성 → 멜라닌 탈색 → 염색약 착색","멜라닌 탈색 → 약제 통로 형성 → 염색약 착색","염색약 착색 → 약제 통로 형성 → 멜라닌 탈색","약제 통로 형성 → 염색약 착색 → 멜라닌 탈색","멜라닌 탈색 → 염색약 착색 → 약제 통로 형성"],"answer":0},{"id":"bk5b361ada","cat":"맞춤형","type":"선다형","q":"모표피를 이루는 3개 층을 최외층에서 안쪽 방향으로 옳게 나열한 것은?","explain":"에피큐티클(최외각) → 엑소큐티클 → 엔도큐티클 순이다. '에피-엑소-엔도'로 외워두면 순서가 헷갈리지 않는다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":2,"origin":"new","kind":"mcq","opts":["에피큐티클 → 엑소큐티클 → 엔도큐티클","엔도큐티클 → 엑소큐티클 → 에피큐티클","엑소큐티클 → 에피큐티클 → 엔도큐티클","에피큐티클 → 엔도큐티클 → 엑소큐티클","엔도큐티클 → 에피큐티클 → 엑소큐티클"],"answer":0},{"id":"bka3887017","cat":"맞춤형","type":"선다형","q":"모발의 성장주기 중 영문 명칭이 'Catagen'인 시기는?","explain":"성장기 Anagen, 퇴화기 Catagen, 휴지기 Telogen, 발생기 New Anagen이다. Catagen은 모구부가 모유두와 분리를 시작하는 짧은 시기(2~3주)다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":349,"diff":1,"origin":"new","kind":"mcq","opts":["성장기","퇴화기","휴지기","발생기"],"answer":1},{"id":"bk597ddfa6","cat":"맞춤형","type":"선다형","q":"교재가 제시한 탈모의 원인으로 보기 어려운 것은?","explain":"교재는 탈모의 원인으로 유전, 호르몬, 스트레스, 식생활 습관, 모발 공해, 노화, 기타(지루성 피부염·건선·아토피·항암제 치료·방사선 요법·염증성 질환)를 제시한다. 오히려 '수분섭취 제한'이 탈모를 가속화한다고 하였으므로 과도한 수분 섭취는 원인으로 제시되지 않았다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"mcq","opts":["유전(AR 유전자 변이)","호르몬 불균형","스트레스","동물성 지방의 과다섭취","과도한 수분 섭취"],"answer":4},{"id":"bka7c32ef3","cat":"맞춤형","type":"선다형","q":"탈모의 원인 중 '기타'로 교재가 나열한 질환·요인에 해당하지 않는 것은?","explain":"교재의 기타 항목은 지루성 피부염, 건선, 아토피, 항암제 치료, 방사선 요법, 염증성 질환이다. 백반증은 포함되지 않는다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":2,"o 알칼리에 약하다.","에피큐티클은 친수성이고 알칼리에 약한 반면, 엔도큐티클은 소수성이고 화학약품에 저항성이 강하다.","두 층 모두 시스틴 함유량이 많아 펌제의 작용을 쉽게 받는다.","에피큐티클은 물을 통과시키지만 수증기와 공기는 통과시키지 못한다.","엔도큐티클이 최외각층이고 에피큐티클이 가장 안쪽 층이다."],"answer":0},{"id":"bk28d50667","cat":"맞춤형","type":"혼동쌍구분","q":"모발의 성장주기 중 퇴화기(Catagen)와 휴지기(Telogen)를 옳게 비교한 것은?","explain":"퇴화기는 모구부가 모유두와 분리를 '시작'하는 단계(전체 1%, 2~3주)이고, 휴지기는 모구부가 모유두와 '완전히' 분리된 단계(약 11%, 2~3개월)다. 시험에서 '분리 시작'과 '완전 분리'를 바꿔놓는 함정이 자주 나온다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":349,"diff":3,"origin":"new","kind":"mcq","opts":["퇴화기에는 모구부가 모유두와 분리를 시작하고, 휴지기에는 모구부가 모유두와 완전히 분리된다.","퇴화기에는 모구부가 모유두와 완전히 분리되고, 휴지기에는 분리가 시작된다.","퇴화기가 휴지기보다 기간이 길다.","휴지기에는 모모세포의 유사분열이 가장 활발하다.","퇴화기에 전체 모발의 11%, 휴지기에 1%가 해당된다."],"answer":0},{"id":"bkb5097607","cat":"맞춤형","type":"혼동쌍구분","q":"모유두와 모기질(모모세포)의 역할을 옳게 비교한 것은?","explain":"모유두는 모세혈관과 신경계통이 모여 있어 영양분·산소·성장인자를 위로 전달하고, 모기질은 세포분열이 일어나 모발이 실제로 만들어지는 핵심 부위다. 둘 다 모근부에 있어 헷갈리기 쉽다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":350,"diff":2,"origin":"variant","kind":"mcq","opts":["모유두는 영양분·산소·성장인자를 전달하는 부위이고, 모기질은 세포분열이 일어나는 모발 형성의 핵심 부위이다.","모유두는 세포분열이 일어나는 부위이고, 모기질은 영양분을 전달하는 부위이다.","모유두와 모기질은 모두 모간에 위치한다.","모기질은 모근을 감싸 모발이 두피 밖으로 나올 때까지 보호하는 부위이다.","모유두는 비듬이 되어 떨어져 나가는 부위이다."],"answer":0},{"id":"bkcfbaa812","cat":"맞춤형","type":"단답형","q":"원형 탈모증이 전체적으로 확산하여 모발 전체의 감소를 초래하는 것을 무엇이라 하는가?","explain":"원형 탈모증이 확산되어 모발 전체가 감소하면 전체성 원형 탈모증 또는 전체성 탈모라 한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"short","ans":["전체성 원형 탈모증","전체성 탈모","전체성 원형탈모증","전체성 원형 탈모"]},{"id":"bk726ebd08","cat":"맞춤형","type":"단답형","q":"탈모를 일으키며 상염색체성 유전을 하는 유전자 AR을 우리말로 무엇이라 하는가?","explain":"AR(Androgen Receptor, 안드로겐 수용체)는 상염색체성 유전을 하며, 테스토스테론 수준과 DHT 생성에 관련된 변이가 AR 유전자의 활성화를 조절한다. 높은 DHT 수준이 모발 손실을 촉진한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":3,"origin":"new","kind":"short","ans":["안드로겐 수용체","안드로젠 수용체","Androgen Receptor","AR","남성호르몬 수용체"]},{"id":"bk64885e25","cat":"맞춤형","type":"빈칸채우기","q":"스트레스는 (        ) 탈모(telogen effluvium), 코티솔 수치상승, 자가면역 질환 활성화, 습관적 모발 뽑기, 영양부족을 유발하여 탈모를 가속화한다. 괄호에 들어갈 말은?","explain":"telogen effluvium은 휴지기 탈모를 말한다. telogen(휴지기)이라는 성장주기 용어와 연결해 기억한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"short","ans":["휴지기","휴지기 탈모","telogen","텔로겐"]},{"id":"bke1ccddc2","cat":"맞춤형","type":"단답형","q":"다이어트로 인해 결핍되면 탈모가 촉진된다고 교재가 제시한 비타민 4가지를 쓰시오.","explain":"교재는 단백질, 비타민(D, A, E, C), 미네랄(아연, 철, 마그네슘)의 결핍을 탈모 촉진 요인으로 든다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":2,"origin":"new","kind":"short","ans":["D, A, E, C","비타민 D, A, E, C","D A E C","A, C, D, E","비타민 A, C, D, E"]},{"id":"bk0a307172","cat":"맞춤형","type":"단답형","q":"식품의약품안전처가 고시한 탈모 증상 완화 기능성 성분 4가지를 쓰시오.","explain":"덱스판테놀·비오틴·엘-멘톨·징크피리치온 4가지다. 이 중 징크피리치온만 사용상의 제한이 필요한 원료로 별도의 사용한도가 있다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":2,"origin":"new","kind":"short","ans":["덱스판테놀, 비오틴, 엘-멘톨, 징크피리치온","덱스판테놀 비오틴 엘멘톨 징크피리치온","덱스판테놀, 비오틴, 엘멘톨, 징크피리치온","비오틴, 덱스판테놀, 엘-멘톨, 징크피리치온"]},{"id":"bk76948c22","cat":"맞춤형","type":"빈칸채우기","q":"엔도큐티클의 내측에서 접착체 역할을 하여 인접한 모표피를 밀착시키는 물질을 (        )라고 한다.","explain":"세포막복합체(CMC, Cell Membrane Complex)다. 모피질을 구성하는 성분으로도 언급된다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":347,"diff":3,"origin":"new","kind":"short","ans":["세포막복합체","CMC","세포막복합체(CMC)","세포막 복합체"]},{"id":"bk88197e57","cat":"맞춤형","type":"단답형","q":"퍼머넌트웨이브 1제와 제모제에 공통으로 사용되어 시스틴 결합을 화학적으로 절단하는 환원제 성분은?","explain":"치오글라이콜릭애씨드는 환원제로서 퍼머넌트웨이브 1제에서 시스틴 결합을 절단하고, 제모제에서는 체모의 시스틴 결합을 절단하여 제거한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"short","ans":["치오글라이콜릭애씨드","치오글리콜산","티오글리콜산","치오글라이콜릭 애씨드","thioglycolic acid"]},{"id":"bk8521b9e6","cat":"맞춤형","type":"빈칸채우기","q":"제모제는 체모의 (        ) 결합을 환원제(치오글라이콜릭애씨드)로 화학적으로 절단하여 제거하는 원리를 이용한다.","explain":"시스틴 결합(이황화 결합, S-S 결합)이다. 황(S) 원자끼리의 결합으로 케라틴 단백질의 강도를 결정한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":2,"origin":"new","kind":"short","ans":["시스틴","이황화","디설파이드","S-S"]},{"id":"bk1628cca8","cat":"맞춤형","type":"빈칸채우기","q":"휴지기에는 모낭이 수축하여 입모근 근처까지 올라오며, 이때 모낭의 깊이는 (        )이 된다.","explain":"휴지기에 모낭 깊이는 1/3이 된다. 이 상태에서 모발은 단순히 모낭 안에 존재하므로 샴푸나 브러싱으로 자연스럽게 빠질 수 있다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":349,"diff":3,"origin":"new","kind":"short","ans":["1/3","3분의 1","삼분의 일","1/3로"]},{"id":"bkce0ada22","cat":"맞춤형","type":"단답형","q":"모모세포가 다시 활발히 분열을 시작하며 새로운 모발 성장이 개시되는 매우 짧은 시기로, 보통 성장기의 초기 단계로 포함시켜 설명하는 모발 성장주기 단계는?","explain":"발생기(New Anagen)다. 성장주기를 4단계로 볼 때 성장기-퇴화기-휴지기-발생기이며, 발생기는 보통 성장기 초기로 포함시킨다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":349,"diff":2,"origin":"new","kind":"short","ans":["발생기","New Anagen","발생기(New Anagen)","뉴 아나겐"]},{"id":"bkd10131ad","cat":"맞춤형","type":"빈칸채우기","q":"모피질에서 각화된 케라틴 피질세포 사이를 채우고 있는 물질을 (        )이라고 한다.","explain":"간층물질(matrix)이다. 교재 연습문제에서는 '섬유다발과 간충 물질이 채우고 있는 부분'으로 모피질을 설명한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":348,"diff":3,"origin":"new","kind":"short","ans":["간층물질","matrix","간충물질","간층물질(matrix)","매트릭스"]},{"id":"bk1adbd728","cat":"맞춤형","type":"O/X","q":"탈모를 일으키는 유전자(AR, Androgen Receptor)는 성염색체를 통한 반성유전을 한다.","explain":"AR 유전자는 상염색체성 유전을 한다. '상염색체성'을 '반성(성염색체)'으로 바꿔놓는 함정에 주의한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":2,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bkb0288cf7","cat":"맞춤형","type":"O/X","q":"동물성 지방의 과다섭취는 혈중 콜레스테롤을 증가시켜 모근의 영양공급을 악화시킨다.","explain":"교재의 식생활 습관 항목 그대로다. 반대로 수분섭취 제한, 과도한 열량 섭취, 불규칙한 식사, 비건 또는 극단적 식이제한도 탈모를 가속화한다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":345,"diff":1,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk90d09c49","cat":"맞춤형","type":"O/X","q":"징크피리치온은 씻어내지 않는 기타 제품에도 총 1.0%까지 사용할 수 있다.","explain":"징크피리치온은 기타 제품에는 사용금지다. 1.0%는 샴푸, 린스 및 탈모 기능성 화장품에 적용되는 총 한도이며, 보존제로서 사용 후 씻어내는 제품에는 0.5%다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":346,"diff":3,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk51d787ee","cat":"맞춤형","type":"O/X","q":"모수질이 많은 두발은 웨이브 펌이 잘되고, 모수질 ook","kind":"short","ans":["에피큐티클, 엑소큐티클, 엔도큐티클","에피큐티클-엑소큐티클-엔도큐티클","에피큐티클 엑소큐티클 엔도큐티클","Epicuticle, Exocuticle, Endocuticle"]},{"id":"bk39821572","cat":"맞춤형","type":"빈칸채우기","q":"(        )결합이란, 황(S) 원자끼리 산화 반응을 통해 결합을 형성하는데 특히 머리카락의 케라틴 단백질에서는 해당 결합이 많을수록 구조가 단단해지고, 퍼머넌트 웨이브는 이 결합을 화학적으로 조절하여 형태를 변화시킨다.","explain":"교재 인쇄 정답은 '시스틴 or 이황화'다. 시스테인 2개가 결합해 시스틴이 되며, 이 S-S 결합을 환원제로 끊고 산화제로 다시 잇는 것이 퍼머넌트웨이브의 원리다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":351,"diff":2,"origin":"book","kind":"short","ans":["시스틴","이황화","시스틴결합","이황화결합","디설파이드"]},{"id":"bkf46d0a5f","cat":"맞춤형","type":"선다형","q":"모발의 성장주기에 대한 설명으로 옳지 않은 것은?","explain":"교재 인쇄 정답은 ④이며, '모구부가 모유두와 분리가 되기 시작한다'는 것은 퇴화기의 내용이다. 휴지기에서는 모구부가 모유두와 '완전히' 분리된다.","subj":"맞춤형","chap":"CHAPTER 05 모발의 생리구조","page":351,"diff":2,"origin":"book","kind":"mcq","opts":["성장기에는 모모세포가 지속적으로 유사분열을 진행한다.","성장기는 보통 여성이 남성보다 더 길다.","퇴화기는 휴지기보다 기간이 짧다.","휴지기에서 모구부는 모유두와 분리가 되기 시작한다.","휴지기에는 브러싱 등으로 모발이 자연스럽게 빠질 수 있다."],"answer":3},{"id":"bk536ed561","cat":"맞춤형","type":"선다형","q":"피부 보습도 분석법에 해당하지 않는 것은?","explain":"Replica 분석법은 피부 '주름' 분석법에 속한다. 보습도 분석법은 육안 및 침투적 방법을 통한 각질 수분량 측정, corneometer, TEWL, 전기적 저항·정전·전도 측정, 광학적 분석, 웨어러블 장비다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":352,"diff":2,"origin":"new","kind":"mcq","opts":["피부수분함유도 변화를 corneometer로 측정","경피수분손실량(TEWL) 측정","전기적 저항·정전·전도를 통한 피부수분측정","Replica 분석법","핵자기공명, 라만분광광도계 등 광학적 분석을 통한 보습도 결정"],"answer":3},{"id":"bkfd23450b","cat":"맞춤형","type":"선다형","q":"피부의 수분함유량이 많아질 때 나타나는 변화로 옳은 것은?","explain":"수분이 많아지면 정전용량과 전기전도도는 증가하고 전기저항은 감소한다. 물이 전기를 잘 통하게 한다는 원리로 기억하면 헷갈리지 않는다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":352,"diff":2,"origin":"new","kind":"mcq","opts":["정전용량 증가, 전기전도도 증가, 전기저항 감소","정전용량 감소, 전기전도도 감소, 전기저항 증가","정전용량 증가, 전기전도도 감소, 전기저항 증가","정전용량 감소, 전기전도도 증가, 전기저항 감소","정전용량·전기전도도·전기저항 모두 증가"],"answer":0},{"id":"bk3207bf6c","cat":"맞춤형","type":"선다형","q":"피부 주름 분석법에 해당하지 않는 것은?","explain":"sebumeter는 피지분비 조절 분석에 사용되는 기기다. 주름 분석법은 시각적 평가 및 영상 촬영, Repl 은 1~9로 구분한다.","판정 등급 1이 가장 심한(severe intensity) 상태를 의미한다."],"answer":4},{"id":"bk5fc9b647","cat":"맞춤형","type":"선다형","q":"다크서클 완화 평가에서 피부의 멜라닌양을 평가하는 데 사용하는 장비는?","explain":"멜라닌양 평가는 mexameter MX18(또는 동등 기능 장비)로 한다. chromameter CR-400은 피부밝기 평가용이고, laser doppler perfusion imager는 피부 혈행 개선의 미세혈류량 측정기다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":353,"diff":3,"origin":"new","kind":"mcq","opts":["mexameter MX18","chromameter CR-400","laser doppler perfusion imager","sebumeter","cutometer"],"answer":0},{"id":"bk03525b1b","cat":"맞춤형","type":"선다형","q":"피부 혈행 개선 평가에서 미세혈류량을 측정하는 기기는?","explain":"laser doppler perfusion imager(미세혈류량 측정기)다. 피부 혈행 개선 평가에는 이 기기 외에 색차계(chromameter)를 사용한 피부붉기 평가가 있다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":353,"diff":3,"origin":"new","kind":"mcq","opts":["cutometer","corneometer","laser doppler perfusion imager","Wood's lamp","mexameter MX18"],"answer":2},{"id":"bkf5a62be4","cat":"맞춤형","type":"선다형","q":"피부 색소 침착 분석에 사용되는 우즈램프(Wood's lamp)가 이용하는 빛은?","explain":"우즈램프는 자외선A(365nm) 빛을 사용하여 피부 색소침착을 평가한다. 교재 연습문제에서도 '우드램프를 통해 피부 상태를 확인할 때 활용되는 전자기파'의 정답이 자외선(UV)이다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":353,"diff":3,"origin":"new","kind":"mcq","opts":["자외선A(365nm)","자외선B(310nm)","자외선C(254nm)","적외선(800nm)","가시광선(560nm)"],"answer":0},{"id":"bk9fe4d00a","cat":"맞춤형","type":"선다형","q":"색소침착 분석 방법의 활용에 대한 설명으로 옳은 것은?","explain":"UV램프 및 우즈램프는 주로 색소침착의 '표면적인' 변화를 확인하는 데 사용하고, 멜라닌 측정 및 피부 조직 분석과 같은 방법은 색소침착의 원인과 '내부적인' 변화를 파악하기 위해 더 깊은 분석을 제공한다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":354,"diff":2,"origin":"new","kind":"mcq","opts":["UV램프·우즈램프는 색소침착의 표면적인 변화 확인에, 멜라닌 측정 및 피부 조직 분석은 원인과 내부적 변화 파악에 활용된다.","UV램프·우즈램프는 색소침착의 원인과 내부적 변화 파악에, 멜라닌 측정은 표면적인 변화 확인에 활용된다.","두 방법 모두 색소침착의 표면적인 변화만 확인할 수 있다.","UV램프는 피부 탄력을, 멜라닌 측정은 피지량을 평가하는 방법이다.","멜라닌 측정은 색소침착의 표면적 변화만을 확인하는 간이 검사이다."],"answer":0},{"id":"bk5332c4e5","cat":"맞춤형","type":"선다형","q":"교재가 제시한 '모발 분석법'의 항목에 해당하지 않는 것은?","explain":"두피의 홍반 분석은 '두피 상태 분석'에 속한
