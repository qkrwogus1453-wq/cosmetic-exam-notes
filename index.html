<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤형화장품 조제관리사 종합 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6F7;
    --bg-tint:#FDECEF;
    --card:#FFFFFF;
    --ink:#4A3B44;
    --ink-soft:#8A7680;
    --line:#F1DCE1;
    --line-soft:#F7E8EC;
    --coral:#FF8BA0;
    --coral-deep:#F26B85;
    --lav:#B9A6E8;
    --lav-deep:#8E77C9;
    --mint:#7FD1C1;
    --correct:#3FB39A;
    --correct-bg:#E4F7F2;
    --correct-ink:#268F79;
    --wrong:#FF8BA0;
    --wrong-bg:#FFEBEF;
    --wrong-ink:#E05574;
    --sun:#FFD36B;
    --mono:'JetBrains Mono',monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    --hand:'Gaegu',cursive;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 100% -10%, #FFE9EF 0%, transparent 55%),
      radial-gradient(1000px 480px at -10% 8%, #EFEAFB 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:600px;margin:0 auto;padding:26px 16px 90px;}

  /* ── header ── */
  header.top{margin-bottom:18px;}
  .kicker{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    color:var(--coral-deep);background:#fff;
    border:1.5px solid var(--line);border-radius:999px;
    padding:5px 11px;margin-bottom:12px;
  }
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);}
  h1{
    font-size:24px;line-height:1.3;margin:0;font-weight:800;
    letter-spacing:-.02em;
  }
  h1 .accent{
    background:linear-gradient(transparent 62%, #FFE0B8 62%);
    padding:0 2px;
  }
  .sub{color:var(--ink-soft);font-size:13px;margin-top:6px;}

  /* ── controls ── */
  .panel{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 18px;
    margin-bottom:16px;
    box-shadow:0 8px 24px -14px rgba(242,107,133,.35);
  }
  .ctl-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    color:var(--ink-soft);text-transform:uppercase;margin:0 0 8px 2px;
  }
  .ctl-label:not(:first-child){margin-top:16px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-size:12.5px;font-weight:600;padding:8px 13px;
    border:1.5px solid var(--line);border-radius:999px;
    background:#fff;cursor:pointer;color:var(--ink-soft);
    transition:all .16s ease;font-family:var(--sans);
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip .n{font-family:var(--mono);font-size:11px;opacity:.7;}
  .chip:hover{border-color:var(--coral);color:var(--coral-deep);transform:translateY(-1px);}
  .chip.active{
    background:linear-gradient(135deg,var(--coral) 0%,var(--coral-deep) 100%);
    border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px var(--coral-deep);
  }
  .chip.active .n{opacity:.85;}
  .chip.small{font-size:11.5px;padding:7px 12px;}

  /* ── progress ── */
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:0 4px;}
  .progress-track{
    flex:1;height:9px;background:#fff;border:1.5px solid var(--line);
    border-radius:999px;overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:999px;width:0%;
    background:linear-gradient(90deg,var(--lav) 0%,var(--coral) 100%);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .streak{
    font-size:12px;font-weight:700;color:var(--coral-deep);white-space:nowrap;
    display:flex;align-items:center;gap:3px;
  }

  /* ── card ── */
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:26px;
    padding:26px 22px 24px;
    position:relative;
    box-shadow:0 18px 40px -22px rgba(142,119,201,.45);
  }
  .tag-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .cat-tag,.type-tag{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    border-radius:999px;padding:4px 10px;font-weight:600;
  }
  .cat-tag{color:var(--lav-deep);background:#F3EEFC;}
  .type-tag{color:var(--coral-deep);background:var(--bg-tint);}
  .type-tag.neg{color:var(--wrong-ink);background:#FFE7EC;}

  .q-text{
    font-size:17px;line-height:1.62;font-weight:700;margin:0 0 20px;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .q-text .num{
    font-family:var(--mono);color:var(--coral-deep);font-weight:700;
    margin-right:3px;
  }
  .q-text u{text-decoration:none;background:linear-gradient(transparent 60%,#D9CEF6 60%);padding:0 1px;}
  .q-text b{color:var(--coral-deep);}

  /* ── options ── */
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    width:100%;text-align:left;padding:14px 15px;
    border:1.5px solid var(--line);border-radius:16px;
    background:#fff;cursor:pointer;
    font-size:14.5px;font-family:var(--sans);color:var(--ink);
    transition:border-color .14s,background .14s,transform .1s;
    line-height:1.5;
  }
  .opt:hover:not(.locked){border-color:var(--coral);background:var(--bg-tint);transform:translateY(-1px);}
  .opt:active:not(.locked){transform:translateY(0);}
  .opt .letter{
    font-family:var(--mono);font-weight:700;font-size:13px;
    width:26px;height:26px;flex:none;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--bg-tint);color:var(--coral-deep);
    transition:all .14s;
  }
  /* 넘침 방지 핵심: 텍스트 span이 줄어들 수 있게 */
  .opt .txt{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
  .opt.locked{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-ink);}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong-ink);}
  .opt.wrong .letter{background:var(--wrong);color:#fff;}
  .opt.dim{opacity:.5;}

  /* ── explanation ── */
  .stamp-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .stamp{
    font-family:var(--hand);font-weight:700;font-size:22px;letter-spacing:.02em;
    padding:2px 16px;border:3px solid currentColor;border-radius:14px 20px 16px 22px/20px 16px 22px 14px;
    transform:rotate(-5deg) scale(.8);opacity:0;animation:stamp-in .3s cubic-bezier(.2,1.4,.4,1) forwards;
    line-height:1.4;
  }
  @keyframes stamp-in{to{transform:rotate(-5deg) scale(1);opacity:1;}}
  @media (prefers-reduced-motion:reduce){.stamp{animation:none;opacity:1;transform:rotate(-5deg);}}
  .stamp.ok{color:var(--correct);}
  .stamp.no{color:var(--wrong-ink);}

  .explain{
    margin-top:18px;padding:16px;border-radius:16px;background:var(--bg-tint);
    font-size:13.5px;line-height:1.7;color:var(--ink);display:none;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .explain.show{display:block;animation:fade-up .3s ease;}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .explain b{color:var(--coral-deep);}

  .compare{margin-top:14px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line-soft);background:#fff;}
  .compare-title{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
    background:linear-gradient(135deg,var(--lav) 0%,var(--lav-deep) 100%);
    color:#fff;padding:8px 12px;font-weight:600;
  }
  .compare table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  .compare td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  .compare tr:last-child td{border-bottom:none;}
  .compare td.label{
    width:58%;color:var(--ink-soft);font-weight:500;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .compare td.val{
    font-family:var(--mono);font-weight:700;color:var(--coral-deep);
    overflow-wrap:anywhere;
  }

  .next-btn{
    margin-top:20px;width:100%;padding:15px;
    background:linear-gradient(135deg,var(--coral) 0%,var(--coral-deep) 100%);
    color:#fff;border:none;border-radius:16px;
    font-family:var(--sans);font-weight:800;font-size:15px;cursor:pointer;
    display:none;box-shadow:0 10px 22px -10px var(--coral-deep);transition:transform .1s;
  }
  .next-btn.show{display:block;}
  .next-btn:active{transform:translateY(2px);}
  .next-btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.restart-btn:focus-visible{
    outline:2.5px solid var(--lav);outline-offset:2px;
  }

  /* ── result ── */
  .result{text-align:center;padding:16px 4px 6px;}
  .result .emoji{font-size:44px;line-height:1;margin-bottom:6px;}
  .ring{
    --p:0;
    width:150px;height:150px;margin:6px auto 10px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--coral) calc(var(--p)*1%), var(--line-soft) 0);
    transition:--p 1s ease;
  }
  .ring-inner{
    width:120px;height:120px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-inner .score{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--coral-deep);}
  .ring-inner .pct{font-size:12px;color:var(--ink-soft);font-family:var(--mono);}
  .result p{color:var(--ink-soft);font-size:14px;line-height:1.65;margin:6px auto 0;max-width:420px;overflow-wrap:anywhere;}
  .btn-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .restart-btn{
    padding:12px 18px;border:1.5px solid var(--line);border-radius:14px;
    font-weight:700;font-family:var(--sans);cursor:pointer;
    color:var(--ink);background:#fff;font-size:13.5px;transition:all .14s;
  }
  .restart-btn:hover{border-color:var(--coral);color:var(--coral-deep);}
  .restart-btn.primary{
    background:linear-gradient(135deg,var(--coral) 0%,var(--coral-deep) 100%);
    color:#fff;border-color:transparent;box-shadow:0 8px 18px -9px var(--coral-deep);
  }
  .restart-btn.retry{
    background:linear-gradient(135deg,var(--lav) 0%,var(--lav-deep) 100%);
    color:#fff;border-color:transparent;box-shadow:0 8px 18px -9px var(--lav-deep);
  }
  .missed-list{text-align:left;margin-top:24px;border-top:1.5px dashed var(--line);padding-top:18px;}
  .missed-head{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--wrong-ink);
    margin-bottom:10px;display:flex;align-items:center;gap:6px;
  }
  .missed-item{
    font-size:13px;padding:11px 13px;margin-bottom:8px;border-radius:12px;
    background:var(--wrong-bg);color:var(--ink);line-height:1.55;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .missed-item .mq{font-weight:600;margin-bottom:4px;}
  .missed-item .ma{font-family:var(--mono);color:var(--correct-ink);font-weight:700;}
  .missed-item .mx{font-family:var(--mono);color:var(--wrong-ink);text-decoration:line-through;opacity:.75;}

  /* ── mode toggle ── */
  .mode-toggle{
    display:flex;flex-wrap:wrap;gap:6px;padding:5px;margin-bottom:16px;
    background:var(--bg-tint);border-radius:14px;
  }
  .mode-btn{
    flex:1 1 30%;padding:10px 6px;border:none;border-radius:10px;cursor:pointer;
    font-family:var(--sans);font-weight:700;font-size:13px;white-space:nowrap;
    background:transparent;color:var(--ink-soft);transition:all .16s;
  }
  .mode-btn.active{
    background:#fff;color:var(--coral-deep);
    box-shadow:0 4px 12px -6px rgba(242,107,133,.5);
  }

  /* ── 단답형 입력 ── */
  .sa-wrap{display:flex;gap:9px;margin-top:6px;flex-wrap:wrap;}
  .sa-input{
    flex:1;min-width:190px;padding:15px 17px;border-radius:16px;
    border:2px solid var(--line);background:#fff;color:var(--ink);
    font-family:var(--sans);font-size:16px;font-weight:600;outline:none;transition:border-color .15s;
  }
  .sa-input:focus{border-color:var(--coral);}
  .sa-input.ok{border-color:var(--correct);background:var(--correct-bg);}
  .sa-input.no{border-color:var(--wrong);background:var(--wrong-bg);}
  .sa-btn{
    padding:15px 22px;border:none;border-radius:16px;cursor:pointer;
    background:var(--coral);color:#fff;font-family:var(--sans);font-weight:800;font-size:15px;
    transition:background .15s;
  }
  .sa-btn:hover{background:var(--coral-deep);}
  .sa-btn.ghost{background:var(--bg-tint);color:var(--ink-soft);}
  .sa-ans{
    margin-top:12px;padding:13px 16px;border-radius:14px;
    background:var(--bg-tint);font-size:14.5px;font-weight:700;color:var(--ink);
  }
  .sa-ans small{display:block;font-weight:600;color:var(--ink-soft);font-size:12.5px;margin-top:4px;}

  /* ── 교재 배지 ── */
  .page-tag{
    margin-left:auto;padding:4px 10px;border-radius:999px;
    background:var(--bg-tint);color:var(--ink-soft);
    font-size:11.5px;font-weight:800;white-space:nowrap;
  }
  .book-tag{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;}
  .book-tag.bk{background:#E4F7F2;color:#268F79;}
  .book-tag.vr{background:#EEF3FF;color:#5A79C8;}
  .book-tag.law{background:#FFF4DC;color:#B98218;}
  .book-tag.fix{background:#FFEBEF;color:#E05574;}
  .book-tag.ing{background:#F3EEFC;color:#7B62BD;}
  .sub-label{margin-top:2px;}

  /* ── OX buttons ── */
  .ox-options{display:flex;gap:12px;margin-top:4px;}
  .ox-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:22px 10px;border-radius:18px;cursor:pointer;
    border:2px solid var(--line);background:#fff;font-family:var(--sans);
    transition:all .14s;
  }
  .ox-btn:hover:not(.locked){transform:translateY(-2px);}
  .ox-btn.o:hover:not(.locked){border-color:var(--correct);}
  .ox-btn.x:hover:not(.locked){border-color:var(--wrong);}
  .ox-btn .ox-mark{font-size:40px;line-height:1;font-weight:800;}
  .ox-btn.o .ox-mark{color:var(--correct);}
  .ox-btn.x .ox-mark{color:var(--wrong-ink);}
  .ox-btn .ox-label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .ox-btn.locked{cursor:default;}
  .ox-btn.picked-correct{background:var(--correct-bg);border-color:var(--correct);}
  .ox-btn.picked-wrong{background:var(--wrong-bg);border-color:var(--wrong);}
  .ox-btn.reveal{border-style:dashed;}
  .ox-btn.dim{opacity:.4;}

  /* ── quick actions (누적오답/통계) ── */
  .quick-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .quick-btn{
    flex:1;min-width:140px;
    display:flex;align-items:center;gap:10px;
    padding:11px 13px;border-radius:14px;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;
    font-family:var(--sans);text-align:left;transition:all .14s;
  }
  .quick-btn:hover:not(:disabled){border-color:var(--coral);transform:translateY(-1px);}
  .quick-btn:disabled{opacity:.5;cursor:default;}
  .quick-btn .ic{font-size:18px;line-height:1;}
  .quick-btn .qt{font-size:12.5px;font-weight:700;color:var(--ink);}
  .quick-btn .qs{font-size:11px;color:var(--ink-soft);font-family:var(--mono);margin-top:1px;}

  /* ── stats panel ── */
  .stats{display:none;margin-top:14px;}
  .stats.show{display:block;animation:fade-up .3s ease;}
  .stat-row{
    display:flex;align-items:center;gap:10px;margin-bottom:9px;
  }
  .stat-name{width:74px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink);}
  .stat-bar{
    flex:1;height:16px;border-radius:999px;background:var(--line-soft);
    overflow:hidden;position:relative;
  }
  .stat-fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .stat-fill.hi{background:linear-gradient(90deg,var(--mint),var(--correct));}
  .stat-fill.mid{background:linear-gradient(90deg,var(--sun),var(--coral));}
  .stat-fill.lo{background:linear-gradient(90deg,var(--coral),var(--coral-deep));}
  .stat-fill.none{background:var(--line);}
  .stat-num{width:78px;flex:none;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .stat-num.weak{color:var(--coral-deep);font-weight:700;}
  .stat-num.thin{opacity:.55;}
  .stats-note{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
  .stats-reset{
    margin-top:12px;font-size:11.5px;color:var(--ink-soft);
    background:none;border:none;text-decoration:underline;cursor:pointer;font-family:var(--sans);
  }

  footer{
    text-align:center;margin-top:28px;font-size:11.5px;
    color:var(--ink-soft);opacity:.85;line-height:1.7;
  }
  footer .heart{color:var(--coral);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker"><span class="dot"></span>맞춤형화장품 조제관리사</div>
    <h1><span class="accent">조제관리사</span> 종합 퀴즈</h1>
    <div class="sub">별표2 사용한도 + 기본서 361쪽 전범위 · 총 2,147문항 · 보기 순서는 매번 랜덤이에요</div>
  </header>

  <div class="panel">
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="mcq">📝 사용한도</button>
      <button class="mode-btn" data-mode="ox">⭕ OX</button>
      <button class="mode-btn" data-mode="theory">📖 핵심이론</button>
      <button class="mode-btn" data-mode="book">📗 교재 전범위</button>
      <button class="mode-btn" data-mode="ing">🧪 성분 암기</button>
    </div>
    <div class="ctl-label">분류 선택</div>
    <div class="chips" id="chips"></div>
    <div class="ctl-label sub-label" id="subLabel" style="display:none">세부 범위</div>
    <div class="chips" id="subChips" style="display:none"></div>
    <div class="ctl-label">출제 문항 수</div>
    <div class="chips" id="lenChips"></div>
    <div class="quick-row" id="quickRow"></div>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
    <div class="streak" id="streak"></div>
  </div>

  <div class="card" id="quizCard"></div>

  <div class="panel stats" id="statsPanel"></div>

  <footer>기록은 이 브라우저에만 저장돼요 · 누적 오답과 약점은 자동으로 쌓입니다<br>혼자 공부할 때 <span class="heart">♥</span> 반복하면 확실히 남아요</footer>
</div>

<script>
const QUESTIONS = [
 {
  "cat": "보존제",
  "type": "한도",
  "q": "<b>글루타랄</b>의 사용한도는?",
  "opts": [
   "0.1%",
   "0.0015%",
   "0.4%",
   "0.2%",
   "0.5%"

n":"new","kind":"mcq","opts":["아이브로 제품","아이 라이너","마스카라","눈 주위 제품","속눈썹용 퍼머넌트웨이브"],"answer":3},{"id":"bkc416562a","cat":"화장품법","type":"혼동쌍구분","q":"두발 염색용 제품류의 세부 설명으로 옳지 않은 것은?","explain":"멜라닌 색소를 산화시켜 두발의 색을 밝게(백색화) 하는 것은 탈염·탈색용 제품의 설명이다. 염모제는 두발의 색상을 변화시키고 그 변화된 색상을 '유지'하는 제품이다. 즉 색을 빼는 것이 탈염·탈색, 색을 넣고 유지하는 것이 염모제이며, 헤어 틴트와 헤어 컬러스프레이는 '일시적' 착색이라는 점에서 둘 모두와 구분된다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":30,"diff":3,"origin":"new","kind":"mcq","opts":["헤어 틴트는 린스, 파우더, 크레용에 이용되는 기제에 착색제를 첨가하여 두발을 일시적으로 착색시키기 위해 사용하는 제품이다","헤어 컬러스프레이는 스프레이에 이용되는 기제에 착색제를 첨가하여 두발을 일시적으로 착색시키기 위해 사용하는 제품이다","염모제는 두발의 색상을 변화시키고 변화된 색상을 유지하기 위하여 사용하는 제품이다","탈염·탈색용 제품은 두발 내에 멜라닌 색소를 산화시켜 두발의 색을 밝게(백색화) 하는 제품이다","염모제는 두발 내에 멜라닌 색소를 산화시켜 두발의 색을 밝게 백색화하는 제품이다"],"answer":4},{"id":"bk1144d57e","cat":"화장품법","type":"혼동쌍구분","q":"체모 제거용 제품류에 대한 설명으로 옳은 것은?","explain":"제모제는 체모의 시스틴 결합을 환원제로 화학적으로 절단하여 제거하는 제품이고, 제모왁스는 물리적으로 체모를 제거하는 제품이다. 이 구분은 기능성화장품 판정과도 이어지는데, '체모를 제거하는 기능을 가진 화장품'은 기능성이지만 물리적으로 제거하는 제품은 제외되기 때문이다. 멜라닌 산화는 탈염·탈색용 제품 설명이라 무관하다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":33,"diff":3,"origin":"new","kind":"mcq","opts":["제모제는 물리적으로 체모를 제거하는 제품이다","제모왁스는 체모의 시스틴 결합을 환원제로 절단하여 제거하는 제품이다","제모제는 체모의 시스틴 결합을 환원제로 화학적으로 절단하여 제거하는 제품이다","제모왁스는 체모의 멜라닌 색소를 산화시켜 제거하는 제품이다","제모제와 제모왁스는 모두 물리적 제거 방식이다"],"answer":2},{"id":"bke242902c","cat":"화장품법","type":"O/X","q":"콜롱은 방향 효과를 주기 위하여 사용되는 것으로 향수보다 비교적 부향률이 낮은 제품이다.","explain":"방향용 제품류는 향수와 콜롱으로 나뉘며, 콜롱의 설명에 '향수보다 비교적 부향률이 낮은 제품'이라는 구분이 들어 있다. 향수 쪽에는 부향률 언급이 없고 단순히 '방향 효과를 주기 위하여 사용하는 제품'으로만 정의된다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":30,"diff":1,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk7f6b687b","cat":"화장품법","type":"O/X","q":"「식품위생법」에 따른 식품접객업 영업소에서 손을 닦는 용도로 사용할 수 있도록 포장된 물티슈는 인체 세정용 제품류에 해당하는 화장품이다.","explain":"물휴지는 인체 세정용 제품류이지만, 식품접객업 영업소에서 손을 닦는 용도 등으로 사용할 수 있도록 포장된 물티슈와 장례식장 또는 의료기관 등에서 시체를 닦는 용도로 사용되는 물휴지는 명시적으로 제외된다. 일반 소비자용 물휴지만 화장품이라는 뜻이다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":24,"diff":3,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk8a44f92b","cat":"화장품법","type":"선다형","q":"모든 화장품 포장에 기재해야 하는 '사용할 때의 주의사항' 중 공통사항에 해당하지 않는 것은?","explain":"'눈에 들어갔을 때에는 즉시 씻어낼 것'은 두발용, 두발염색용 및 눈 화장용 제품류에 붙는 개별사항이다. 공통사항은 이상 증상·부작용 시 전문의 상담, 상처 부위 사용 자제, 그리고 보관 및 취급 시 주의사항(어린이 손이 닿지 않는 곳 보관, 직사광선을 피해서 보관) 세 가지다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":33,"diff":2,"origin":"new","kind":"mcq","opts":["화장품 사용 시 또는 사용 후 직사광선에 의하여 사용부위가 붉은 반점, 부어오름 또는 가려움증 등의 이상 증상이나 부작용이 있는 경우에는 전문의 등과 상담할 것","상처가 있는 부위 등에는 사용을 자제할 것","어린이의 손이 닿지 않는 곳에 보관할 것","직사광선을 피해서 보관할 것","눈에 들어갔을 때에는 즉시 씻어낼 것"],"answer":4},{"id":"bkf317facf","cat":"화장품법","type":"선다형","q":"외음부 세정제의 사용 시 주의사항으로 옳지 않은 것은?","explain":"연령 기준이 틀렸다. 외음부 세정제는 '3세 이하의 영유아에게는 사용하지 말 것'이 주의사항이다. 13세 이하는 '어린이' 상한 연령과 얽힌 숫자여서 바꿔치기 함정으로 자주 쓰인다. 프로필렌글라이콜 관련 문구는 프로필렌글라이콜 함유제품에만 표시한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":34,"diff":3,"origin":"new","kind":"mcq","opts":["외음부에만 사용하며, 질 내에 사용하지 않도록 할 것","정해진 용법과 용량을 잘 지켜 사용할 것","13세 이하의 어린이에게는 사용하지 말 것","임신 중에는 사용하지 않는 것이 바람직하며, 분만 직전의 외음부 주위에는 사용하지 말 것","프로필렌글라이콜을 함유하고 있으므로 이 성분에 과민하거나 알레르기 병력이 있는 사람은 신중히 사용할 것"],"answer":2},{"id":"bk0f94f1be","cat":"화장품법","type":"단답형","q":"외음부 세정제와 우레아를 포함하는 핸드크림·풋크림(손·발의 피부연화 제품)에 공통으로, 해당 성분 함유제품에만 표시하는 주의사항의 원인 성분은 무엇인가?","explain":"두 제품 모두 '프로필렌글라이콜(Propylene glycol)을 함유하고 있으므로 이 성분에 과민하거나 알레르기 병력이 있는 사람은 신중히 사용할 것(프로필렌글라이콜 함유제품만 표시)'이라는 주의사항이 붙는다. 염모제에도 프로필렌글라이콜 함유 제제에만 표시하는 유사 문구가 있으나, 그쪽은 '사용 전에 의사 또는 약사와 상의'하라는 표현이다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":34,"diff":3,"origin":"new","kind":"short","ans":["프로필렌글라이콜","프로필렌 글라이콜","Propylene glycol","프로필렌글리콜"]},{"id":"bk1e83b7ab","cat":"화장품법","type":"O/X","q":"고압가스를 사용하는 에어로졸 제품은 눈 주위 또는 점막 등에 분사하지 말아야 하나, 자외선 차단제의 경우에는 얼굴에 직접 분사하지 말고 손에 덜어 얼굴에 바르도록 한다.","explain":"고압가스를 사용하는 에어로졸 제품의 주의사항 그대로다. 함께 붙는 것으로 분사가스를 직접 흡입하지 않도록 주의할 것, 그리고 「고압가스 안전관리법」에 따른 기재사항이 있다. 참고로 '고압가스를 사용하지 않는 분무형 자외선 차단제'에도 얼굴에 직접 분사하지 말고 손에 덜어 바르라는 같은 취지의 주의사항이 별도로 규정되어 있다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":34,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk4baa5ada","cat":"화장품법","type":"숫자기준","q":"헤어 퍼머넌트웨이브 제품 및 헤어스트레이트너 제품의 주의사항에 나오는 숫자로 옳게 짝지어진 것은?","explain":"섭씨 15도 이하의 어두운 장소에 보존하고 색이 변하거나 침전된 경우에는 사용하지 말 것, 개봉한 제품은 7일 이내에 사용할 것(에어로졸 제품이나 사용 중 공기유입이 차단되는 용기는 표시하지 아니함)이 규정이다. 속눈썹용 퍼머넌트웨이브 제품도 보존 온도는 같은 섭씨 15도 이하지만 개봉 후에는 '즉시 폐기'라는 점이 다르다. 섭씨 40도는 안전용기 운동점도 측정 조건이라 무관하다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":35,"diff":3,"origin":"new","kind":"mcq","opts":["섭씨 15도 이하의 어두운 장소에 보존 - 개봉한 제품은 7일 이내에 사용","섭씨 15도 이상의 어두운 장소에 보존 - 개봉한 제품은 7일 이내에 사용","섭씨 25도 이하의 어두운 장소에 보존 - 개봉한 제품은 15일 이내에 사용","섭씨 15도 이하의 어두운 장소에 보존 - 개봉한 제품은 30일 이내에 사용","섭씨 40도 이하의 어두운 장소에 보존 - 개봉한 제품은 7일 이내에 사용"],"answer":0},{"id":"bk01995e84","cat":"화장품법","type":"O/X","q":"속눈썹용 퍼머넌트웨이브 제품은 개봉한 제품을 7일 이내에 사용하도록 표시한다.","explain":"속눈썹용 퍼머넌트웨이브 제품은 '개봉한 제품은 사용 후 즉시 폐기할 것(사용 중 공기의 유입이 차단되는 용기는 표시하지 아니함)'이다. 개봉 후 7일 이내 사용은 헤어 퍼머넌트웨이브 및 헤어스트레이트너 제품 쪽 규정이다. 보존 조건이 섭씨 15도 이하의 어두운 장소로 서로 같기 때문에 개봉 후 처리만 콕 집어 구분해 두어야 한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":35,"diff":3,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk9e1ca1f8","cat":"화장품법","type":"O/X","q":"헤어 퍼머넌트웨이브 제품 중 제2단계 퍼머액의 주성분이 과산화수소인 제품은 검은 머리카락이 갈색으로 변할 수 있으므로 유의하여 사용해야 한다.","explain":"헤어 퍼머넌트웨이브 및 헤어스트레이트너 제품 주의사항의 마지막 항목 그대로다. 과산화수소는 산화제로서 멜라닌 색소에도 작용하기 때문에 탈색 효과가 나타나 검은 머리가 갈색으로 변할 수 있다. 같은 목록에 있는 '특이체질, 생리 또는 출산 전후이거나 질환이 있는 사람은 사용을 피할 것'과 함께 자주 출제된다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":35,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk245f746f","cat":"화장품법","type":"숫자기준","q":"염모제 사용 전 패취테스트(patch test)에 관한 설명으로 옳지 않은 것은?","explain":"과거에 아무 이상이 없이 염색한 경우에도 체질의 변화에 따라 알레르기 등 부작용이 발생할 수 있으므로 '매회 반드시' 실시하라고 규정되어 있다. 생략 가능하다는 선지가 오답이다. 숫자는 염색 2일 전(48시간 전) 실시, 48시간 방치, 관찰은 30분 후와 48시간 후 총 2회로 묶어서 외운다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":37,"diff":3,"origin":"new","kind":"mcq","opts":["염색 2일 전(48시간 전)에 매회 반드시 실시한다","실험액을 세척한 부위에 동전 크기로 바르고 자연건조시킨 후 그대로 48시간 방치한다","테스트 부위의 관찰은 테스트액을 바른 후 30분 그리고 48시간 후 총 2회 행한다","과거에 아무 이상 없이 염색한 경험이 있으면 이후에는 생략할 수 있다","48시간 이내에 이상이 발생하지 않는다면 바로 염모한다"],"answer":3},{"id":"bk88eb83fa","cat":"화장품법","type":"숫자기준","q":"염모제 패취테스트에서 테스트 부위의 관찰은 테스트액을 바른 후 ( ) 그리고 ( ) 후 총 ( ) 반드시 행하여야 한다. 괄호에 들어갈 말을 순서대로 쓰시오.","explain":"관찰 시점은 도포 30분 후와 48시간 후로 총 2회다. 테스트 도중 48시간 이전이라도 발진·발적·가려움·수포·자극 등의 이상이 있으면 손으로 만지지 말고 바로 씻어내고 염모하지 말아야 한다. 팔의 안쪽 또는 귀 뒤쪽 머리카락이 난 주변 피부에 동전 크기로 바른다는 부위 조건도 함께 기억할 것.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":37,"diff":3,"origin":"new","kind":"short","ans":["30분, 48시간, 2회","30분 / 48시간 / 2회","30분과 48시간, 2회"]},{"id":"bkc0b4bb23","cat":"화장품법","type":"O/X","q":"염모 전후 1주간은 파마·웨이브(퍼머넌트웨이브)를 하지 말아야 한다.","explain":"염모제 사용 전의 주의 항목에 '염모 전후 1주간은 파마·웨이브(퍼머넌트웨이브)를 하지 말아 주십시오'로 규정되어 있다. 같은 항목에 눈썹·속눈썹 등에는 사용하지 말 것, 두발 이외에는 염색하지 말 것, 면도 직후에는 염색하지 말 것이 함께 들어 있다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":37,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk97c6b4dd","cat":"화장품법","type":"O/X","q":"염모액이 눈에 들어갔을 때에는 손으로 비벼 이물질을 빼낸 뒤 물로 씻어야 한다.","explain":"'절대로 손으로 비비지 말고' 바로 물 또는 미지근한 물로 15분 이상 잘 씻은 뒤 곧바로 안과 전문의의 진찰을 받으라고 규정한다. 임의로 안약 등을 사용하지 말라는 문구도 함께 붙는다. 비비는 행위는 각막 손상을 키우므로 금지된다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":37,"diff":2,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bkdd05cf5b","cat":"화장품법","type":"숫자기준","q":"제모제(치오글라이콜릭애씨드 함유제품)를 사용한 후 땀발생억제제(Antiperspirant), 향수, 수렴로션(Astringent Lotion)은 몇 시간 후에 사용하도록 표시하는가?","explain":"제모제 주의사항에 '이 제품 사용 후 24시간 후에 사용하십시오'로 규정되어 있다. 제모 직후의 피부는 자극에 예민해져 있기 때문이다. 참고로 체취 방지용 제품에는 '털을 제거한 직후에는 사용하지 말 것'이라는 별도 주의사항이 있어 같은 맥락으로 묶어 외우면 좋다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":36,"diff":3,"origin":"new","kind":"short","ans":["24시간","24시간 후","24"]},{"id":"bk7a1e1618","cat":"화장품법","type":"숫자기준","q":"제모제(치오글라이콜릭애씨드 함유제품)의 사용 시 주의사항으로 옳지 않은 것은?","explain":"비누류는 오히려 금지 쪽이다. '이 제품의 사용 전후에 비누류를 사용하면 자극감이 나타날 수 있으므로 주의하십시오'가 규정된 문구다. 나머지는 모두 옳으며, 붕산수 농도 약 2%, 10분 이상 방치 금지, 재사용 시 2~3일 간격이라는 숫자 세 개를 묶어서 기억해 두어야 한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":36,"diff":3,"origin":"new","kind":"mcq","opts":["눈에 들어가지 않도록 하며 눈 또는 점막에 닿았을 경우 미지근한 물로 씻어내고 붕산수(농도 약 2%)로 헹구어 낼 것","이 제품을 10분 이상 피부에 방치하거나 피부에서 건조시키지 말 것","정해진 시간 내에 모가 깨끗이 제거되지 않은 경우 2~3일의 간격을 두고 사용할 것","자극감이 나타날 수 있으므로 매일 사용하지 말 것","이 제품의 사용 전후에 비누류를 사용하면 효과가 높아지므로 반드시 함께 사용할 것"],"answer":4},{"id":"bk03b481da","cat":"화장품법","type":"단답형","q":"'알갱이가 눈에 들어갔을 때에는 물로 씻어내고, 이상이 있는 경우에는 전문의와 상담할 것'이라는 개별 주의사항이 붙는 제품은 무엇인가?","explain":"미세한 알갱이가 함유되어 있는 스크럽세안제의 개별 주의사항이다. 유형별·함유성분별 개별 주의사항의 첫 번째 항목으로, 팩의 '눈 주위를 피하여 사용할 것'과 함께 물리적 자극 관련 주의사항으로 묶인다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":33,"diff":2,"origin":"new","kind":"short","ans":["미세한 알갱이가 함유되어 있는 스크럽세안제","스크럽세안제","스크럽 세안제"]},{"id":"bk5550c6bd","cat":"화장품법","type":"선다형","q":"샴푸의 사용 시 주의사항으로 규정된 것을 모두 고른 것은?\nㄱ. 눈에 들어갔을 때에는 즉시 씻어낼 것\nㄴ. 사용 후 물로 씻어내지 않으면 탈모 또는 탈색의 원인이 될 수 있으므로 주의할 것\nㄷ. 눈 주위를 피하여 사용할 것\nㄹ. 털을 제거한 직후에는 사용하지 말 것","explain":"샴푸에는 ㄱ과 ㄴ 두 가지가 규정되어 있다. ㄷ '눈 주위를 피하여 사용할 것'은 팩의 주의사항이고, ㄹ '털을 제거한 직후에는 사용하지 말 것'은 체취 방지용 제품의 주의사항이다. 같은 두발 관련이라도 제품별로 문구가 다르게 배정되어 있으니 제품과 문구를 짝지어 익혀야 한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":34,"diff":3,"origin":"new","kind":"mcq","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":0},{"id":"bk7af45523","cat":"화장품법","type":"단답형","q":"인체 세정용 제품류 중 '얼굴, 손 등 신체를 깨끗이 하기 위해 사용하는 고형의 비누 제품'을 가리키는 명칭을 쓰시오.","explain":"화장 비누는 '고체 형태의 세안용 비누'로 인체 세정용 제품류에 속한다. 같은 인체 세정용의 액체 비누는 '손이나 얼굴의 청결을 위해 사용하는 액상의 제품'으로 제형이 다르다. 한편 고형 비누의 내용물을 단순 소분한 것은 맞춤형화장품에서 제외된다는 점도 함께 연결해 두면 좋다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":29,"diff":2,"origin":"new","kind":"short","ans":["화장 비누","화장비누","화장 비누(고체 형태의 세안용 비누)"]},{"id":"bkda15fe67","cat":"화장품법","type":"선다형","q":"목욕용 제품류의 세부 제품과 그 설명이 옳지 않은 것은?","explain":"바디 클렌저는 목욕용이 아니라 인체 세정용 제품류이며, '신체의 청결과 상쾌함을 주기 위해 사용하는 것으로 주로 액상 형태의 제품'으로 정의된다. 목욕용 제품류의 세부 항목은 목욕용 오일·정제·캡슐, 목욕용 소금류, 버블 배스, 그 /O형 크림은 유성성분이 내상이어서 물로 쉽게 씻긴다.","W/O형 크림은 내수성이 요구되지 않는 용도에 주로 쓰인다.","다중유화 크림은 상의 수가 적어 안정성과 제조 편의성이 뛰어나다."],"answer":0},{"id":"bk27121720","cat":"화장품법","type":"선다형","q":"린스에 대한 설명으로 옳은 것은?","explain":"린스는 음극으로 대전된 두발 표면에 린스의 주성분인 양이온성 계면활성제의 양극이 흡착되어 두발의 마찰계수를 낮추고, 정전기 방지와 빗질을 쉽게 한다. 대부분의 린스는 크림상으로 양이온성 계면활성제에 친유성 고급알코올(세틸알코올 등)과 유분 등을 첨가하여 유화 제조한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":44,"diff":3,"origin":"new","kind":"mcq","opts":["린스의 주성분은 음이온성 계면활성제로, 두발 표면의 양전하를 중화한다.","린스의 주성분인 양이온성 계면활성제의 양극이 음극으로 대전된 두발 표면에 흡착되어 마찰계수를 낮춘다.","린스는 두발의 마찰계수를 높여 빗질 시 정전기를 발생시킨다.","린스는 비이온성 계면활성제를 주성분으로 하며 세정을 주목적으로 한다.","린스는 두발에서 유분을 제거하여 두발 표면을 거칠게 만든다."],"answer":1},{"id":"bk5f83026a","cat":"화장품법","type":"빈칸채우기","q":"퍼머넌트웨이브는 두발 케라틴 단백질 간의 공유 결합인 (        )(disulfide bond, -S-S-)을 환원제로 끊어 준 다음 원하는 두발의 모양을 틀을 이용하여 고정화하고, 산화제로 재결합시켜 웨이브를 만드는 것이다. 괄호에 들어갈 용어를 쓰시오.","explain":"두발의 주요 구성 단백질은 케라틴이며, 케라틴 단백질 간의 공유 결합인 이황화결합(disulfide bond, -S-S-)을 제1제 환원제로 절단한 뒤 산화제로 재결합시켜 웨이브를 형성한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":44,"diff":3,"origin":"new","kind":"short","ans":["이황화결합","이황화 결합","디설파이드결합","disulfide bond","-S-S-"]},{"id":"bk2dcbf47c","cat":"화장품법","type":"분류맞히기","q":"퍼머넌트웨이브 제1제 환원제에 사용되는 주요 성분에 따른 구분에 해당하지 않는 것은?","explain":"교재는 제1제 환원제에 사용되는 주요 성분에 따라 치오글라이콜릭애씨드, 시스테인, 티오락틱애씨드 퍼머넌트웨이브로 구분한다. 과산화수소는 끊어진 결합을 재결합시키는 산화제 계열이므로 제1제 환원제 구분에 들어가지 않는다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":44,"diff":3,"origin":"new","kind":"mcq","opts":["치오글라이콜릭애씨드 퍼머넌트웨이브","시스테인 퍼머넌트웨이브","티오락틱애씨드 퍼머넌트웨이브","과산화수소 퍼머넌트웨이브"],"answer":3},{"id":"bk376d994d","cat":"화장품법","type":"O/X","q":"헤어스트레이트너의 작용 원리는 퍼머넌트웨이브와 동일하며, 산화·환원 반응을 통해 곱슬머리를 직모로 펴 준다.","explain":"헤어스트레이트너는 퍼머넌트웨이브와 작용 원리가 동일하고 주로 치오클리콜릭애씨드 퍼머제와 동일하나, 환원제 및 산화제의 제형이 크림형태를 가진다는 점이 다르다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":45,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk8c117e1e","cat":"화장품법","type":"O/X","q":"외음부세정제는 인체 세정용 제품류에 속하며, 3세 이하의 영유아에게는 사용할 수 없다.","explain":"외음부세정제는 인체 세정용 제품류에 속하고 제형·성상에 따라 액상형, 거품 타입, 티슈 타입 등으로 분류되며, 다만 3세 이하의 영유아에게는 사용할 수 없다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":45,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk8505d3d9","cat":"화장품법","type":"단답형","q":"향수는 착향제의 휘발성으로 인해 신체에 뿌린 후 시간이 지나면서 향이 변화하는데, 향이 나는 시간대에 따라 구별하는 세 가지 노트의 명칭을 순서대로 쓰시오.","explain":"향수는 향이 나는 시간대에 따라 탑 노트 → 미들 노트 → 라스팅 노트로 구별한다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":46,"diff":2,"origin":"new","kind":"short","ans":["탑 노트, 미들 노트, 라스팅 노트","탑노트 미들노트 라스팅노트","탑 노트 / 미들 노트 / 라스팅 노트","탑노트, 미들노트, 라스팅노트"]},{"id":"bkb0303aa0","cat":"화장품법","type":"O/X","q":"탈염·탈색제는 사용을 전후하여 1주일 사이에는 퍼머넌트웨이브 제품 및 헤어스트레이트너 제품을 사용하지 말아야 한다.","explain":"탈염·탈색제의 '사용 전의 주의'에 사용을 전후하여 1주일 사이에는 퍼머넌트웨이브 제품 및 헤어스트레이트너 제품을 사용하지 말 것이 명시되어 있다. 또한 면도 직후에도 사용하면 안 된다.","subj":"화장품법","chap":"CHAPTER 02 화장품 유형별 특징","page":38,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bkb96bc6f4","cat":"화장품법","type":"혼동쌍구분","q":"화장품 영업의 종류별 개설 절차를 바르게 연결한 것은?","explain":"화장품제조업과 화장품책임판매업은 '등록', 맞춤형화장품판매업은 '신고'다. 세 영업 모두 총리령으로 정하는 바에 따라 식품의약품안전처장에게 하며, 서류는 각 영업소 소재지를 관할하는 지방식품의약품안전청장에게 제출한다. 등록은 등록필증이, 신고는 신고필증이 발급된다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":49,"diff":1,"origin":"new","kind":"mcq","opts":["화장품제조업 - 신고 / 화장품책임판매업 - 등록 / 맞춤형화장품판매업 - 등록","화장품제조업 - 등록 / 화장품책임판매업 - 등록 / 맞춤형화장품판매업 - 신고","화장품제조업 - 등록 / 화장품책임판매업 - 신고 / 맞춤형화장품판매업 - 신고","화장품제조업 - 신고 / 화장품책임판매업 - 신고 / 맞춤형화장품판매업 - 등록","세 영업 모두 식품의약품안전처장에게 신고하여야 한다."],"answer":1},{"id":"bkc7ffb3c7","cat":"화장품법","type":"O/X","q":"맞춤형화장품판매업을 하려는 자는 총리령으로 정하는 바에 따라 식품의약품안전처장에게 등록하여야 한다.","explain":"맞춤형화장품판매업은 '등록'이 아니라 '신고' 대상이다. 신고서류는 맞춤형화장품판매업소 소재지를 관할하는 지방식품의약품안전청장에게 제출하며, 지방식품의약품안전청장이 신고필증을 발급한다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":53,"diff":1,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk0c78347f","cat":"화장품법","type":"O/X","q":"화장품제조업의 범위에는 화장품의 포장을 하는 영업이 포함되며, 이때 포장은 1차 포장만 해당한다.","explain":"화장품제조업은 ① 화장품을 직접 제조하는 영업, ② 화장품 제조를 위탁받아 제조하는 영업, ③ 화장품의 포장(1차 포장만 해당)을 하는 영업으로 구성된다. 2차 포장이나 표시만 하는 것은 제조업에 해당하지 않는다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":49,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk0d73775f","cat":"화장품법","type":"혼동쌍구분","q":"화장품 영업의 결격사유 중 화장품제조업에만 '추가로' 적용되는 것을 모두 고른 것은?\nㄱ. 피성년후견인 또는 파산선고를 받고 복권되지 아니한 자\nㄴ. 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률 제3조 제1호에 따른 정신질환자\nㄷ. 마약류 관리에 관한 법률 제2조 제1호에 따른 마약류의 중독자\nㄹ. 제24조에 따라 등록이 취소되거나 영업소가 폐쇄된 날부터 1년이 지나지 아니한 자","explain":"ㄱ과 ㄹ은 화장품제조업·화장품책임판매업·맞춤형화장품판매업에 공통으로 적용되는 결격사유다. 정신질환자(ㄴ)와 마약류의 중독자(ㄷ)는 화장품제조업에만 추가되는 결격사유이며, 정신질환자의 경우 전문의가 화장품제조업자로서 적합하다고 인정하는 사람은 제외된다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":49,"diff":3,"origin":"new","kind":"mcq","opts":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":1},{"id":"bk0dbab19b","cat":"화장품법","type":"숫자기준","q":"화장품법 제24조에 따라 등록이 취소되거나 영업소가 폐쇄된 날부터 얼마가 지나지 아니한 자는 화장품 영업의 결격사유에 해당하는가?","explain":"등록 취소·영업소 폐쇄일부터 1년이 지나지 아니한 자는 공통 결격사유에 해당한다. 다만 피성년후견인·파산선고, 정신질환자, 마약류 중독자 사유로 취소·폐쇄된 경우는 예외로 1년이 지나지 않아도 된다. 맞춤형화장품조제관리사 자격이 취소된 경우의 3년과 혼동하지 않도록 한다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":49,"diff":3,"origin":"new","kind":"mcq","opts":["6개월","1년","2년","3년","5년"],"answer":1},{"id":"bk4e3be436","cat":"화장품법","type":"혼동쌍구분","q":"화장품제조업 등록 시 지방식품의약품안전청장에게 제출하는 서류가 아닌 것은?","explain":"화장품제조업 등록 서류는 등록신청서, 전문의 또는 의사 진단서(대표자가 정신질환자·마약류 중독자가 아님을 증빙), 시설 명세서 3가지다. 품질관리기준 규정과 안전관리기준 규정, 책임판매관리자 증빙 서류는 화장품책임판매업 등록 서류다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":50,"diff":2,"origin":"new","kind":"mcq","opts":["등록신청서","전문의 또는 의사 진단서","시설 명세서","품질관리기준 규정"],"answer":3},{"id":"bk69a2011d","cat":"화장품법","type":"혼동쌍구분","q":"화장품책임판매업 등록 시 제출하는 서류로 옳지 않은 것은?","explain":"화장품책임판매업 등록 서류는 등록신청서, 품질관리기준 규정, 안전관리기준 규정, 책임판매관리자 증빙 서류 4가지다. 시설 명세서는 화장품제조업 등록과 맞춤형화장품판매업 신고 시 제출하는 서류다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":52,"diff":2,"origin":"new","kind":"mcq","opts":["등록신청서","품질관리기준 규정","안전관리기준 규정","책임판매관리자 증빙 서류","시설 명세서"],"answer":4},{"id":"bk1befb8ca","cat":"화장품법","type":"혼동쌍구분","q":"맞춤형화장품판매업 신 :"CHAPTER 03 화장품 영업","page":64,"diff":2,"origin":"variant","kind":"mcq","opts":["15일","30일","60일","90일","180일"],"answer":3},{"id":"bk01a80540","cat":"화장품법","type":"선다형","q":"화장품제조업자가 작성·보관해야 하는 문서로 교재에 제시되지 않은 것은?","explain":"교재 연습문제 인쇄 정답은 제조관리기준서, 제품표준서, 제조관리기록서, 품질관리기록서 네 가지이다. 맞춤형화장품 판매내역서는 맞춤형화장품판매업자의 의무사항이므로 제조업자의 작성·보관 문서가 아니다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":63,"diff":2,"origin":"variant","kind":"mcq","opts":["제조관리기준서","제품표준서","제조관리기록서","품질관리기록서","맞춤형화장품 판매내역서"],"answer":4},{"id":"bkaf02fe57","cat":"화장품법","type":"선다형","q":"맞춤형화장품판매업자가 작성·보관해야 하는 맞춤형화장품 판매내역서의 기재사항이 아닌 것은?","explain":"교재 연습문제 인쇄 정답에 따르면 판매내역서에는 제조번호, 사용기한 또는 개봉 후 사용기간, 판매일자 및 판매량이 포함된다. 구매자의 주민등록번호는 기재사항이 아니다.","subj":"화장품법","chap":"CHAPTER 03 화장품 영업","page":64,"diff":2,"origin":"variant","kind":"mcq","opts":["제조번호","사용기한 또는 개봉 후 사용기간","판매일자","판매량","구매자의 주민등록번호"],"answer":4},{"id":"bk2acefe62","cat":"화장품법","type":"혼동쌍구분","q":"제품의 변색, 변질, 변취, 분리, 미생물 오염이 없어야 한다는 요구는 화장품의 어떤 품질요소에 해당하는가?","explain":"안정성(Stability)은 제품의 변색·변질·변취·분리·미생물 오염이 없어야 함을 뜻한다. 안전성(Safety)은 피부에 독성·자극·알레르기 등 인체 부작용이 없어야 함을 뜻하므로 두 용어를 혼동하지 않도록 한다. 사용성·친환경성·심미성은 '기타' 품질요소로 분류된다.","subj":"화장품법","chap":"CHAPTER 04 화장품 품질요소","page":65,"diff":2,"origin":"new","kind":"mcq","opts":["안전성","안정성","유효성","사용성","심미성"],"answer":1},{"id":"bk45eba51e","cat":"화장품법","type":"단답형","q":"세정력, 보습력, 미백 등 목적에 적합한 기능과 효과를 부여해야 한다는 화장품의 품질요소는 무엇인가?","explain":"유효성(Efficacy)은 화장품 개발 목적에 적합한 기능과 효과를 갖추어야 한다는 품질요소이다. 안전성(부작용 없음), 안정성(변질 없음)과 구분한다.","subj":"화장품법","chap":"CHAPTER 04 화장품 품질요소","page":65,"diff":1,"origin":"new","kind":"short","ans":["유효성","유효성(Efficacy)","Efficacy"]},{"id":"bk632a1044","cat":"화장품법","type":"선다형","q":"안전성 평가(유해성 평가)를 위한 시험으로 교재에 제시되지 않은 것은?","explain":"안전성 평가 시험은 단회 투여 독성시험, 1차 피부 자극시험, 안점막 자극 또는 기타 점막 자극시험, 피부감작성시험, 광독성 및 광감작성 시험, 인체 첩포시험, 누적 첩포시험의 7가지이다. 광안정성 시험은 안정성(Stability) 시험 중 가혹시험에 속하는 항목이므로 안전성 평가와 혼동하지 않는다. '광독성·광감작성'과 '광안정성'을 구분하는 것이 핵심이다.","subj":"화장품법","chap":"CHAPTER 04 화장품 품질요소","page":65,"dif  조문 제3항에 명시되어 있다. '미리' 보고한다는 시점이 포인트이다.","subj":"화장품법","chap":"CHAPTER 06 식약처의 감독 및 명령","page":82,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk10dfe2e3","cat":"화장품법","type":"선다형","q":"식품의약품안전처장이 관계 공무원으로 하여금 해당 물품을 폐기하게 하거나 그 밖에 필요한 처분을 하게 할 수 있는 경우로 교재에 제시된 것을 모두 고른 것은?\n㉠ 회수·폐기 등의 명령을 받은 자가 그 명령을 이행하지 아니한 경우\n㉡ 그 밖에 국민보건을 위하여 긴급한 조치가 필요한 경우\n㉢ 영업자가 변경등록 기한을 지키지 아니한 경우","explain":"관계 공무원에 의한 직접 폐기·처분은 ㉠ 명령 불이행, ㉡ 국민보건을 위한 긴급 조치 필요의 두 경우에 한한다. 변경등록 기한 미준수는 별도의 행정처분 사유이며 이 조문의 요건이 아니다.","subj":"화장품법","chap":"CHAPTER 06 식약처의 감독 및 명령","page":83,"diff":2,"origin":"new","kind":"mcq","opts":["㉠","㉡","㉠, ㉡","㉡, ㉢","㉠, ㉡, ㉢"],"answer":2},{"id":"bka47fc500","cat":"화장품법","type":"선다형","q":"개인정보 보호 원칙으로 교재에 제시되지 않은 것은?","explain":"개인정보 보호 원칙은 목적 명확화와 최소수집, 목적 범위 내 적합한 처리 및 목적 외 활용 금지, 정확성·완전성·최신성 보장, 안전한 관리, 처리방침 공개와 정보주체 권리 보장, 사생활 침해 최소화, 익명·가명처리 우선, 책임과 의무 준수의 8가지이다. 일률적인 5년 보관 의무는 원칙에 없으며 오히려 최소수집 원칙에 반한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":84,"diff":2,"origin":"new","kind":"mcq","opts":["처리 목적을 명확하게 하고 그 목적에 필요한 범위에서 최소한의 개인정보만을 적법하고 정당하게 수집하여야 한다","처리 목적에 필요한 범위에서 개인정보의 정확성, 완전성 및 최신성이 보장되도록 하여야 한다","개인정보 처리방침 등 처리에 관한 사항을 공개하고 열람청구권 등 정보주체의 권리를 보장하여야 한다","정보주체의 사생활 침해를 최소화하는 방법으로 개인정보를 처리하여야 한다","수집한 개인정보는 목적 달성 여부와 관계없이 최소 5년간 보관하여야 한다"],"answer":4},{"id":"bk4910f62d","cat":"화장품법","type":"O/X","q":"개인정보처리자는 개인정보를 익명 또는 가명으로 처리하여도 수집 목적을 달성할 수 있는 경우, 익명처리가 가능한 경우에는 익명에 의하여, 익명처리로 목적을 달성할 수 없는 경우에는 가명에 의하여 처리될 수 있도록 하여야 한다.","explain":"개인정보 보호 원칙 중 하나이다. 익명처리가 우선이고, 익명으로 목적 달성이 불가능할 때 가명처리를 하는 순서를 기억한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":84,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk69ac60d4","cat":"화장품법","type":"혼동쌍구분","q":"개인정보 보호법상 성명·주민등록번호·식별정보 등 개인정보를 제공하는 손님을 '정보주체'라 할 때, 이를 저장·이용·처리하는 상담사와 같은 지위를 무엇이라 하는가?","explain":"개인정보를 제공하는 쪽이 '정보주체', 그 개인정보를 저장·이용·처리하는 쪽이 '개인정보처리자'이다. 보호 원칙상의 각종 의무는 개인정보처리자에게 부과된다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":84,"diff":1,"origin":"new","kind":"short"," 법","chap":"CHAPTER 07 개인정보 보호법","page":105,"diff":3,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk4430d472","cat":"화장품법","type":"O/X","q":"개인정보처리자는 정보주체가 필요한 최소한의 정보 외의 개인정보 수집에 동의하지 아니한다는 이유로 정보주체에게 재화 또는 서비스의 제공을 거부하여서는 아니 된다.","explain":"개인정보의 수집 제한 규정 그대로다. 최소한의 정보 외의 수집에는 동의하지 않을 수 있음을 구체적으로 알려야 하고, 그 미동의를 이유로 재화·서비스 제공을 거부할 수 없다. 교재 인쇄 정답 O.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":105,"diff":1,"origin":"book","kind":"ox","answer_ox":"O"},{"id":"bk3365a702","cat":"화장품법","type":"숫자기준","q":"개인정보처리자는 만 (   )세 미만 아동의 개인정보를 처리하기 위하여 개인정보 보호법에 따른 동의를 받아야 할 때에는 그 법정대리인의 동의를 받아야 하며, 법정대리인이 동의하였는지를 확인하여야 한다.","explain":"아동 개인정보 보호의 연령 기준은 만 14세 미만이다. 교재 인쇄 정답 14.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":105,"diff":1,"origin":"book","kind":"short","ans":["14","14세","만 14","만14"]},{"id":"bkd25e41ff","cat":"화장품법","type":"빈칸채우기","q":"개인정보처리자가 정보주체 이외로부터 수집한 개인정보를 처리하는 때에는 정보주체의 요구가 있을 때 즉시 다음 각 호의 모든 사항을 정보주체에게 알려야 한다. ① 개인정보의 (   ) 출처 ② 개인정보의 (   ) 목적 ③ 개인정보 처리의 정지를 요구할 권리가 있다는 사실","explain":"정보주체 이외로부터 수집한 개인정보를 처리할 때 알려야 하는 3가지는 '수집 출처 / 처리 목적 / 처리 정지 요구·동의 철회 권리'다. 교재 인쇄 정답 '수집, 처리'.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":106,"diff":2,"origin":"book","kind":"short","ans":["수집, 처리","수집/처리","수집 처리"]},{"id":"bkde614011","cat":"화장품법","type":"숫자기준","q":"개인정보처리자는 정보주체로부터 개인정보에 대한 열람·정정·삭제·정지 등 요구를 받은 날부터 (   )일 이내에 정보주체가 해당 개인정보를 열람할 수 있도록 하여야 한다.","explain":"법 제35조 제3항의 '대통령령으로 정하는 기간'은 시행령 제41조에 따라 10일이다. 처리정지 요구에 대한 결과 통지도 동일하게 10일 이내다. 교재 인쇄 정답 10.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":106,"diff":2,"origin":"book","kind":"short","ans":["10","10일"]},{"id":"bk18aaf013","cat":"화장품법","type":"선다형","q":"개인정보 보호법에서 고유식별정보로 열거하고 있는 것이 아닌 것은?","explain":"고유식별정보는 주민등록번호, 여권번호, 운전면허번호, 외국인등록번호 4가지로 딱 정해져 있다. 건강보험증 번호는 여기에 포함되지 않는다. '주·여·운·외' 네 글자로 묶어 외운다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":86,"diff":2,"origin":"variant","kind":"mcq","opts":["주민등록번호","여권번호","운전면허번호","외국인등록번호","건강보험증 번호"],"answer":4},{"id":"bke7ebb01c","cat":"화장품법","type":"혼동쌍구분","q":"다음 중 성격이 다른 하나를 고르면? (나머지는 모두 민감정보에 해당한다)","explain":"여권번호는 민감정보가 아니라 고유식별정보다. 민감정보는 사상·신념, 노동조합·정당의 가입·탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보와 유전정보, 범죄경력자료, 기술적 수단으로 생성한 생체인식정보, 인종·민족 정보를 말한다. 민감정보와 고유식별정보는 둘 다 '별도 동의' 대상이라 헷갈리기 쉬우니 항목 자체를 구분해 두어야 한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":86,"diff":2,"origin":"variant","kind":"mcq","opts":["유전자검사 등의 결과로 얻어진 유전정보","범죄경력자료에 해당하는 정보","인종이나 민족에 관한 정보","개인의 신체적·생리적·행동적 특징에 관한 정보로서 특정 개인을 알아볼 목적으로 일정한 기술적 수단을 통해 생성한 정보","여권번호"],"answer":4},{"id":"bk9ecff135","cat":"화장품법","type":"숫자기준","q":"개인정보처리자가 아동의 개인정보를 처리하기 위해 법정대리인의 동의를 받아야 하는 연령 기준은?","explain":"개인정보 보호법상 아동의 기준은 만 14세 미만이다. 만 19세는 민법상 성년 기준이라 혼동하기 쉽다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":92,"diff":1,"origin":"variant","kind":"mcq","opts":["만 12세 미만","만 13세 미만","만 14세 미만","만 16세 미만","만 19세 미만"],"answer":2},{"id":"bk6346a948","cat":"화장품법","type":"숫자기준","q":"개인정보처리자가 정보주체로부터 개인정보에 대한 열람·정정·삭제·정지 등의 요구를 받았을 때, 요구를 받은 날부터 며칠 이내에 열람할 수 있도록 하여야 하는가?","explain":"10일 이내다. 같은 챕터에서 유출 통지는 72시간, 인터넷 홈페이지 게시 갈음은 30일 이상이므로 숫자를 묶어 대비해 외운다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":98,"diff":2,"origin":"variant","kind":"mcq","opts":["3일","7일","10일","15일","30일"],"answer":2},{"id":"bkc51c2f1d","cat":"화장품법","type":"O/X","q":"사망한 자에 관한 정보도 개인정보 보호법상 개인정보에 해당한다.","explain":"개인정보는 '살아 있는 개인'에 관한 정보다. 사망한 자의 정보, 법인·단체에 관한 정보, 개인사업자의 사업체 운영 관련 정보, 사물에 관한 정보는 모두 개인정보 미해당이다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":87,"diff":1,"origin":"variant","kind":"ox","answer_ox":"X"},{"id":"bkfa950764","cat":"화장품법","type":"선다형","q":"개인정보처리자가 처리 목적에 필요한 범위에서 보장되도록 하여야 하는 개인정보의 성질을 모두 올바르게 묶은 것은?","explain":"정확성, 완전성, 최신성 3가지다. 기밀성·무결성·가용성은 정보보안 3요소이고, 적법성·공정성은 수집 방법에 관한 원칙이므로 이 문장의 정답이 아니다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":105,"diff":2,"origin":"variant","kind":"mcq","opts":["정확성·완전성·최신성","정확성·안전성·투명성","완전성·기밀성·가용성","최신성·적법성·공정성","정확성·익명성·최소성"],"answer":0},{"id":"bkc461bbef","cat":"화장품법","type":"선다형","q":"개인정보 보호법이 정한 정보주체의 권리로 볼 수 없는 것은?","explain":"정보주체의 권리는 어디까지나 '자신의' 개인정보에 관한 것이다. 열람권도 자신의 개인정보에 대한 처리 여부 확인과 열람(사본 발급 포함) 및 전송 요구에 한한다. 나머지 4개는 법이 열거한 6가지 권리에 그대로 들어 있다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":85,"diff":2,"origin":"new","kind":"mcq","opts":["개인정보의 처리에 관한 정보를 제공받을 권리","개인정보의 처리에 관한 동의 여부, 동의 범위 등을 선택하고 결정할 권리","개인정보의 처리 정지, 정정·삭제 및 파기를 요구할 권리","완전히 자동화된 개인정보 처리에 따른 결정을 거부하거나 그에 대한 설명 등을 요구할 권리","다른 정보주체의 개인정보 처리 현황에 대한 열람을 요구할 권리"],"answer":4},{"id":"bk96b9f4f2","cat":"화장품법","type":"단답형","q":"처리되는 정보에 의하여 알아볼 수 있는 사람으로서 그 정보의 주체가 되는 사람을 개인정보 보호법에서 무엇이라 하는가?","explain":"정보주체의 정의다. 개인정보를 '처리하는' 쪽인 개인정보처리자, 그 지휘·감독을 받아 실제 처리하는 개인정보취급자와 구분한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":85,"diff":1,"origin":"new","kind":"short","ans":["정보주체"]},{"id":"bk31aa8c7c","cat":"화장품법","type":"선다형","q":"'개인정보처리자'의 정의로 옳은 것은?","explain":"개인정보처리자의 핵심 요건은 '업무를 목적으로' + '개인정보파일 운용'이다. ①은 정보주체, ③은 개인정보보호책임자, ④는 개인정보취급자, ⑤는 고유식별정보의 정의다. 다른 사람(수탁자·대리인)을 통해 처리해도 여전히 개인정보처리자다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":85,"diff":2,"origin":"new","kind":"mcq","opts":["처리되는 정보에 의하여 알아볼 수 있는 사람으로서 그 정보의 주체가 되는 사람","업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 공공기관, 법인, 단체 및 개인 등","개인정보의 처리에 관한 업무를 총괄하는 책임자","개인정보처리자의 지휘·감독을 받아 개인정보를 처리하는 자","법령에 따라 개인을 고유하게 구별하기 위하여 부여된 식별정보"],"answer":1},{"id":"bk7a045bf7","cat":"화장품법","type":"단답형","q":"개인정보를 가명처리함으로써 원래의 상태로 복원하기 위한 추가 정보의 사용·결합 없이는 특정 개인을 알아볼 수 없게 된 정보를 무엇이라 하는가? (예: 홍OO, 870000-1000000, 010-0000-0000)","explain":"가명정보다. 가명정보도 개인정보의 한 유형으로 개인정보 보호법의 적용을 받는다는 점이 중요하다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":85,"diff":1,"origin":"new","kind":"short","ans":["가명정보"]},{"id":"bk5a5fee1c","cat":"화장품법","type":"단답형","q":"개인정보의 일부를 삭제하거나 일부 또는 전부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 무엇이라 하는가?","explain":"가명'처리'는 행위, 가명'정보'는 그 결과물이다. 익명처리와 달리 추가 정보를 결합하면 복원이 가능하다는 점에서 구분된다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":86,"diff":2,"origin":"new","kind":"short","ans":["가명처리"] 간","주민등록번호"],"answer":4},{"id":"bka709fdbc","cat":"화장품법","type":"O/X","q":"마케팅 동의나 제3자 제공 동의처럼 정보주체가 선택적으로 동의할 수 있는 사항에 동의하지 아니한다는 이유로 재화 또는 서비스의 제공을 거부하여서는 아니 된다.","explain":"선택 동의 사항의 미동의를 이유로 한 서비스 제공 거부는 금지된다. 필수 동의와 선택 동의는 구분하여 각각 받아야 한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":89,"diff":1,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk88b8ab94","cat":"화장품법","type":"선다형","q":"정보주체의 동의 없이 개인정보를 수집·이용할 수 있는 경우가 아닌 것은?","explain":"마케팅 활용은 별도의 선택 동의를 받아야 하는 사항이지 동의 면제 사유가 아니다. 개인정보처리자의 정당한 이익이 인정되는 경우가 있긴 하나, 이는 '명백하게 정보주체의 권리보다 우선'하고 상당한 관련성과 합리적 범위를 넘지 않아야 한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":90,"diff":2,"origin":"new","kind":"mcq","opts":["법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우","공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우","명백히 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우","공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우","개인정보처리자가 신규 상품의 마케팅 활용을 위하여 필요하다고 판단한 경우"],"answer":4},{"id":"bk39c88897","cat":"화장품법","type":"단답형","q":"동의 없이 처리할 수 있는 개인정보라는 사실에 대한 입증책임은 누가 부담하는가?","explain":"개인정보처리자가 부담한다. 목적에 필요한 '최소한'의 개인정보를 수집했다는 입증책임 역시 개인정보처리자에게 있다. 두 입증책임 모두 정보주체가 아니라 처리자 쪽이라는 점이 핵심이다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":90,"diff":2,"origin":"new","kind":"short","ans":["개인정보처리자"]},{"id":"bk370bc6e2","cat":"화장품법","type":"빈칸채우기","q":"개인정보처리자는 목적에 필요한 (   )의 개인정보를 수집하여야 하며, 이에 대한 입증책임은 개인정보처리자가 부담한다.","explain":"개인정보 수집 제한의 핵심 키워드는 '최소한'이다. 최소한의 정보 외의 수집에는 동의하지 않을 수 있다는 사실을 구체적으로 알려야 하고, 미동의를 이유로 서비스 제공을 거부할 수 없다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":91,"diff":1,"origin":"new","kind":"short","ans":["최소한","최소한의","최소"]},{"id":"bkd52fb9cf","cat":"화장품법","type":"선다형","q":"주민등록번호를 처리할 수 있는 경우에 해당하지 않는 것은?","explain":"주민등록번호는 정보주체의 동의만으로는 처리할 수 없다는 점이 다른 고유식별정보와 결정적으로 다르다. 여권번호·운전면허번호·외국인등록번호는 별도 동의를 받으면 처리할 수 있으나, 주민등록번호는 법령상 근거·급박한 이익·보호위원회 고시 3가지 경우에만 가능하다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":91,"diff":3,"origin":"new","kind":"mcq","opts":["법률, 대통령령 등 구체적인 법적으로 주민등록번호의 처리를 요구하거나 허용한 경우","정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 명백히 필요하다고 인정되는 경우","보호위원회 고시로 위 내용에 준하여 주민등록번호 처리가 불가피하다고 정한 경우","정보주체로부터 다른 개인정보와 별도로 서면 동의를 받은 경우","위 어느 경우에도 해당하지 않으면 처리할 수 없다"],"answer":3},{"id":"bkcd99a9b2","cat":"화장품법","type":"O/X","q":"개인정보처리자가 민감정보 및 고유식별정보를 처리할 때에는 다른 개인정보의 처리에 대한 동의와 별도로 동의를 받아야 하며, 암호화 등 안전성 확보에 필요한 조치를 해야 한다.","explain":"민감정보와 고유식별정보는 '별도 동의 + 안전성 확보조치'가 세트다. 특히 고유식별정보는 대통령령으로 정하는 바에 따라 암호화 등의 조치를 하여야 한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":91,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bke7174bab","cat":"화장품법","type":"숫자기준","q":"고유식별정보 처리에 대한 개인정보 보호위원회의 정기 조사 기준으로 옳은 것은?","explain":"공공기관 1만 명, 공공기관 외의 자 5만 명, 주기는 3년마다 1회 이상이다. 공공기관 쪽 기준이 더 낮다(엄격하다)는 점으로 방향을 기억한다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":92,"diff":3,"origin":"new","kind":"mcq","opts":["공공기관은 1만 명 이상, 공공기관 외의 자는 5만 명 이상의 정보주체에 관하여 처리하는 경우, 3년마다 1회 이상","공공기관은 5만 명 이상, 공공기관 외의 자는 1만 명 이상의 정보주체에 관하여 처리하는 경우, 3년마다 1회 이상","공공기관은 1만 명 이상, 공공기관 외의 자는 5만 명 이상의 정보주체에 관하여 처리하는 경우, 2년마다 1회 이상","공공기관은 1만 명 이상, 공공기관 외의 자는 10만 명 이상의 정보주체에 관하여 처리하는 경우, 3년마다 1회 이상","공공기관은 10만 명 이상, 공공기관 외의 자는 5만 명 이상의 정보주체에 관하여 처리하는 경우, 매년 1회 이상"],"answer":0},{"id":"bk8025efe3","cat":"화장품법","type":"O/X","q":"일반적인 얼굴사진은 민감정보에 해당하지 않으나, 차후에 그 얼굴사진을 인증·식별 등의 목적으로 일정한 기술적 수단을 통해 처리한 경우에는 민감정보에 해당한다.","explain":"기술적으로 추출한 지문, 홍채, 정맥, 안면 정보는 민감정보다. 얼굴사진 자체가 아니라 '인증·식별 목적의 기술적 처리'가 민감정보 여부를 가른다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":92,"diff":3,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk72baf536","cat":"화장품법","type":"선다형","q":"고객의 주민등록증에 기재된 정보 중, 개인사업자가 고객의 동의를 받더라도 수집할 수 없는 것은?","explain":"주민등록증에 적힌 이름, 생년월일, 성별, 발행일, 주민등록기관, 사진은 주민등록번호가 아니므로 개인사업자도 동의를 받아 수집할 수 있다. 그러나 주민등록번호 자체는 법령상 근거 없이는 동의를 받아도 처리할 수 없다.","subj":"화장품법","chap":"CHAPTER 07 개인정보 보호법","page":92,"diff":3,"origin":"new","kind":"mcq","opts":["이름","생년월일","성별","발행일","주민등록번호"],"answer":4},{"id":"bk81a5a8e3","cat":"화장품법","type":"빈칸채우기","q":"개인정보처리자는 주민등록번호를 처리하는 경우에도 정보주체가 인터넷 홈페이지를 통하여 회원으로 가입하는 단계에서는 주민등록번호를 사 9fd","cat":"제조·품질","type":"단답형","q":"린스·헤어컨디셔너에 사용되어 모발에 흡착함으로써 정전기를 방지하고 살균 소독작용을 하는 계면활성제 계열을 쓰시오.","explain":"양이온 계면활성제이다. 섬유유연제·소독제에도 쓰이며 대표 성분은 세테아디모늄클로라이드(C16), 다이스텔아릴디이모늄클로라이드(C18), 베헨트라이모늄클로라이드(C22)이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":113,"diff":1,"origin":"new","ing":"원료 분류·특성","kind":"short","ans":["양이온 계면활성제","양이온계면활성제","양이온"]},{"id":"bkf007756e","cat":"제조·품질","type":"선다형","q":"다음 중 '표면(surface)'의 정의로 옳은 것은?","explain":"계면 중 상의 한 쪽이 기체일 때 기체/액체, 기체/고체 간의 경계면을 표면이라 한다. 두 개의 서로 다른 상이 접하고 있는 경계면 전체를 가리키는 말은 계면(interface)이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":114,"diff":2,"origin":"new","kind":"mcq","opts":["두 개의 서로 다른 상(Phase)이 접하고 있는 경계면","계면 중 상의 한 쪽이 기체일 때 기체/액체, 기체/고체 간의 경계면","표면 분자가 갖는 에너지를 총칭하는 것","서로 다른 두 액체의 경계면에서 나타나는 장력"],"answer":1},{"id":"bka5d3a110","cat":"제조·품질","type":"O/X","q":"계면활성제는 액체의 표면장력 또는 계면장력을 낮추어 주기에 계면의 면적이 전체적으로 증가된다.","explain":"옳다. 계면활성제가 표면·계면장력을 낮추면 액체가 구 모양으로 뭉치려는 힘이 약해져 계면의 면적이 전체적으로 증가한다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":114,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"ox","answer_ox":"O"},{"id":"bkdb0b917d","cat":"제조·품질","type":"선다형","q":"유화 분리 현상에 대한 설명 중 '오스트발트 숙성(ostwald ripening)'에 해당하는 것은?","explain":"오스트발트 숙성은 유화액 내 큰 입자와 작은 입자가 동시에 존재할 때 작은 입자가 큰 입자에 흡수되어 큰 입자가 더욱 커지는 현상이다. ①은 합일, ③은 응집, ④는 크리밍화의 설명이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":116,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["분산된 입자가 서로 결합하여 보다 큰 입자 상태로 되는 것","작은 입자가 큰 입자에 흡수되어 큰 입자가 더욱 커지는 현상","유화 입자 간 분산력에 의해 서로 결합하고 있는 상태","유화 입자끼리 응집된 상태가 비중차에 의하여 상층으로 부유 또는 하층으로 침강하는 운동학적 현상"],"answer":1},{"id":"bk88839c68","cat":"제조·품질","type":"단답형","q":"유화 입자끼리 응집된 상태가 비중차에 의하여 상층으로 부유하거나 하층으로 침강하는 운동학적 분리 현상을 무엇이라 하는가?","explain":"크리밍화(creaming)이다. 합일(coalescence)은 입자가 결합해 커지는 유화 파괴의 전단계, 응집(flocculation)은 분산력에 의해 서로 결합해 있는 상태이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":116,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"short","ans":["크리밍화","크리밍","creaming","크리밍화(creaming)"]},{"id":"bk387083ee","cat":"제조·품질","type":"O/X","q":"합일(coalescence) 현상이 계속되면 수상과 유상이 완전히 분리되는 상분리(phase separation)가 발생한다.","explain":"옳다. 합일은 분산된 입자가 서로 결합하여 더 큰 입자가 되는 현상으로 유화 파괴의 전단계로 판단되며, 계속되면 상분리로 이어진다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":116,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"ox","answer_ox":"O"},{"id":"bk49031059","cat":"제조·품질","type":"선다형","q":"유화액 형태의 판별 방법에 대한 설명으로 옳지 않은 것은?","explain":"물은 극성분자 물질로 전기전도도를 가지므로, 물이 외부상인 O/W형 유화액이 W/O형보다 훨씬 큰 전기전도도를 가진다. 외관상 O/W형은 크리미(creamy)하고 W/O형은 끈적이는(greasy) 느낌이 든다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":116,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["O/W형은 크리미한 질감을 가지나 W/O형은 끈적이는 느낌이 든다","O/W형에 수용성 염료를 넣으면 전체적으로 색이 퍼진다","O/W형은 물에 의해 희석 가능하고 오일에 첨가 시 층 분리가 나타난다","W/O형 유화액이 O/W형 유화액보다 훨씬 큰 전기전도도를 가진다"],"answer":3},{"id":"bk1edf12a9","cat":"제조·품질","type":"선다형","q":"유화제를 수상에 혼합한 후 유상을 가하여 유화하는 방법의 명칭은?","explain":"수중유화제법(agent-in-water method)이다. 반대로 유화제를 유상에 혼합한 후 수상을 가하는 방법은 유중유화제법(agent-in-oil method)이다. 비누형성법(nascent soap method)은 계면활성제의 알칼리로 되는 지방산을 유상에 용해시키고 알칼리류를 수상에 가하여 혼합·유화하는 방법이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":117,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["유중유화제법(agent-in-oil method)","수중유화제법(agent-in-water method)","비누형성법(nascent soap method)","전상온도 유화법","피커링 유화법"],"answer":1},{"id":"bk17f46b84","cat":"제조·품질","type":"선다형","q":"분산계의 종류와 예시의 연결이 옳지 않은 것은?","explain":"현탁액(suspension)은 고체(분산상)가 액체(연속상)에 분산된 형태로 파운데이션, 마스카라가 예시이다. 로션·크림은 유액(emulsion)의 예시이다.","subj":"제조·품질","chap":"CHAPTER 01-1 화장품 원료의 종류와 특성 <성상별>","page":117,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["에어로졸 — 헤어 스프레이","기포(foam) — 거품","유액(emulsion) — 로션, 크림","현탁액(suspension) — 로션, 크림","기타(고체 연속상) — 스틱제형 화장품"],"answer":3},{"id":"bk513b38d2","cat":"제조·품질","type":"단답형","q":"교재가 제시한 분산제의 종류 2가지를 쓰시오.","expla 원시켜 노화 예방 등의 목적으로 사용된다. 미생물에 의한 오염·부패·변질 예방은 보존제, 금속이온 결합·불활성화는 금속이온 봉쇄제의 목적이다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":125,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["박테리아나 곰팡이 등 미생물에 의한 오염과 부패를 예방한다","화장품의 산패를 방지하고 피부에서의 활성산소를 환원시켜 노화를 예방한다","금속성이온과 결합하여 이를 불활성화시킨다","제품의 pH를 조절하고 카보머를 중화한다","피부 위에 고분자 필름막을 형성한다"],"answer":1},{"id":"bk9f885a54","cat":"제조·품질","type":"선다형","q":"다음 중 산화방지제로 교재에 제시되지 않은 성분은?","explain":"산화방지제는 BHA(부틸하이드록시아니솔), 토코페롤(Vit.E), 아스코빅애씨드(Vit.C), BHT(부틸하이드록시톨루엔), 토코페롤아세테이트(Vit.E acetate), 코엔자임 Q10이다. 테트라소듐이디티에이는 금속이온 봉쇄제이다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":125,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["BHA(부틸하이드록시아니솔)","BHT(부틸하이드록시톨루엔)","코엔자임 Q10","테트라소듐이디티에이","토코페롤아세테이트"],"answer":3},{"id":"bk6ec3f93a","cat":"제조·품질","type":"혼동쌍구분","q":"산화방지제와 금속이온 봉쇄제를 구분한 설명으로 옳은 것은?","explain":"금속이온 봉쇄제(Chelating agent)는 금속성이온과 결합하여 불활성화시키는 성분으로, 화장품 원료와 친화력이 없는 칼슘·마그네슘이온이나 완제품의 산패에 영향을 미치는 철·구리 이온 등을 제거한다. 산화방지제는 산패 방지와 활성산소 환원이 목적이다. 둘 다 산패와 관련되지만 작용 대상(금속이온 vs 활성산소·산패 자체)이 다르다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":126,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["산화방지제는 금속이온과 결합해 불활성화시키고, 금속이온 봉쇄제는 활성산소를 환원시킨다","둘 다 미생물 증식을 억제하는 것이 주된 목적이다","금속이온 봉쇄제는 철·구리 등 금속이온을 제거하고, 산화방지제는 산패 방지와 활성산소 환원을 목적으로 한다","산화방지제는 사용기준이 지정고시된 원료만 사용할 수 있고, 금속이온 봉쇄제는 제한이 없다"],"answer":2},{"id":"bk941418c3","cat":"제조·품질","type":"단답형","q":"금속성이온과 결합하여 불활성화시키는 성분으로, 완제품의 산패에 영향을 미치는 철·구리 이온 등을 제거하는 데 사용되는 원료의 명칭을 쓰시오. (우리말 또는 영문 모두 인정)","explain":"금속이온 봉쇄제(Chelating agent)이다. 대표 성분은 EDTA(에틸렌다이아민테트라아세틱애씨드) 및 그 염류이다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":126,"diff":1,"origin":"new","ing":"원료 분류·특성","kind":"short","ans":["금속이온 봉쇄제","금속이온봉쇄제","킬레이팅제","Chelating agent","킬레이트제"]},{"id":"bkf9cc6d3b","cat":"제조·품질","type":"분류맞히기","q":"다음 중 금속이온 봉쇄제에 해당하지 않는 것은?","explain":"부틸하이드록시아니솔(BHA)은 산화방지제이다. 칼슘다이소듐이디티에이, 다이포타슘이디티에이, 테트라소듐이디티에이, 다이암모늄이디티에이, 티이에이-이디티에이, 트라이포타슘이디티에이는 모두 EDTA 염류로 금속이온 봉쇄제이다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":126,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["칼슘다이소듐이디티에이","다이포타슘이디티에이","테트라소듐이디티에이","트라이포타슘이디티에이","부틸하이드록시아니솔"],"answer":4},{"id":"bk25b58344","cat":"제조·품질","type":"O/X","q":"보존제는 사용기준이 지정고시된 원료로서, 그 외의 보존제 등은 사용할 수 없다.","explain":"옳다. 식품의약품안전처장은 보존제, 색소, 자외선차단제 등 특별히 사용상의 제한이 필요한 원료에 대하여 그 사용기준을 지정·고시하여야 하며, 지정·고시된 원료 외의 보존제·색소·자외선차단제 등은 사용할 수 없다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":126,"diff":1,"origin":"new","ing":"원료 분류·특성","kind":"ox","answer_ox":"O"},{"id":"bkcab9b7dd","cat":"제조·품질","type":"선다형","q":"이상적인 보존제의 조건으로 교재에 제시되지 않은 것은?","explain":"이상적인 보존제는 '넓은 온도 및 pH 범위에서 안정'해야 한다. 좁은 pH 범위에서만 작용해야 한다는 것은 반대이다. 그 밖에 안전할 것, 낮은 농도에서 다양한 균에 효과를 나타낼 것, 제품의 물리적 성질·외관적 특성에 영향을 주지 않을 것, 다른 원료 및 포장 재료와 반응하지 않을 것, 적절한 오일/물 분배계수를 가질 것, 자연계에서 쉽게 분해되고 분해산물에 독성이 없을 것, 원료 수급이 용이하고 가격이 저렴할 것 등이 있다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":126,"diff":3,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["사용하기에 안전할 것","낮은 농도에서 다양한 균에 대한 효과를 나타낼 것","좁은 pH 범위에서만 선택적으로 작용할 것","제품의 물리적 성질에 영향을 미치지 않을 것","자연계에서 쉽게 분해되고 분해산물에 독성이 없을 것"],"answer":2},{"id":"bk246a841d","cat":"제조·품질","type":"선다형","q":"보존제를 혼합하여 사용할 때 얻을 수 있는 장점으로 옳지 않은 것은?","explain":"보존제 혼합 사용의 장점은 저항성 미생물의 사멸이나 억제, 보존제 총 사용량의 '감소', 다양한 균에 대한 항균효과 발휘, 저항성 균의 출현을 억제하는 효과, 생화학적 상승 효과(synergism) 유발이다. 총 사용량은 늘어나는 것이 아니라 줄어든다.","subj":"제조·품질","chap":"CHAPTER 01-2 화장품 원료의 종류와 특성 <기능별>","page":127,"diff":2,"origin":"new","ing":"원료 분류·특성","kind":"mcq","opts":["저항성 미생물의 사멸이나 억제","다양한 균에 대한 항균효과 발휘","저항성 균의 출현을 억제하는 효과","보존제 총 사용량의 증가","생화학적 상승 효과(synergism) 유발"],"answer":3},{"id":"bkff51584e","cat":"제조·품질","type":"분류맞히기","q":"점도 조절제를 기원에 따라 분류할 때 연결이 옳지 않은 것은?","explain":"카보머는 '합성 고분자'이며 가장 많이 이용되는 점증제이다. 천연 고분자는 셀룰로오스검(식물), 젤라틴(동물), 잔탄검(미생물), 덱스트란(미생물)이고, 반합성 천연 고분자는 메틸셀룰로오스, 에틸셀룰로오스 등 셀룰로오스 유도체이다.","subj":"제조·  기능성화장품","page":205,"diff":2,"origin":"book","kind":"ox","answer_ox":"X"},{"id":"bk523a604a","cat":"제조·품질","type":"O/X","q":"모발의 색상을 변화시키는 기능을 가진 화장품은 유효성 또는 기능에 관한 자료로서 효력시험자료 및 인체적용시험자료 외에 염모효력시험자료도 추가로 제출해야 한다.","explain":"틀리다. 모발의 색상을 변화시키는 기능성화장품은 '염모효력시험자료만' 제출한다(교재 인쇄 정답 X, 염모효력시험자료만 제출). 효력시험자료·인체적용시험자료와 병렬로 더 내는 것이 아니라 이를 대체한다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":205,"diff":3,"origin":"book","ing":"기능성 고시성분","kind":"ox","answer_ox":"X"},{"id":"bk47671c90","cat":"제조·품질","type":"보기매칭","q":"기능성화장품 심사에 관한 규정 [별표 4] 자료제출이 생략되는 기능성화장품의 종류에서 성분·함량을 고시한 품목의 경우, 다음 &lt;보기&gt; 중 제출이 면제되는 자료만을 모두 고른 것은?  &lt;보기&gt; ㉠ 기원 및 개발 경위에 관한 자료 ㉡ 안전성에 관한 자료 ㉢ 유효성 또는 기능에 관한 자료 ㉣ 자외선차단지수(SPF), 내수성자외선차단지수(SPF), 자외선A차단등급(PA) 설정의 근거자료 ㉤ 기준 및 시험방법에 관한 자료","explain":"고시 품목은 ㉠기원 및 개발 경위, ㉡안전성, ㉢유효성 또는 기능 세 가지가 면제되고, ㉣자외선차단지수 등 근거자료와 ㉤기준 및 시험방법 자료는 제출해야 한다(교재 인쇄 정답 ㉠, ㉡, ㉢).","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":205,"diff":2,"origin":"book","ing":"기능성 고시성분","kind":"mcq","opts":["㉠, ㉡","㉠, ㉡, ㉢","㉡, ㉢","㉢, ㉣, ㉤","㉠, ㉢, ㉤"],"answer":1},{"id":"bkfa640924","cat":"제조·품질","type":"보기매칭","q":"식품의약품안전처 고시 「기능성화장품 기준 및 시험방법(KFCC)」의 원료로 제조되거나 제조되어 수입된 기능성화장품의 경우 제출이 면제되는 자료는?  &lt;보기&gt; ㉠ 기원 및 개발 경위에 관한 자료 ㉡ 안전성에 관한 자료 ㉢ 유효성 또는 기능에 관한 자료 ㉣ 자외선차단지수(SPF) 등 설정의 근거자료 ㉤ 기준 및 시험방법에 관한 자료","explain":"KFCC·국제화장품원료집(ICID)·「식품의 기준 및 규격」에서 정하는 원료로 제조된 경우 면제되는 것은 ㉡안전성에 관한 자료뿐이고 나머지 ㉠㉢㉣㉤은 모두 제출해야 한다(교재 인쇄 정답 ㉡). 다만 인체적용시험자료에서 피부이상반응 등 안전성 문제가 우려된다고 식약처장이 인정하면 면제되지 않는다. [별표 4] 고시품목(㉠㉡㉢ 면제)과 반드시 구분한다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":205,"diff":3,"origin":"book","ing":"기능성 고시성분","kind":"mcq","opts":["㉠","㉡","㉢","㉠, ㉡","㉡, ㉢"],"answer":1},{"id":"bk19de34ad","cat":"제조·품질","type":"선다형","q":"기능성화장품 심사의뢰서에 첨부해야 하는 제출서류에 해당하지 않는 것은?","explain":"제조판매 실적에 관한 자료는 심사 제출서류가 아니다. 심사 제출서류는 ①기원 및 개발 경위 ②안전성 ③유효성 또는 기능 ④자외선차단지수 관련 근거자료 ⑤기준 및 시험방법의 5가지이며, 앞글자 '기-안-유-자-기'로 묶어 외운다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":188,"diff":1,"origin":"new","ing":"기능성 고시성분","kind":"mcq "기능성 고시성분","kind":"mcq","opts":["착색제·착향제만 다른 경우","효능·효과를 나타나게 하는 원료의 종류·규격 및 분량이 동일할 것(액상인 경우 농도)","효능·효과를 나타나게 하는 성분을 제외한 대조군과의 비교실험으로 효능을 입증한 경우","유화제·용해보조제만 다른 경우","점도조절제·용제만 다른 경우"],"answer":1},{"id":"bk42274add","cat":"제조·품질","type":"선다형","q":"[별표 4]의 성분·함량을 사용한 자외선차단 기능성화장품 중 자외선차단지수(SPF)가 10 이하인 제품의 경우, 심사 시 제출이 면제되지 않고 남는 자료는?","explain":"별표 4에 고시된 성분·함량을 사용하면 제4조제1호 가목(기원 및 개발경위)·나목(안전성)·다목(유효성 또는 기능) 자료가 면제되고, 자외선차단제품은 원칙적으로 라목(SPF·내수성SPF·PA 설정 근거자료)을 제출해야 한다. 다만 「기능성화장품 심사에 관한 규정」 제6조에 따라 SPF 10 이하 제품은 이 라목 자료도 면제되므로, 결국 제4조제2호 '기준 및 시험방법에 관한 자료'만 남는다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":195,"diff":3,"origin":"new","ing":"기능성 고시성분","flag":"law","kind":"mcq","opts":["기원 및 개발 경위에 관한 자료","안전성에 관한 자료","유효성 또는 기능에 관한 자료","자외선차단지수(SPF), 내수성자외선차단지수(SPF, 내수성 또는 지속내수성) 및 자외선A차단등급(PA) 설정의 근거자료","기준 및 시험방법에 관한 자료"],"answer":4},{"id":"bkb68a1e1a","cat":"제조·품질","type":"O/X","q":"기능성화장품의 제품명은 이미 심사를 받은 기능성화장품의 명칭과 동일하지 아니하여야 하나, 수입품목의 경우 서로 다른 책임판매업자가 제조소(원)가 같은 동일 품목을 수입하는 때에는 책임판매업자명을 병기하여 구분한다.","explain":"옳다. 심사기준상 제품명은 이미 심사받은 기능성화장품 명칭과 달라야 하며, 수입품목에 한해 책임판매업자명 병기로 구분한다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":195,"diff":3,"origin":"new","ing":"기능성 고시성분","kind":"ox","answer_ox":"O"},{"id":"bk65e41616","cat":"제조·품질","type":"선다형","q":"기능성화장품의 원료 및 분량 기재에 관한 설명으로 옳지 않은 것은?","explain":"국제화장품원료집의 원료는 INCI(International Nomenclature Cosmetic Ingredient) 명칭을 한글로 기재하며, '별첨규격'은 원료집에 없는 경우에 쓰는 표기다. 나머지는 옳다: 100밀리리터중 또는 100그람중 원칙, 분사제는 100그람중(원액과 분사제의 양 구분표기), 사용한도가 지정되지 않은 착색제·착향제·용제 등은 적량 기재 가능, 식약처장 지정 색소(황색 4호 제외)는 '식약처장지정색소'로 기재 가능.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":196,"diff":3,"origin":"new","ing":"기능성 고시성분","kind":"mcq","opts":["원료 및 그 분량은 '100밀리리터중' 또는 '100그람중'으로 기재함을 원칙으로 한다","분사제는 '100그람중'(원액과 분사제의 양 구분표기)의 함량으로 기재한다","사용한도가 지정되어 있지 않은 착색제·착향제·용제 등은 적량으로 기재할 수 있다","착색제 중 식품의약품안전처장이 지정하는 색소(황색 4호 제외)를 배합하는 경우 성분명을 '식약처장지정색소'로 기재할 수 있다","국제화장품원료집에 수재된 원료라도 반드시 '별첨규격'으로만 기재해야 한다"],"answer":4},{"id":"bk76d0bb1e","cat":"제조·품질","type":"단답형","q":"[별표 4] 자료제출이 생략되는 기능성화장품 중 피부의 미백에 도움을 주는 성분으로 고시된 '알부틴'의 함량은?","explain":"알부틴은 2~5%다(교재 연습문제 인쇄 정답 2~5). 같은 미백 고시성분 중 나이아신아마이드도 2~5%, 마그네슘아스코빌포스페이트 3%, 닥나무추출물 2%, 유용성감초추출물 0.05%, 알파-비사보롤 0.5%, 에칠아스코빌에텔 1~2%, 아스코빌글루코사이드 2%, 아스코빌테트라이소팔미테이트 2%다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":198,"diff":2,"origin":"book","ing":"기능성 고시성분","kind":"short","ans":["2~5%","2~5","2 ~ 5%","2%~5%"]},{"id":"bkdd427a3c","cat":"제조·품질","type":"선다형","q":"피부의 주름개선에 도움을 주는 고시성분과 함량의 연결이 옳지 않은 것은?","explain":"덱스판테놀은 주름개선이 아니라 '탈모 증상의 완화'에 관한 고시성분이다. 주름개선 고시성분은 레티놀 2,500IU/g, 레티닐팔미테이트 10,000IU/g, 아데노신 0.04%, 폴리에톡실레이티드레틴아마이드 0.05~0.2%의 4가지뿐이다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":198,"diff":3,"origin":"new","ing":"기능성 고시성분","kind":"mcq","opts":["레티놀 - 2,500IU/g","레티닐팔미테이트 - 10,000IU/g","아데노신 - 0.04%","폴리에톡실레이티드레틴아마이드 - 0.05~0.2%","덱스판테놀 - 0.04%"],"answer":4,"compare":[["폴리에톡실레이티드레틴아마이드","0.05~0.2%"],["아데노신","0.04%"]]},{"id":"bk50bf1b25","cat":"제조·품질","type":"빈칸채우기","q":"체모를 제거하는 기능을 가진 제품의 고시성분인 '치오글리콜산 80%'는 치오글리콜산으로서 ( )%이며, 이 제품의 pH 범위는 ( ) 이상 ( ) 미만이어야 한다.","explain":"체모제거 제품은 치오글리콜산으로서 3.0~4.5%(교재 연습문제 인쇄 정답 3.0~4.5), pH는 7.0 이상 12.7 미만이다. 제형은 액제·크림제·로션제·에어로졸제이며, 용법은 5~10분간 두었다가 제거한다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":199,"diff":3,"origin":"book","ing":"기능성 고시성분","kind":"short","ans":["3.0~4.5, 7.0, 12.7","3.0~4.5 / 7.0 / 12.7","3.0~4.5, 7.0 이상 12.7 미만"]},{"id":"bk0e9741e6","cat":"제조·품질","type":"단답형","q":"여드름성 피부를 완화하는 데 도움을 주는 제품의 고시성분과 그 함량을 쓰시오.","explain":"여드름성 피부 완화 고시성분은 살리실릭애씨드 0.5%다(교재 연습문제 인쇄 정답 0.5). 유형은 인체세정용 제품류(비누조성의 제제), 제형은 액제·로션제·크림제에 한하며 부직포 등에 침적된 상태는 제외된다.","subj":"제조·품질","chap":"CHAPTER 04 기능성화장품","page":199,"diff":2,"origin":"book","ing":"기능성 고시성분","kind":"short","ans":["살리실릭애씨드 0.5%","살리실릭애씨드 0.5","살리실릭애씨드, 0.5%"]},{"id":"bk1a786919","cat":"제조·품질","type":"선다형","q":"자외선차단 고시성분과 최대함량의 연결이 옳지 않은 것은?","explain":"티타늄디옥사이드는 25%(자외선차단성분으로서)이며 징크옥사이드도 25%다. 드로메트리졸 1%, 벤조페논-3 5%, 에칠헥실메톡시신나메이트 7.5%, 호모살레이트 10%는 옳다. 그 밖에 벤조 시 다음에 모든 착색제 성분을 함께 기재·표시할 수 있다"],"answer":3},{"id":"bkd08f22e6","cat":"제조·품질","type":"선다형","q":"영업자의 상호 및 주소의 기재·표시에 대한 설명으로 옳지 않은 것은?","explain":"공정별로 2개 이상의 제조소에서 생산된 화장품의 경우에는 일부 공정을 수탁한 화장품제조업자의 상호 및 주소의 기재·표시를 생략할 수 있다(209쪽 ③). 교재 연습문제 8번의 정답도 X(수탁업체 생략가능)이다.","subj":"제조·품질","chap":"CHAPTER 05 기재사항","page":209,"diff":3,"origin":"new","kind":"mcq","opts":["영업자의 주소는 등록필증 또는 신고필증에 적힌 소재지 또는 반품·교환 업무를 대표하는 소재지를 기재·표시한다","'화장품제조업자', '화장품책임판매업자', '맞춤형화장품판매업자'는 각각 구분하여 기재·표시해야 한다","한 사업자가 다른 영업을 함께 영위하는 경우에는 한꺼번에 기재·표시할 수 있다","공정별로 2개 이상의 제조소에서 생산된 화장품은 모든 제조업자의 상호 및 주소를 빠짐없이 기재·표시해야 한다","수입화장품은 제조국의 명칭, 제조회사명 및 그 소재지를 국내 '화장품제조업자'와 구분하여 기재·표시해야 한다"],"answer":3},{"id":"bkbb0e623c","cat":"제조·품질","type":"선다형","q":"화장품 성분의 기재·표시에 관한 설명으로 옳은 것은?","explain":"착향제는 원칙적으로 '향료'로 표시할 수 있으나, 고시된 알레르기 유발성분이 있으면 해당 성분의 명칭을 기재·표시해야 한다. pH 조절 목적 성분은 중화반응에 따른 생성물로, 비누화반응을 거치는 성분은 비누화반응에 따른 생성물로 기재할 수 있다. '기타 성분' 표시는 식품의약품안전처장에게 근거자료를 제출하고 정당한 이익 침해 우려를 인정받은 경우에만 가능하다.","subj":"제조·품질","chap":"CHAPTER 05 기재사항","page":210,"diff":2,"origin":"new","kind":"mcq","opts":["착향제는 어떤 경우에도 '향료'로만 표시할 수 있다","착향제의 구성 성분 중 식품의약품안전처장이 정하여 고시한 알레르기 유발성분이 있는 경우에는 향료로 표시할 수 없고 해당 성분의 명칭을 기재·표시해야 한다","산성도(pH) 조절 목적으로 사용되는 성분은 반드시 원래 성분명으로만 표시해야 한다","비누화반응을 거치는 성분은 반응 전 원료명으로만 표시해야 한다","영업자의 정당한 이익을 침해할 우려가 있으면 근거자료 제출 없이 '기타 성분'으로 표시할 수 있다"],"answer":1},{"id":"bkd9ec53ae","cat":"제조·품질","type":"O/X","q":"내용물의 용량 또는 중량은 1차 포장 또는 2차 포장의 무게가 포함된 값으로 기재·표시해야 한다.","explain":"1차 포장 또는 2차 포장의 무게가 포함되지 않은 용량 또는 중량을 기재·표시해야 한다(210쪽 4번).","subj":"제조·품질","chap":"CHAPTER 05 기재사항","page":210,"diff":1,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bk6969b9cb","cat":"제조·품질","type":"선다형","q":"수분을 포함한 중량과 건조중량을 함께 기재·표시해야 하는 제품은?","explain":"'화장 비누'는 고체 형태의 세안용 비누를 말하며, 이 경우 수분을 포함한 중량과 건조중량을 함께 기재·표시해야 한다(210쪽). 교재 연습문제 9번은 '액체 형태'로 바꾼 오답 문장이며 정답이 X(고체비누)였다.","subj":"제조·품질","chap":"CHAPTER 05 기재사항","page":210,"diff":2,"origin":"variant","kind":"mcq","opts":["액체 형태의 세안용 비누","고체 형태의 세안용 비누(화장 비누)","바디클렌저","샴푸","클렌징 오일 다. 일탈 = 미리 정해진 CGMP를 벗어나 이루어진 행위, 기준일탈 = 규정된 합격 판정 기준에 일치하지 않는 검사·측정 또는 시험결과.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":243,"diff":3,"origin":"new","kind":"mcq","opts":["일탈은 시험결과가 합격 판정 기준에 맞지 않는 것, 기준일탈은 정해진 기준을 벗어난 행위","일탈은 정해진 기준을 벗어나 이루어진 행위, 기준일탈은 규정된 합격 판정 기준에 일치하지 않는 검사·측정 또는 시험결과","둘 다 시험결과에 관한 용어로 사실상 같은 뜻이다","일탈은 제조에만, 기준일탈은 포장에만 적용된다","일탈은 완제품에만, 기준일탈은 원자재에만 적용된다"],"answer":1},{"id":"bk5c7b1877","cat":"유통안전","type":"선다형","q":"'벌크 제품'의 정의로 옳은 것은?","explain":"벌크 제품 = 충전(1차포장) 이전의 제조 단계까지 끝낸 제품. ①은 반제품, ③은 완제품, ④는 원료, ⑤는 제조단위(뱃치)의 정의다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":3,"origin":"new","kind":"mcq","opts":["제조공정 단계에 있는 것으로서 필요한 제조공정을 더 거쳐야 하는 것","충전(1차포장) 이전의 제조 단계까지 끝낸 제품","출하를 위해 포장 및 첨부문서에 표시공정 등을 포함한 모든 제조공정이 완료된 화장품","벌크 제품의 제조에 투입하거나 포함되는 물질","하나의 공정으로 제조되어 균질성을 갖는 화장품의 일정한 분량"],"answer":1},{"id":"bk3fd76af9","cat":"유통안전","type":"단답형","q":"'제조공정 단계에 있는 것으로서 필요한 제조공정을 더 거쳐야 벌크 제품이 되는 것'을 가리키는 CGMP 용어를 쓰시오.","explain":"반제품 → 벌크 제품(충전 이전 단계까지 완료) → 완제품(포장·표시공정까지 완료) 순서로 정리해 둘 것.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":2,"origin":"new","kind":"short","ans":["반제품"]},{"id":"bk7dd05e65","cat":"유통안전","type":"O/X","q":"CGMP상 '포장재'에는 운송을 위해 사용되는 외부 포장재도 포함된다.","explain":"포장재는 화장품의 포장에 사용되는 모든 재료를 말하며 운송을 위해 사용되는 외부 포장재는 '제외'한다. 제품과 직접 접촉하는지 여부에 따라 1차 또는 2차 포장재로 구분한다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":2,"origin":"new","kind":"ox","answer_ox":"X"},{"id":"bkdb63a097","cat":"유통안전","type":"선다형","q":"'재작업'에 대한 CGMP상의 정의로 옳은 것은?","explain":"②는 회수, ③은 공정관리, ④는 불만, ⑤는 유지관리의 정의다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":2,"origin":"new","kind":"mcq","opts":["적합 판정기준을 벗어난 완제품, 벌크제품 또는 반제품을 재처리하여 품질이 적합한 범위에 들어오도록 하는 작업","판매한 제품 가운데 품질 결함이나 안전성 문제로 나타난 제조번호의 제품을 제조소로 거두어들이는 활동","제조공정 중 적합판정기준의 충족을 보증하기 위하여 공정을 모니터링하거나 조정하는 모든 작업","제품이 규정된 적합판정기준을 충족시키지 못한다고 주장하는 외부 정보","적절한 작업 환경에서 건물과 설비가 유지되도록 이루어지는 지원 및 검증 작업"],"answer":0},{"id":"bk5087dcef","cat":"유통안전","type":"혼동쌍구분","q":"'감사'와 '내부감사'를 구분하는 핵심 요건은 무엇인가?","explain":"감사와 내부감사는 목적·성격(체계적이고 독립적인 조사)이 동일하되, 내부감사는 '회사 내 자격이 있는 직원에 의해' 행해진다는 점이 다르다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":3,"origin":"new","kind":"mcq","opts":["조사 대상이 제조공정인지 품질관리인지 여부","조사 시점이 출하 전인지 후인지 여부","회사 내 자격이 있는 직원에 의해 행해지는지 여부","식품의약품안전처장의 승인을 받았는지 여부","문서로 기록되는지 여부"],"answer":2},{"id":"bkebb78a7d","cat":"유통안전","type":"단답형","q":"규정된 조건 하에서 측정기기나 측정 시스템에 의해 표시되는 값과 표준기기의 참값을 비교하여 오차가 허용범위 내에 있음을 확인하고, 벗어나는 경우 허용범위 내에 들도록 조정하는 것을 무엇이라 하는가?","explain":"검교정의 정의다. '확인'에서 그치지 않고 벗어난 경우 '조정'까지 포함한다는 점이 핵심이다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":243,"diff":2,"origin":"new","kind":"short","ans":["검교정","검·교정"]},{"id":"bke6c54193","cat":"유통안전","type":"혼동쌍구분","q":"'제조번호(뱃치번호)'와 '제조단위(뱃치)'의 설명을 바르게 연결한 것은?","explain":"제조번호(뱃치번호)는 '번호'(숫자·문자·기호 또는 이들의 조합)이고, 제조단위(뱃치)는 '분량'(균질성을 갖는 일정한 양)이다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":244,"diff":3,"origin":"new","kind":"mcq","opts":["제조번호 - 균질성을 갖는 화장품의 일정한 분량 / 제조단위 - 숫자·문자·기호의 조합","제조번호 - 제조관리 및 출하에 관한 모든 사항을 확인할 수 있도록 표시된 번호 / 제조단위 - 하나의 공정이나 일련의 공정으로 제조되어 균질성을 갖는 화장품의 일정한 분량","둘 다 화장품의 일정 분량을 뜻하는 같은 말이다","제조번호 - 완제품에만 부여 / 제조단위 - 원자재에만 부여","제조번호 - 수탁자가 부여 / 제조단위 - 제조업자가 부여"],"answer":1},{"id":"bk14ced4bd","cat":"유통안전","type":"선다형","q":"품질보증책임자의 업무로 보기 어려운 것은?","explain":"구매 단가·거래처 선정은 품질보증책임자의 업무로 규정되어 있지 않다. 나머지는 모두 품질보증책임자의 업무이며, 이 밖에 부적합품 처리 확인, 불만처리와 제품회수 주관도 포함된다.","subj":"유통안전","chap":"CHAPTER 02 우수화장품 제조 및 품질관리기준(CGMP)","page":245,"diff":2,"origin":"new","kind":"mcq","opts":["품질에 관련된 모든 문서와 절차의 검토 및 승인","일탈이 있는 경우 이의 조사 및 기록","적합 판정한 원자재 및 제품의 출고 여부 결정","기준일탈 제품의 재작업 실시 결정","제품 원료의 구매 단가 결정 및 거래처 선정"],"answer":4},{"id":"bkc9602da2","cat":"유통안전","type":"O/X","q":"교육 종료 후 교육결과를 평가하여 일정한 수준에 미달할 경우에는 재교육을 받아야 한다.","explain":"교육훈련 규정상 평가 후 미달 시 재교육이 의무다. 또한 신규 채용 직원은 기본 교육훈련 외에 추가 교육훈련을 받아야 하며 관련 문서화된 절  월 1회 락스 소독 후 완전히 제거하여 청소한다.","청소 후에는 작업실 내의 물기를 완전히 제거하고 배수구 뚜껑을 꼭 닫는다.","소독 시에는 제조기계, 기구류 등을 완전히 밀봉하여 먼지·이물·소독액제가 오염되지 않도록 한다.","배수로 및 배수구는 주 1회 알코올로 소독한다."],"answer":4},{"id":"bka2e394a0","cat":"유통안전","type":"선다형","q":"반제품 보관소의 청소·관리 방법으로 옳지 않은 것은?","explain":"반제품 보관소는 '대청소를 제외하고는 물청소를 금지'하며, 부득이하게 물청소를 했을 경우 즉시 물기를 완전히 제거해야 한다. 원칙과 예외가 뒤바뀐 선지다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":248,"diff":3,"origin":"new","kind":"mcq","opts":["제품 특성에 따라 적절한 온·습도관리기준을 설정하여 유지한다.","해당 직원 이외의 출입을 통제한다.","대청소를 제외하고는 물청소를 금지한다.","내용물 저장통은 항상 밀봉하여 환경균, 먼지 등에 오염되지 않도록 한다.","물청소를 원칙으로 하고 대청소 시에만 건식 청소를 실시한다."],"answer":4},{"id":"bkc15d508c","cat":"유통안전","type":"선다형","q":"원료 취급 구역의 준수사항으로 옳지 않은 것은?","explain":"포장이 훼손된 원료는 즉시 폐기가 아니라 '봉인하거나 즉시 별도의 저장조에 보관한 후 품질상의 처분 결정을 위해 격리'해야 한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":248,"diff":3,"origin":"new","kind":"mcq","opts":["원료보관소와 칭량실은 구획되어 있어야 한다.","모든 드럼의 윗부분은 이송 전 또는 칭량구역에서 개봉 전에 검사하고 깨끗하게 유지해야 한다.","원료 용기들은 실제로 칭량하는 원료인 경우를 제외하고는 적합하게 뚜껑을 덮어 보관해야 한다.","선입 선출이 용이하도록 구분하여 적재하고, 상부의 물품으로 인해 하부 물품의 변형이 생기지 않도록 방지해야 한다.","원료의 포장이 훼손된 경우 즉시 폐기 처리해야 한다."],"answer":4},{"id":"bk6085effe","cat":"유통안전","type":"선다형","q":"직원 시설 등에 관한 준수사항으로 옳지 않은 것은?","explain":"구내식당과 쉼터(휴게실)는 '위생적이고 잘 정비된 상태로 유지'해야 한다는 규정이 있을 뿐, 생산구역 내 설치는 오히려 오염 위험을 높인다. 음식물은 생산구역과 분리된 지정 구역에서만 취급한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":249,"diff":2,"origin":"new","kind":"mcq","opts":["화장실, 탈의실 및 손 세척 설비는 작업구역과 분리되어야 하며 쉽게 이용할 수 있어야 한다.","손 세척 설비는 온수, 냉수, 세제와 1회용 종이 타올 또는 접촉하지 않은 손 건조기를 포함한다.","음식물은 생산구역과 분리된 지정된 구역에서만 보관·취급하고 작업소 내부로 음식물 반입을 금지해야 한다.","음용수를 제공하기 위한 정수기는 정상적으로 작동하는 상태이어야 하고 위생적이어야 한다.","구내식당과 쉼터는 생산구역 내에 두어 이동 동선을 최소화해야 한다."],"answer":4},{"id":"bk77e41c06","cat":"유통안전","type":"보기매칭","q":"공기 조절의 4대 요소와 그 대응설비의 연결이 옳지 않은 것은?","explain":"청정도-공기정화기, 실내온도-열교환기, 습도-가습기, 기류-송풍기가 정확한 짝이다. 청정도에 열교환기를 붙인 ⑤가 오답이다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":250,"diff":2,"origin":"new","kind":"mcq","o ":1},{"id":"bkbfd742f5","cat":"유통안전","type":"선다형","q":"미디움필터(M/F)에 관한 설명으로 옳지 않은 것은?","explain":"세척 후 3~4회 재사용(재사용 2~3회)은 프리필터(PRE Filter)의 특징이다. 미디움필터는 포집효율 95%의 중고성능 필터로 헤파필터 전처리용이다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":252,"diff":3,"origin":"new","kind":"mcq","opts":["HEPA Filter의 전처리용으로 사용된다.","포집효율 95%를 보증하는 중고성능 필터다.","압력손실은 16mmAq 이하, 필터입자는 0.5μm이다.","Clean Room 정밀기계공업 등에서 Hepa Filter 전처리용으로 쓰인다.","세척 후 3~4회 재사용이 가능한 것이 특징이다."],"answer":4,"compare":[["미디움필터(M/F)","압력손실 16mmAq 이하, 필터입자 0.5μm"],["프리필터(P/F)","압력손실 9mmAq 이하, 필터입자 5μm"],["헤파필터(H/F)","압력손실 24mmAq 이하, 필터입자 0.3μm, 0.3μm 분진 99.97% 제거"]]},{"id":"bkeb9ce247","cat":"유통안전","type":"선다형","q":"프리필터(P/F)의 특징으로 옳지 않은 것은?","explain":"0.3μm 99.97% 포집·반도체 클린 오븐 사용은 헤파필터의 특징이다. 프리필터는 10~30μm 미립자를 제거하는 전처리용이며 Bag type은 처리용량을 4배 이상 높일 수 있다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":252,"diff":2,"origin":"new","kind":"mcq","opts":["HEPA, MEDIUM 등의 전처리용이다.","대기 중 먼지 등 인체에 해를 미치는 미립자(10~30μm)를 제거한다.","압력손실이 낮고 고효율로 Dust 포집량이 크다.","틀 또는 세제로 세척하여 사용 가능하여 경제적이다(재사용 2~3회).","0.3μm 입자를 99.97% 이상 포집하여 반도체 클린 오븐에 사용한다."],"answer":4,"compare":[["프리필터(P/F)","압력손실 9mmAq 이하, 필터입자 5μm"],["미디움필터(M/F)","압력손실 16mmAq 이하, 필터입자 0.5μm"],["헤파필터(H/F)","압력손실 24mmAq 이하, 필터입자 0.3μm, 0.3μm 분진 99.97% 제거"]]},{"id":"bkb13c0909","cat":"유통안전","type":"O/X","q":"초고성능 필터를 설치한 작업소에서 일반적인 작업을 실시할 경우, 바로 필터가 막혀버려서 작업 환경이 악화될 수 있다.","explain":"적어도 중성능 필터 설치를 권장하며, 고도의 환경 관리가 필요하면 고성능 필터(HEPA)를 설치한다. 무조건 고성능이 좋은 것이 아니라 '작업 목적에 맞는 필터 선택'이 중요하다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":251,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bkaa4b50b9","cat":"유통안전","type":"숫자기준","q":"작업장의 온·습도 관리기준으로 옳은 것은?","explain":"온도는 1~30℃, 습도는 80% 이하로 관리한다. 제품 특성상 온습도에 민감한 제품은 별도 관리체계를 갖춘다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":253,"diff":2,"origin":"new","kind":"mcq","opts":["온도 1~30℃, 습도 80% 이하","온도 10~30℃, 습도 60% 이하","온도 1~30℃, 습도 60% 이하","온도 15~25℃, 습도 80% 이하","온도 20~25℃, 습도 50% 이하"] q":"청정도 4등급(일반작업실, 내용물 완전폐색)에 해당하지 않는 곳은?","explain":"내용물보관소는 2등급이다. 4등급은 포장재보관소, 완제품보관소, 관리품보관소, 원료보관소, 갱의실, 일반시험실이며 환기장치로 관리하고 관리기준·작업복장 규정이 별도로 없다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":254,"diff":3,"origin":"new","kind":"mcq","opts":["포장재보관소","완제품보관소","원료보관소","갱의실","내용물보관소"],"answer":4,"compare":[["청정도 4등급","환기장치(환기, 온도조절), 관리기준 및 작업복장 규정 없음"],["청정도 1등급","청정공기 순환 20회/hr 이상 또는 차압 관리, 낙하균 10개/hr 또는 부유균 20개/㎥"],["청정도 2등급","청정공기 순환 10회/hr 이상 또는 차압 관리, 낙하균 30개/hr 또는 부유균 200개/㎥"],["청정도 3등급","차압 관리(청정공기 순환 기준 없음)"]]},{"id":"bk35fbedb4","cat":"유통안전","type":"단답형","q":"청정도 1등급의 해당 작업실(대상시설: 청정도 엄격관리)은 무엇인가?","explain":"1등급은 Clean bench이며 구조조건으로 Pre-filter, Med-filter, HEPA-filter, Clean bench/booth, 온도 조절이 요구된다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":253,"diff":2,"origin":"new","kind":"short","ans":["Clean bench","클린벤치","clean bench","청정작업대"]},{"id":"bk95d72441","cat":"유통안전","type":"O/X","q":"일반적으로 4급지 &lt; 3급지 &lt; 2급지 순으로 실압을 높여 외부의 먼지가 작업장으로 유입되지 않도록 설계한다.","explain":"높은 청정 등급의 공기압이 낮은 등급보다 높아야 하며, 예로 충전실(2급) → 포장실(3급) 방향으로 공기가 흐르도록 공급한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":253,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bk0e696726","cat":"유통안전","type":"선다형","q":"파우더 충진실과 같이 작업실이 분진 발생, 악취 등 주변을 오염시킬 우려가 있는 경우의 관리 방법으로 옳은 것은?","explain":"원칙은 양압 유지이지만, 분진·악취로 주변을 오염시킬 우려가 있는 작업실(파우더 충진실 등)은 예외적으로 음압 관리하며 오염방지대책을 마련해야 한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":253,"diff":3,"origin":"new","kind":"mcq","opts":["해당 작업실을 더 강한 양압으로 관리한다.","해당 작업실을 음압으로 관리하고 적절한 오염방지대책을 마련한다.","청정도 등급을 1등급으로 상향한다.","차압 관리를 하지 않고 개방 상태로 둔다.","습도를 80% 이상으로 유지한다."],"answer":1},{"id":"bk66e4de4a","cat":"유통안전","type":"단답형","q":"무균작업 실험대(sterile air hood)라고도 하며, 작업대 위 작업공간을 국부적으로 완전 무균·무진상태로 하여 청정한 공기의 흐름으로 작업이 이루어지도록 한 박스형 장치를 무엇이라 하는가?","explain":"클린벤치는 청정도 1등급의 해당 작업실이며, 기류방식에 따라 수평형, 수직형, 순환형이 있다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":254,"diff":2,"origin":"new","kind":"short","ans":["클린벤치","Clean bench","clean bench","클린 벤치"]},{"id":"bk1cd21490","cat":"유통안전","type":"단답형","q":"실내외를 불문하고 대상 작업소에서 오염된 부유 미생물을 직접 평판배지 위에 일정 시간 자연 낙하시켜 측정하는 방법을 무엇이라 하는가? (별칭 포함)","explain":"낙하균 측정법(Koch법)이다. 특별한 기기 없이 간편하지만 공기 중 전체 미생물을 측정할 수 없다는 단점이 있다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":254,"diff":2,"origin":"new","kind":"short","ans":["낙하균 측정법","Koch법","코흐법","낙하균 측정법(Koch법)"]},{"id":"bk74db4c3a","cat":"유통안전","type":"선다형","q":"낙하균 측정 위치에 관한 기준으로 옳은 것은?","explain":"일반적으로 작은 방은 약 5개소를 측정하며, 5개소 이하로 측정하면 올바른 평가가 어렵다. 측정위치는 벽에서 30cm 떨어진 곳이 좋다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":255,"diff":3,"origin":"new","kind":"mcq","opts":["작은 방은 약 3개소 측정하고 측정위치는 벽에서 10cm 떨어진 곳이 좋다.","작은 방은 약 5개소 측정하고 측정위치는 벽에서 30cm 떨어진 곳이 좋다.","작은 방은 약 10개소 측정하고 측정위치는 벽에서 50cm 떨어진 곳이 좋다.","작은 방은 약 5개소 측정하고 측정위치는 벽에서 1m 떨어진 곳이 좋다.","측정 개소와 위치에 관한 기준은 없다."],"answer":1},{"id":"bkc2f7a3a1","cat":"유통안전","type":"빈칸채우기","q":"낙하균 측정높이는 바닥에서 측정하는 것이 원칙이지만 부득이한 경우 바닥으로부터 ( ㉠ )~( ㉡ )cm 높은 위치에서 측정하는 경우가 있다. ㉠, ㉡을 쓰시오.","explain":"바닥으로부터 20~30cm 높은 위치다. 벽에서 30cm 떨어진 위치와 혼동하지 않도록 주의한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":255,"diff":3,"origin":"new","kind":"short","ans":["20, 30","20~30","20 30","20-30"]},{"id":"bk059de5f4","cat":"유통안전","type":"숫자기준","q":"낙하균 측정 시 배양 조건으로 옳은 것은?","explain":"세균용 배지는 30~35℃에서 48시간 이상, 진균용 배지는 20~25℃에서 5일 이상 배양한다. 진균이 더 낮은 온도에서 더 오래 배양된다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":255,"diff":3,"origin":"new","kind":"mcq","opts":["세균용 배지 20~25℃ 5일 이상, 진균용 배지 30~35℃ 48시간 이상","세균용 배지 30~35℃ 48시간 이상, 진균용 배지 20~25℃ 5일 이상","세균용 배지 30~35℃ 24시간 이상, 진균용 배지 20~25℃ 3일 이상","세균용·진균용 모두 30~35℃ 48시간 이상","세균용·진균용 모두 20~25℃ 5일 이상"],"answer":1},{"id":"bkeeb5f6ee","cat":"유통안전","type":"선다형","q":"낙하균 측정용 배지에 관한 설명으로 옳지 않은 것은?","explain":"클로람페니콜은 세균 증식을 억제하기 위해 '진균용' 배지에 넣는다(배지 100mL당 50mg). 세균용 배지에 넣는 것이 아니다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":255,"diff":3,"origin":"new","kind":"mcq","opts":["세균용은 대두카제인 소화한천배지(tryptic soy agar)를 쓴다.","진균용은 사부로포도당 한천배지 또는 포테이토덱스트로즈한천배지를 쓴다.","진균용 배지에는 배지 100mL당 클로람페니콜 50mg을 넣는다.","배양접시는 내경 9cm의 것을 사용한다.","세균용 배지에 클로람페니콜을 넣어 진균의 증식을 억제한다."],"answer":4},{"id":"bk2cf11f2c","cat":"유통안전","type":"선다형","q":"낙하균 측정 시 노출(측정) 시간에 관한 설명으로 옳은 것은?","explain":"노출 1시간 이상이면 배지 성능이 저하된다. 청정도가 높은 시설(무균실·준무균실)은 30분 이상 노출하고, 청정도가 낮고 오염도가 높은 시설(원료보관실, 복도, 포장실, 창고)은 측정 시간을 '단축'한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":255,"diff":3,"origin":"new","kind":"mcq","opts":["노출 시간이 1시간 이상이 되면 배지의 성능이 떨어지므로 예비 시험으로 적당한 노출시간을 정한다.","청정도가 높은 시설(무균실 등)은 5분 이상 노출한다.","청정도가 낮고 오염도가 높은 시설은 측정 시간을 늘린다.","노출 시간은 모든 시설에서 30분으로 동일하다.","노출 시간이 길수록 정확하므로 최대한 길게 한다."],"answer":0},{"id":"bk12d184db","cat":"유통안전","type":"선다형","q":"곤충, 해충이나 쥐를 막기 위한 방충 대책의 구체적인 예로 옳지 않은 것은?","explain":"실내압을 외부보다 '높게'(공기조화장치) 하여 외부 오염과 벌레의 유입을 막는다. 방충 원칙은 '벌레가 좋아하는 것을 제거한다, 빛이 밖으로 새어나가지 않게 한다, 조사한다(구제한다)'이다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":256,"diff":2,"origin":"new","kind":"mcq","opts":["벽, 천장, 창문, 파이프 구멍에 틈이 없도록 한다.","창문은 차광하고 야간에 빛이 밖으로 새어나가지 않게 한다.","배기구, 흡기구에 필터를 단다.","폐수구에 트랩을 단다.","실내압을 외부(실외)보다 낮게 한다."],"answer":4},{"id":"bk10cfb9c9","cat":"유통안전","type":"선다형","q":"작업소의 오염물질 및 세제 사용에 관한 설명으로 옳지 않은 것은?","explain":"연마세제는 '희석하지 않고 아주 소량의 물을 사용하여 직접 표면에 사용하며 잘 헹구어' 준다. 또한 연마 세제는 기계적으로 저항성이 있는 물질에 한정적으로 사용한다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":257,"diff":3,"origin":"new","kind":"mcq","opts":["오일, 지방, 왁스, 안료, 탄닌, 규산염, 탄산염(석회물질), 산화물(금속가루, 녹) 등 오염이 결합한다.","오염은 물리·화학적 메커니즘에 의해 제거한다.","고착되었거나 오랫동안 숙성된 오염은 연마제가 함유된 세제를 사용한다.","연마세제는 충분히 희석한 다량의 물과 함께 사용한다.","중성에서 약알칼리성 사이의 다목적 세제는 물과 상용성이 있는 모든 표면에 적용된다."],"answer":3},{"id":"bk8c88b8a8","cat":"유통안전","type":"숫자기준","q":"화학적 세척제의 유형별 pH 범위 연결이 옳지 않은 것은?","explain":"중성 세척제는 5.5~8.5다. 무기산·약산성 0.2~5.5 → 중성 5.5~8.5 → 약알칼리·알칼리 8.5~12.5 → 부식성 알칼리 12.5~14로 구간이 이어진다.","subj":"유통안전","chap":"CHAPTER 03 CGMP - 작업장 위생관리","page":258,"diff":3,"origin":"new","kind":"mcq","opts":["무기산 및 약산성
