, 직경 등을 연구하는 학문이다.","explain":"교재 서술 그대로다. 현미경으로 세부구조를 보는 모발검사법(trichoscopy)과 혼동하지 않도록 한다.","subj":"맞춤형","chap":"CHAPTER 06 피부 및 모발 상태 분석","page":354,"diff":2,"origin":"new","kind":"ox","answer_ox":"O"},{"id":"bkf9ebd085","cat":"맞춤형","type":"선다형","q":"화장품에 적합한 관능품질을 확보하기 위하여 관능평가에서 수행하는 검사로 교재가 제시하지 않은 것은?","explain":"관능평가는 외관·색상 검사, 향취 검사, 사용감 검사를 수행하는 과정이다. 미생물 한도 검사는 인간의 오감이 아니라 기기·시험법에 의한 품질관리 시험이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":355,"diff":2,"origin":"new","kind":"mcq","opts":["외관·색상 검사","향취 검사","사용감 검사","미생물 한도 검사"],"answer":3},{"id":"bk85cfd0ea","cat":"맞춤형","type":"선다형","q":"관능평가의 특징으로 옳지 않은 것은?","explain":"관능평가는 소비자가 느끼는 주관적 경험과 효과를 평가하는 과정이므로 화장품 사용자의 개인적 선호도와 피부 형태에 따라 달라질 수 있다. '항상 동일한 결과가 나온다'는 서술은 교재와 정반대다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":355,"diff":2,"origin":"new","kind":"mcq","opts":["화장품 유효성 평가방법 중의 하나이다.","통계학의 이론을 기초로 미리 충분히 계획된 조건하에서 복수의 인간이 감각을 계기로 품질을 판단한다.","이화학적 평가가 불가능한 품질의 특성에 대한 유일한 검사이다.","평가자의 개인적 선호도나 피부 형태와 무관하게 항상 동일한 결과가 나온다.","다양한 사용자 피드백을 수집하여 제품의 개선과 개발에 활용된다."],"answer":3},{"id":"bke6b7d027","cat":"맞춤형","type":"선다형","q":"화장품 관능평가의 필요성과 관련하여, 일본의 여성 전문지 i-VoCE가 화장품의 전문적인 관능평가와 함께 객관적인 데이터를 제공하기 시작한 연도는?","explain":"교재는 일본이 여성 전문지(i-VoCE)에서 1999년부터 전문적인 관능평가와 함께 객관적인 데이터를 제공하고 있다고 서술한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":355,"diff":3,"origin":"new","kind":"mcq","opts":["1989년","1995년","1999년","2005년","2011년"],"answer":2},{"id":"bk9076de7b","cat":"맞춤형","type":"선다형","q":"화장품 관능검사의 특성에 대한 설명으로 옳은 것은?","explain":"관능검사는 기기측정검사와 달리 인체의 감각기관을 이용하므로 검사 편의성은 높지만 반복 및 정확성 결여가 나타난다. 그래서 전문 인력 양성과 객관적 평가체계가 중요해진다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":355,"diff":2,"origin":"new","kind":"mcq","opts":["인체의 감각기관을 이용하므로 검사 편의성은 높지만 반복 및 정확성 결여가 나타난다.","기기측정검사보다 반복성과 정확성이 모두 우수하다.","검사 편의성이 낮아 개발·생산·품질관리에는 사용되지 않는다.","이화학적 평가로 완전히 대체할 수 있다.","단일 평가자의 판단만으로 보편타당한 결론을 얻을 수 있다."],"answer":0},{"id":"bkc4327c64","cat":"맞춤형","type":"선다형","q":"표준품 중 '외관, 성상, 냄새, 사용감에 관한 표준'으로 사용되는 것은?","explain":"제품내용물 표준견본이다. 제품 표준견본은 완성제품의 개별포장에 관한 표준, 제품색조 표준견본은 제품내용물 색조에 관한 표준, 원료 표준견본은 원료의 외관·색·성상·냄새에 관한 표준이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"mcq","opts":["제품 표준견본","제품색조 표준견본","제품내용물 표준견본","원료 표준견본","향료 표준견본"],"answer":2},{"id":"bke5245db0","cat":"맞춤형","type":"선다형","q":"내용물을 제품용기에 충전할 때의 액면위치에 관한 표준으로 사용되는 견본은?","explain":"충전 위치견본이다. 레벨 부착 위치견본은 완성제품의 레벨(라벨) 부착위치에 관한 표준으로, 이름이 비슷해 혼동하기 쉽다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"mcq","opts":["레벨 부착 위치견본","충전 위치견본","제품 표준견본","용기·포장재 한도견본","설계용"],"answer":1},{"id":"bkfdc3ea6c","cat":"맞춤형","type":"선다형","q":"표준품의 종류와 그 설명이 옳지 않게 짝지어진 것은?","explain":"설계용은 용기·패키지 등의 디자인 및 재질, 내용물 특성 등을 분석 또는 기호성 참고 조사하는 표준품이다. '착색제의 색조에 관한 표준'은 원료색조 표준견본이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"mcq","opts":["제품 표준견본 — 완성제품의 개별포장에 관한 표준","원료 표준견본 — 외관, 색, 성상, 냄새 등에 관한 표준","향료 표준견본 — 향, 색조, 외관 등에 관한 표준","설계용 — 착색제의 색조에 관한 표준","용기·포장재 표준견본 — 용기·포장재의 검사에 관한 표준"],"answer":3},{"id":"bke8cf1f41","cat":"맞춤형","type":"선다형","q":"용기·포장재 표준견본과 용기·포장재 한도견본을 옳게 설명한 것은?","explain":"표준견본은 용기·포장재의 '검사'에 관한 표준이고, 한도견본은 용기·포장재 '외관검사에 사용하는 합격품 한도'를 나타내는 표준이다. 한도견본은 '어디까지가 합격인지'를 보여주는 기준이라고 이해하면 된다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"mcq","opts":["표준견본은 용기·포장재의 검사에 관한 표준이고, 한도견본은 외관검사에 사용하는 합격품 한도를 나타내는 표준이다.","표준견본은 외관검사의 합격품 한도를 나타내고, 한도견본은 용기·포장재의 검사에 관한 표준이다.","표준견본은 착색제의 색조에 관한 표준이다.","한도견본은 완성제품의 개별포장에 관한 표준이다.","두 견본 모두 제품내용물의 색조에 관한 표준이다."],"answer":0},{"id":"bkae9e0d8f","cat":"맞춤형","type":"선다형","q":"제품색조 표준견본과 원료색조 표준견본을 옳게 구분한 것은?","explain":"제품색조 표준견본은 제품내용물 색조에 관한 표준이고, 원료색조 표준견본은 착색제의 색조에 관한 표준이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"mcq","opts":["제품색조 표준견본은 제품내용물의 색조에 관한 표준, 원료색조 표준견본은 착색제의 색조에 관한 표준이다.","제품색조 표준견본은 착색제의 색조에 관한 표준, 원료색조 표준견본은 제품내용물의 색조에 관한 표준이다.","제품색조 표준견본은 향, 색조, 외관 등에 관한 표준이다.","원료색조 표준견본은 완성제품의 개별포장에 관한 표준이다.","두 견본 모두 용기·포장재 검사에 사용된다."],"answer":0},{"id":"bk06155824","cat":"맞춤형","type":"선다형","q":"훈련된 전문가 패널에 의한 평가에서 관능시험 평가의 결과보고 양식의 예로 교재가 제시한 것은?","explain":"스파이더 프로파일(spider profile)과 주요인 분석(PCA, Principal Component Analysis)이다. 이는 비맹검 사용시험 항목 안에 서술되어 있다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":3,"origin":"new","kind":"mcq","opts":["스파이더 프로파일(spider profile), 주요인 분석(PCA)","히스토그램, 회귀분석","산점도, 분산분석(ANOVA)","레플리카 분석, 3차원 형태 측정","라만분광광도계, 핵자기공명"],"answer":0},{"id":"bkdb049998","cat":"맞춤형","type":"선다형","q":"'전문가에 의한 평가'의 관능시험방법으로 교재가 제시한 것이 아닌 것은?","explain":"맹검 사용시험(blind use test)은 '자가 평가(소비자에 의한 평가)'에 속한다. 전문가에 의한 관능시험방법은 차별성구별시험(discriminative) 또는 파일링시험(filing), 순위설정시험(ranking), 모나드시험(monadic) 또는 비교시험(comparative test)이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":3,"origin":"new","kind":"mcq","opts":["차별성구별시험(discriminative)","파일링시험(filing)","순위설정시험(ranking)","모나드시험(monadic)","맹검 사용시험(blind use test)"],"answer":4},{"id":"bk87904262","cat":"맞춤형","type":"선다형","q":"의사 감독하에서 실시하는 시험과 그 외 전문가 관리하에 실시하는 평가를 옳게 구분한 것은?","explain":"의사 감독하 시험은 변수들이 임상 관찰 결과 또는 평점에 의해 평가되며 초깃값·미처리 대조군·위약·표준품과 비교하여 정량화될 수 있다. 그 외 전문가 관리하 평가는 준의료진, 미용사 또는 기타 직업적 전문가가 이미 확립된 기준과 비교하여 촉각·시각 등 감각으로 효능을 평가한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":3,"origin":"new","kind":"mcq","opts":["의사 감독하 시험은 임상 관찰 결과나 평점으로 평가되고, 그 외 전문가 관리하 평가는 준의료진·미용사 등이 확립된 기준과 비교하여 촉각·시각 등 감각으로 효능을 평가한다.","의사 감독하 시험은 준의료진·미용사가 감각으로 평가하고, 그 외 전문가 관리하 평가는 임상 관찰 결과로 평가된다.","의사 감독하 시험은 소비자가 직접 수행하는 자가 평가에 해당한다.","그 외 전문가 관리하에 실시하는 평가는 반드시 위약과 비교하여 정량화되어야 한다.","두 평가 모두 소비자에 의한 자가 평가에 해당한다."],"answer":0},{"id":"bk6117af37","cat":"맞춤형","type":"선다형","q":"교재가 제시한 관능평가 대상에 해당하지 않는 것은?","explain":"관능평가 대상은 향취, 색상, 광택, 젤라틴성, 매끈함, 두꺼운 정도, 청량감, 미끄러짐, 수분감, 끈적임, 유연감, 피막형성, 펴짐, 유동성이다. 산도(pH)는 오감으로 판단하는 항목이 아니라 이화학적 시험 항목이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":2,"origin":"new","kind":"mcq","opts":["향취(odor)","광택(gloss level)","젤라틴성(gelatinous)","끈적임(stickiness)","산도(pH)"],"answer":4},{"id":"bk6e2013d7","cat":"맞춤형","type":"선다형","q":"관능평가 대상 중 'film-forming'에 해당하는 우리말 항목은?","explain":"film-forming은 피막형성이다. 유연감은 softness, 유동성은 fluidity, 미끄러짐은 gliding or slippery다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":358,"diff":2,"origin":"new","kind":"mcq","opts":["피막형성","유연감","유동성","미끄러짐","청량감"],"answer":0},{"id":"bk8c2607eb","cat":"맞춤형","type":"선다형","q":"관능평가 절차 중 유화제품(크림, 유액 등)의 평가 방법으로 옳은 것은?","explain":"유화제품은 표준견본과 대조하여 내용물 표면의 매끄러움과 내용물의 점성, 내용물의 색이 유백색인지를 육안으로 확인한다. 슬라이드 글라스를 쓰는 것은 색조제품이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":358,"diff":2,"origin":"new","kind":"mcq","opts":["표준견본과 대조하여 내용물 표면의 매끄러움과 점성, 색이 유백색인지 육안으로 확인한다.","슬라이드 글라스에 소량씩 묻힌 후 눌러서 대조되는 색상을 육안으로 확인한다.","비커에 내용물을 담고 코를 대고 향취를 맡는다.","손등에 문질러서 느껴지는 사용감을 확인한다.","sebumeter로 30초간 압력을 가해 측정한다."],"answer":0},{"id":"bka27ff0b0","cat":"맞춤형","type":"선다형","q":"관능평가 절차 중 색조제품(파운데이션, 아이섀도, 립스틱 등)의 평가 방법으로 옳은 것은?","explain":"색조제품은 표준견본과 내용물을 슬라이드 글라스에 각각 소량씩 묻힌 후 슬라이드 글라스로 눌러서 대조되는 색상을 육안으로 확인하거나, 손등 혹은 실제 사용 부위(얼굴, 입술)에 발라서 색상을 확인한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":358,"diff":2,"origin":"new","kind":"mcq","opts":["비커에 일정량을 담고 코를 대어 향취를 맡는다.","표준견본과 내용물을 슬라이드 글라스에 각각 소량씩 묻힌 후 눌러서 대조되는 색상을 육안으로 확인한다.","표면의 매끄러움과 점성, 유백색 여부를 육안으로 확인한다.","손등에 문질러 느껴지는 사용감을 확인한다.","레플리카를 떠서 3차원 형태를 측정한다."],"answer":1},{"id":"bkef9fdb45","cat":"맞춤형","type":"선다형","q":"비커에 내용물을 일정량 담고 코를 비커에 대거나, 손등에 내용물을 바르고 확인하는 관능평가 절차는?","explain":"향취 평가의 방법이다. 사용감 평가는 내용물을 손등에 '문질러서' 느껴지는 사용감을 확인하는 것으로, 손등을 쓴다는 점은 같지만 목적과 동작이 다르다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":358,"diff":2,"origin":"new","kind":"mcq","opts":["유화제품 평가","색조제품 평가","향취 평가","사용감 평가"],"answer":2},{"id":"bke9e956ad","cat":"맞춤형","type":"선다형","q":"교재에 제시된 관능평가 절차의 순서로 옳은 것은?","explain":"교재의 관능평가 절차는 1. 유화제품(크림·유액) → 2. 색조제품(파운데이션·아이섀도·립스틱) → 3. 향취 평가 → 4. 사용감 평가 순으로 제시된다. '눈으로 보는 것(유화·색조) → 코 → 손'의 흐름으로 기억한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":358,"diff":2,"origin":"new","kind":"mcq","opts":["유화제품 → 색조제품 → 향취 평가 → 사용감 평가","색조제품 → 유화제품 → 사용감 평가 → 향취 평가","향취 평가 → 사용감 평가 → 유화제품 → 색조제품","사용감 평가 → 향취 평가 → 색조제품 → 유화제품","유화제품 → 향취 평가 → 색조제품 → 사용감 평가"],"answer":0},{"id":"bk551a2865","cat":"맞춤형","type":"혼동쌍구분","q":"관능평가의 종류인 기호형 평가와 분석형 평가를 옳게 비교한 것은?","explain":"기호형 평가는 좋고 싫음을 '주관적'으로 판단하는 평가이고, 분석형 평가는 표준품 및 한도품 등 기준과 비교하여 합격품·불량품을 '객관적'으로 평가하고 선별하거나 사람의 식별력 등을 조사하는 평가다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":2,"origin":"new","kind":"mcq","opts":["기호형 평가는 좋고 싫음을 주관적으로 판단하고, 분석형 평가는 표준품·한도품 등 기준과 비교하여 합격품·불량품을 객관적으로 평가한다.","기호형 평가는 표준품과 비교하여 객관적으로 평가하고, 분석형 평가는 좋고 싫음을 주관적으로 판단한다.","기호형 평가는 사람의 식별력을 조사하는 평가이고, 분석형 평가는 소비자 선호도 조사이다.","두 평가 모두 표준품 및 한도품과 비교하는 객관적 평가이다.","기호형 평가는 전문가만, 분석형 평가는 소비자만 수행할 수 있다."],"answer":0},{"id":"bk6f921753","cat":"맞춤형","type":"혼동쌍구분","q":"자가 평가의 맹검 사용시험(blind use test)과 비맹검 사용시험(concept use test)을 옳게 비교한 것은?","explain":"맹검 사용시험은 소비자의 판단에 영향을 미칠 수 있는 상품평·디자인·표시사항 등의 정보를 제공하지 '않는' 시험이고, 비맹검 사용시험은 제품의 상품명·표시사항 등을 '알려주고' 제품에 대한 인식 및 효능이 일치하는지를 조사하는 시험이다. 둘 다 자가 평가(소비자에 의한 평가)에 속한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":2,"origin":"new","kind":"mcq","opts":["맹검 사용시험은 상품평·디자인·표시사항 등의 정보를 제공하지 않는 시험이고, 비맹검 사용시험은 상품명·표시사항 등을 알려주고 인식과 효능이 일치하는지 조사하는 시험이다.","맹검 사용시험은 상품명·표시사항을 알려주고 실시하고, 비맹검 사용시험은 아무 정보도 주지 않는다.","맹검 사용시험은 전문가에 의한 평가에 속하고, 비맹검 사용시험은 자가 평가에 속한다.","두 시험 모두 의사 감독하에 실시해야 한다.","맹검 사용시험은 훈련된 전문가 패널에 의한 평가만을 의미한다."],"answer":0},{"id":"bkfe2cacb8","cat":"맞춤형","type":"빈칸채우기","q":"관능평가란 여러 가지 품질을 인간의 (        )에 의하여 평가하는 제품검사이다.","explain":"인간의 '오감'이다. 이 정의는 교재 연습문제 정답으로도 그대로 출제된다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":355,"diff":1,"origin":"new","kind":"short","ans":["오감","오감(五感)","다섯 가지 감각","5감"]},{"id":"bkeaee9b19","cat":"맞춤형","type":"단답형","q":"관능평가의 종류 중 좋고 싫음을 주관적으로 판단하는 평가를 무엇이라 하는가?","explain":"기호형 평가다. 표준품·한도품과 비교하는 객관적 평가인 분석형 평가와 대비된다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":1,"origin":"new","kind":"short","ans":["기호형 평가","기호형","기호형평가"]},{"id":"bka3c6f50f","cat":"맞춤형","type":"단답형","q":"표준품 및 한도품 등 기준과 비교하여 합격품, 불량품을 객관적으로 평가하고 선별하거나 사람의 식별력 등을 조사하는 관능평가의 종류는?","explain":"분석형 평가다. 교재 연습문제에서도 '표준품 및 한도품 등의 기준과 비교하여 합격품과 불합격품을 객관적으로 식별하는 평가방법'의 정답으로 제시된다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":2,"origin":"new","kind":"short","ans":["분석형 평가","분석형","분석형평가"]},{"id":"bkeb68594b","cat":"맞춤형","type":"빈칸채우기","q":"(        )은(는) 완성제품의 레벨 부착위치에 관한 표준을 나타내는 표준품이다.","explain":"레벨 부착 위치견본이다. 액면 위치에 관한 표준인 '충전 위치견본'과 헷갈리지 않도록 한다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":356,"diff":3,"origin":"new","kind":"short","ans":["레벨 부착 위치견본","레벨부착 위치견본","라벨 부착 위치견본","레벨 부착위치견본"]},{"id":"bk357f3c8c","cat":"맞춤형","type":"단답형","q":"소비자의 판단에 영향을 미칠 수 있고 제품의 효능에 대한 인식을 바꿀 수 있는 상품평, 디자인, 표시사항 등의 정보를 제공하지 않는 제품사용시험을 무엇이라 하는가?","explain":"맹검 사용시험(blind use test)이다. 자가 평가의 한 방법이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":2,"origin":"new","kind":"short","ans":["맹검 사용시험","맹검사용시험","blind use test","맹검시험","맹검 사용시험(blind use test)"]},{"id":"bk44882a46","cat":"맞춤형","type":"단답형","q":"제품의 상품명, 표시사항 등을 알려주고 제품에 대한 인식 및 효능 등이 일치하는지를 조사하는 시험의 영문 명칭은?","explain":"비맹검 사용시험은 영문으로 concept use test다. 정보를 '주고' 개념(concept)과 실제 효능이 일치하는지 본다는 뜻으로 이해하면 외우기 쉽다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":3,"origin":"new","kind":"short","ans":["concept use test","컨셉 사용시험","concept use test(비맹검 사용시험)","콘셉트 유즈 테스트"]},{"id":"bk85eb4d1d","cat":"맞춤형","type":"단답형","q":"관능시험 평가의 결과보고 양식의 예로 제시되는 'PCA(Principal Component Analysis)'를 교재는 우리말로 무엇이라 표기하는가?","explain":"교재는 '주요인 분석(PCA, Principal Component Analysis)'으로 표기한다. 함께 제시되는 양식이 스파이더 프로파일(spider profile)이다.","subj":"맞춤형","chap":"CHAPTER 07 관능평가 방법과 절차","page":357,"diff":3,"origin":"new","kind":"short","ans":["주요인 분석","주요인분석","주성분 분석","주성분분석"]},{"id":"bke349dad5","cat":"맞춤형","type":"단답형","q":"관능평가 대상 중 'spreading'에 해당하는 우리말 항목을 쓰시오.","expl const ING_ORDER = ["원료 분류·특성","색소","사용할 수 없는 원료","사용제한 원료 한도",

function modeCategories(){
  const bank = currentBank();
  if(quizMode === "ing"){
    return ["전체", ...ING_ORDER.filter(g => bank.some(q => q.ing === g))];
  }
  if(quizMode === "book"){
    return ["전체", ...SUBJ_ORDER.filter(c => bank.some(q => q.cat === c)), "교재 원문제"];
  }
  return ["전체", ...Array.from(new Set(bank.map(q => q.cat)))];
}

/* 1단 필터를 적용한 목록 */
function filterLevel1(bank){
  if(currentFilter === "전체") return bank;
  if(quizMode === "ing")  return bank.filter(q => q.ing === currentFilter);
  if(quizMode === "book"){
    if(currentFilter === "교재 원문제") return bank.filter(q => q.origin !== "new");
    return bank.filter(q => q.cat === currentFilter);
  }
  return bank.filter(q => q.cat === currentFilter);
}

/* 2단 필터 후보 — 교재 모드에서 과목을 고르면 그 과목의 챕터 */
function subCategories(){
  if(!isBookMode()) return null;
  const l1 = filterLevel1(currentBank());
  if(quizMode === "book" && currentFilter === "전체") return null;
  const chaps = Array.from(new Set(l1.map(q => q.chap))).sort((a, b) => a.localeCompare(b, "ko"));
  return chaps.length > 1 ? ["전체", ...chaps] : null;
}

function filteredPool(){

  const subs = subCategories();
  if(subs && currentSub !== "전체" && subs.includes(currentSub)){
    list = list.filter(q => q.chap === currentSub);
  }
  return list;
}

/* ── 저장소 ──────────────────────────────
   store = {
     stats: { [cat]: {seen, correct} },   // 누적 통계
     wrong: { [qid]: {wrong, total} }     // 누적 오답 은행 (맞히면 wrong 감소)
   }
*/
function loadStore(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return { stats: {}, wrong: {} };
}
function saveStore(s){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
}
let STORE = loadStore();

/* 한 문제 채점 결과를 누적 반영 */
function recordAnswer(q, isRight){
  if(!STORE.stats[q.cat]) STORE.stats[q.cat] = { seen: 0, correct: 0 };
  STORE.stats[q.cat].seen++;
  if(isRight) STORE.stats[q.cat].correct++;

  const w = STORE.wrong[q.id] || { wrong: 0, total: 0 };
  w.total++;
  if(isRight){
    if(w.wrong > 0) w.wrong--;      // 맞히면 오답은행에서 서서히 빠짐
  } else {
    w.wrong++;
  }
  if(w.wrong <= 0 && isRight) delete STORE.wrong[q.id];
  else STORE.wrong[q.id] = w;

  saveStore(STORE);
}

function wrongBankIds(){
  return Object.keys(STORE.wrong).filter(id => (STORE.wrong[id].wrong > 0) && QMAP[id]);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleOptions(q){
  // 보기가 없는 유형(OX·단답)은 그대로 통과
  if(!q.opts || !q.opts.length) return q;
  const correctText = q.opts[q.answer];
  const shuffled = shuffle(q.opts);
  return { ...q, opts: shuffled, answer: shuffled.indexOf(correctText) };
}

      b.innerHTML = label + ' <span class="n">' + n + '</span>';
      b.onclick = () => { currentSub = sc; startQuiz(); };
      subEl.appendChild(b);
    });
    subEl.style.display = ""; subLb.style.display = "";
  } else {
    currentSub = "전체";
    subEl.style.display = "none"; subLb.style.display = "none";
  }

  const lenEl = document.getElementById('lenChips');
  lenEl.innerHTML = "";
  LENGTHS.forEach(len => {
    const b = document.createElement('button');
    b.className = 'chip small' + (len === currentLen ? ' active' : '');
    b.textContent = len === "전체" ? "전체" : len + "문항";
    b.onclick = () => { currentLen = len; startQuiz(); };
    lenEl.appendChild(b);
  });

  buildQuickRow();
}

function buildQuickRow(){
  const row = document.getElementById('quickRow');
  // OX 모드는 기록 없이 가볍게 → 누적오답/약점분석 숨김
  if(quizMode === "ox"){
    row.style.display = "none";
    document.getElementById('statsPanel').classList.remove('show');
    statsOpen = false;
    return;
  }
  row.style.display = "flex";
  const wb = wrongBankIds();
  const totalSeen = catList.reduce((s,c)=> s + (STORE.stats[c]?.seen || 0), 0);
  row.innerHTML = `
    <button class="quick-btn" id="wrongBankBtn" ${wb.length ? "" : "disabled"}>
      <span class="ic">🗂️</span>
      <span>
        <div class="qt">누적 오답 복습</div>
        <div class="qs">${wb.length ? wb.length + "문제 모아보기" : "아직 없어요"}</div>
      </span>
    </button>
    <button class="quick-btn" id="statsBtn">
      <span class="ic">📊</span>
      <span>
        <div class="qt">약점 분석</div>
        <div class="qs">${totalSeen ? "누적 " + totalSeen + "문제" : "데이터 없음"}</div>
      </span>
    </button>`;

  const wbBtn = document.getElementById('wrongBankBtn');
  if(wb.length) wbBtn.onclick = () => startWrongBank();
  document.getElementById('statsBtn').onclick = () => toggleStats();
}

function startWrongBank(){
  const ids = shuffle(wrongBankIds());
  const pool = ids.map(id => QMAP[id]).filter(Boolean);
  if(!pool.length) return;
  startQuiz(pool, "wrongbank");
}

function toggleStats(){
  statsOpen = !statsOpen;
  const panel = document.getElementById('statsPanel');
  if(!statsOpen){ panel.classList.remove('show'); return; }
  renderStats();
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderStats(){
  const panel = document.getElementById('statsPanel');
  const rows = catList.map(cat => {
    const s = STORE.stats[cat] || { seen: 0, correct: 0 };
    const seen = s.seen, correct = s.correct;
    const rate = seen ? Math.round(correct / seen * 100) : 0;
    const thin = seen < MIN_SAMPLE;                 // 표본 부족
    let cls = "none", numCls = "";
    if(seen === 0){ cls = "none"; }
    else if(thin){ cls = "mid"; numCls = "thin"; }
    else if(rate >= 80){ cls = "hi"; }
    else if(rate >= 60){ cls = "mid"; }
    else { cls = "lo"; numCls = "weak"; }
    const w = seen ? Math.max(rate, 4) : 0;
    const numText = seen
      ? `${rate}% (${correct}/${seen})`
      : "미응시";
    return `<div class="stat-row">
      <div class="stat-name">${cat}</div>
      <div class="stat-bar"><div class="stat-fill ${cls}" style="width:${w}%"></div></div>
      <div class="stat-num ${numCls}">${numText}${thin && seen ? " ·표본↓" : ""}</div>
    </div>`;
  }).join("");

  const anyThin = catList.some(c => { const s = STORE.stats[c]; return s && s.seen > 0 && s.seen < MIN_SAMPLE; });
  panel.innerHTML = `
    <div class="ctl-label">약점 분석 · 누적 정답률</div>
    ${rows}
    <div class="stats-note">
      · 여러 판에 걸쳐 누적된 기록이라 한 판보다 신뢰도가 높아요.<br>
      · 분모(응시 수)가 작으면 <b>·표본↓</b>로 표시돼요 — ${MIN_SAMPLE}문제 미만은 아직 참고용이에요.
      ${anyThin ? "<br>· 표본이 적은 분류는 좀 더 풀어보면 정확해져요." : ""}
    </div>
    <button class="stats-reset" id="statsReset">기록 초기화</button>`;

  document.getElementById('statsReset').onclick = () => {
    if(confirm("누적 통계와 오답 기록을 모두 지울까요? 되돌릴 수 없어요.")){
      STORE = { stats: {}, wrong: {} };
      saveStore(STORE);
      renderStats();
      buildQuickRow();
    }
  };
}

function startQuiz(customPool, mode){
  lastMode = mode || (customPool ? "retry" : "normal");
  statsOpen = false;
  document.getElementById('statsPanel').classList.remove('show');

  const bank = currentBank();
  // 현재 필터가 이 모드에 없으면 전체로 (OX엔 소독제·법령 없음)
  if(!customPool && !modeCategories().includes(currentFilter)) currentFilter = "전체";
  const base = customPool ? customPool : filteredPool();

  let picked = shuffle(base);
  if(!customPool && currentLen !== "전체"){
    picked = picked.slice(0, Math.min(currentLen, picked.length));
  }
  // OX는 보기가 없으니 셔플 대상 아님
  order = quizMode === "ox" ? picked.slice() : picked.map(shuffleOptions);
  // 교재 뱅크는 유형이 섞여 있어 shuffleOptions가 알아서 통과시킨다

  idx = 0; score = 0; missed = []; streak = 0; bestStreak = 0;
  document.getElementById('progressFill').style.width = "0%";
  buildChips();
  renderQuestion();
}

/* 교재 문항의 태그 줄: 과목 · 유형 · 출처 배지 · 성분 갈래 · 교재 쪽수 */
function tagRow(q){
  const modeTag = lastMode === "wrongbank" ? '<span class="type-tag neg">누적오답</span>'
                : lastMode === "retry" ? '<span class="type-tag neg">오답복습</span>' : "";
  let extra = "";
  if(q.origin === "book")    extra += '<span class="book-tag bk">교재 원문제</span>';
  if(q.origin === "variant") extra += '<span class="book-tag vr">교재 변형</span>';
  if(q.flag === "law")       extra += '<span class="book-tag law">⚠ 법령 기준</span>';
  if(q.flag === "bookfix")   extra += '<span class="book-tag fix">교재 오기 정정</span>';
  if(q.ing && quizMode !== "ing") extra += '<span class="book-tag ing">🧪 ' + q.ing + '</span>';
  const page = q.page ? '<span class="page-tag">교재 ' + q.page + '쪽</span>' : "";
  const neg = NEGATIVE_TYPES.includes(q.type) ? " neg" : "";
  return '<div class="tag-row"><span class="cat-tag">' + q.cat + '</span>'
       + '<span class="type-tag' + neg + '">' + q.type + '</span>'
       + modeTag + extra + page + '</div>';
}

/* 단답형 정답 판정 — 표기 변형·부분일치 허용 */
function normAns(s){
  return String(s).replace(/[\s·,\.\-_()~%'"]/g, "").toLowerCase();
}
function matchShort(input, list){
  const u = normAns(input);
  if(!u) return false;
  return list.some(a => {
    const t = normAns(a);
    return t === u || (t.length >= 3 && (t.includes(u) || u.includes(t)));
  });
}

function renderQuestion(){
  answered = false;
  const card = document.getElementById('quizCard');
  if(idx >= order.length){ renderResult(); return; }
  const q = order[idx];

  document.getElementById('progressFill').style.width = (idx / order.length * 100) + "%";
  document.getElementById('progressLabel').textContent = (idx + 1) + " / " + order.length;
  document.getElementById('streak').textContent = streak >= 3 ? "🔥 " + streak + " 연속" : "";

  const kind = q.kind || (quizMode === "ox" ? "ox" : "mcq");

  // ── 단답형 ──
  if(kind === "short"){
    card.innerHTML = `
      ${tagRow(q)}
      <p class="q-text"><span class="num">Q${idx + 1}.</span> ${q.q}</p>
      <div class="sa-wrap">
        <input class="sa-input" id="saInput" placeholder="정답을 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="sa-btn" id="saGo">확인</button>
        <button class="sa-btn ghost" id="saSkip">모르겠어요</button>
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="next-btn" id="nextBtn">${idx + 1 === order.length ? "결과 보기 →" : "다음 문제 →"}</button>
    `;
    const inp = document.getElementById('saInput');
    const go  = () => selectShort(inp.value, q);
    document.getElementById('saGo').addEventListener('click', go);
    document.getElementById('saSkip').addEventListener('click', () => selectShort("", q));
    inp.addEventListener('keydown', e => { if(e.key === "Enter") go(); });
    document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
    inp.focus({ preventScroll: true });
    return;
  }

  // ── OX ──
  if(kind === "ox"){
    card.innerHTML = `
      ${tagRow(q)}
      <p class="q-text"><span class="num">Q${idx + 1}.</span> ${q.q}</p>
      <div class="ox-options">
        <button class="ox-btn o" data-ox="O"><span class="ox-mark">O</span><span class="ox-label">맞다</span></button>
        <button class="ox-btn x" data-ox="X"><span class="ox-mark">✕</span><span class="ox-label">아니다</span></button>
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="next-btn" id="nextBtn">${idx + 1 === order.length ? "결과 보기 →" : "다음 문제 →"}</button>
    `;
    card.querySelectorAll('.ox-btn').forEach(btn => btn.addEventListener('click', () => selectOX(btn, q)));
    document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
    return;
  }

  const L = ["A", "B", "C", "D", "E"];
  card.innerHTML = `
    ${tagRow(q)}
    <p class="q-text"><span class="num">Q${idx + 1}.</span> ${q.q}</p>
    <div class="options">
      ${q.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="letter">${L[i]}</span><span class="txt">${o}</span></button>`).join("")}
    </div>
    <div class="explain" id="explainBox"></div>
    <button class="next-btn" id="nextBtn">${idx + 1 === order.length ? "결과 보기 →" : "다음 문제 →"}</button>
  `;
  card.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => selectOption(btn, q)));
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}

function selectOption(btn, q){
  if(answered) return;
  answered = true;
  const chosen = parseInt(btn.dataset.i);
  const isRight = chosen === q.answer;

  recordAnswer(q, isRight);   // ← 누적 저장

  if(isRight){
    score++; streak++; if(streak > bestStreak) bestStreak = streak;
  } else {
    streak = 0;
    missed.push({ ...q, chosenText: q.opts[chosen] });
  }
  document.getElementById('streak').textContent = streak >= 3 ? "🔥 " + streak + " 연속" : "";

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked');
    const i = parseInt(o.dataset.i);
    if(i === q.answer) o.classList.add('correct');
    else if(i === chosen) o.classList.add('wrong');
    else o.classList.add('dim');
  });

  let compareHtml = "";
  if(q.compare && q.compare.length){
    compareHtml = `<div class="compare">
      <div class="compare-title">함께 외우기 · 헷갈리는 수치</div>
      <table>${q.compare.map(([l, v]) => `<tr><td class="label">${l}</td><td class="val">${v}</td></tr>`).join("")}</table>
    </div>`;
  }
  const box = document.getElementById('explainBox');
  box.innerHTML = `
    <div class="stamp-row"><span class="stamp ${isRight ? 'ok' : 'no'}">${isRight ? '맞았어요!' : '아쉬워요'}</span></div>
    <div>${q.explain}</div>${compareHtml}`;
  box.classList.add('show');
  const nb = document.getElementById('nextBtn');
  nb.classList.add('show');
  nb.focus({ preventScroll: true });
}

function selectShort(value, q){
  if(answered) return;
  answered = true;
  const isRight = matchShort(value, q.ans || []);

  recordAnswer(q, isRight);

  if(isRight){
    score++; streak++; if(streak > bestStreak) bestStreak = streak;
  } else {
    streak = 0;
    missed.push({ ...q, chosenText: value ? value : "(비워둠)" });
  }
  document.getElementById('streak').textContent = streak >= 3 ? "🔥 " + streak + " 연속" : "";

  const inp = document.getElementById('saInput');
  inp.value = value;
  inp.disabled = true;
  inp.classList.add(isRight ? 'ok' : 'no');
  document.getElementById('saGo').disabled = true;
  document.getElementById('saSkip').disabled = true;

  const alts = (q.ans || []);
  const box = document.getElementById('explainBox');
  box.innerHTML = `
    <div class="stamp-row"><span class="stamp ${isRight ? 'ok' : 'no'}">${isRight ? '맞았어요!' : '아쉬워요'}</span></div>
    <div class="sa-ans">정답 · ${alts[0] || ""}
      ${alts.length > 1 ? '<small>이렇게 써도 정답 — ' + alts.slice(1).join(" / ") + '</small>' : ""}</div>
    <div style="margin-top:10px">${q.explain}</div>`;
  box.classList.add('show');
  const nb = document.getElementById('nextBtn');
  nb.classList.add('show');
  nb.focus({ preventScroll: true });
}

function selectOX(btn, q){
  if(answered) return;
  answered = true;
  const chosen = btn.dataset.ox;           // "O" | "X"
  const isRight = chosen === q.answer_ox;

  // 기존 OX 뱅크는 기록 없이 가볍게. 교재 뱅크 OX는 누적에 반영.
  if(q.kind) recordAnswer(q, isRight);
  if(isRight){
    score++; streak++; if(streak > bestStreak) bestStreak = streak;
  } else {
    streak = 0;
    missed.push({ ...q, chosenText: chosen });
  }
  document.getElementById('streak').textContent = streak >= 3 ? "🔥 " + streak + " 연속" : "";

  document.querySelectorAll('.ox-btn').forEach(o => {
    o.classList.add('locked');
    const val = o.dataset.ox;
    if(val === chosen){
      o.classList.add(isRight ? 'picked-correct' : 'picked-wrong');
    } else if(val === q.answer_ox){
      o.classList.add('reveal', 'picked-correct'); // 정답 위치 표시
    } else {
      o.classList.add('dim');
    }
  });

  const box = document.getElementById('explainBox');
  box.innerHTML = `
    <div class="stamp-row"><span class="stamp ${isRight ? 'ok' : 'no'}">${isRight ? '맞았어요!' : '아쉬워요'}</span></div>
    <div>${q.explain}</div>`;
  box.classList.add('show');
  const nb = document.getElementById('nextBtn');
  nb.classList.add('show');
  nb.focus({ preventScroll: true });
}

function renderResult(){
  document.getElementById('progressFill').style.width = "100%";
  document.getElementById('progressLabel').textContent = order.length + " / " + order.length;
  document.getElementById('streak').textContent = bestStreak >= 3 ? "🔥 최고 " + bestStreak : "";
  buildQuickRow();  // 누적오답 개수 갱신

  const pct = Math.round(score / order.length * 100);
  let emoji = "🌱", comment = "천천히 가도 괜찮아요. 비교표 위주로 다시 보면 숫자가 정리돼요.";
  if(pct >= 90){ emoji = "🏆"; comment = "거의 완벽해요! 이 감각 유지하면서 오답만 관리하면 돼요."; }
  else if(pct >= 75){ emoji = "🌸"; comment = "합격권이에요. 아래 오답노트만 한 번 더 짚고 가요."; }
  else if(pct >= 55){ emoji = "🍀"; comment = "절반 이상 잡았어요! 유사 성분 짝(자일렌/케톤 등)을 세트로 외워봐요."; }

  const isRetryRound0 = (lastMode === "retry" || lastMode === "wrongbank");
  // 재풀이 라운드에서 이번 판 오답이 0이면 = 틀렸던 걸 다 맞힌 것 → 완료 문구
  if(isRetryRound0 && missed.length === 0){
    emoji = "🎯";
    comment = "틀렸던 문제를 모두 맞혔어요. 완벽하게 잡았어요!";
  }

  // 재풀이 관련 라벨/버튼 구성
  const isRetryRound = (lastMode === "retry" || lastMode === "wrongbank");
  const retryLabel = isRetryRound
    ? `틀린 ${missed.length}문제 계속 풀기`
    : `틀린 ${missed.length}문제만 다시`;

  // 누적 오답(이번 판 제외)이 따로 있는지 — 사지선다 모드에서만
  const bankWrong = (quizMode === "ox") ? [] : wrongBankIds().filter(id => {
    const bank = currentBank();
    return bank.some(x => x.id === id);
  });
  const missedIds = new Set(missed.map(m => m.id));
  const extraWrong = bankWrong.filter(id => !missedIds.has(id));
  const showCombo = missed.length && extraWrong.length > 0;

  const missedHtml = missed.length ? `
    <div class="missed-list">
      <div class="missed-head">📝 이번 판 오답 · ${missed.length}문제</div>
      ${missed.map(m => {
        const k = m.kind || (quizMode === "ox" ? "ox" : "mcq");
        const right = k === "ox"    ? (m.answer_ox === "O" ? "O (맞다)" : "X (아니다)")
                    : k === "short" ? (m.ans || []).join(" / ")
                    : m.opts[m.answer];
        const mine = k === "ox" ? (m.chosenText === "O" ? "O" : "X") : m.chosenText;
        const pg = m.page ? ` <span class="page-tag">교재 ${m.page}쪽</span>` : "";
        return `<div class="missed-item">
          <div class="mq">${m.q.replace(/<[^>]*>/g, "")}${pg}</div>
          <div><span class="mx">${mine}</span> → <span class="ma">${right}</span></div>
        </div>`;
      }).join("")}
    </div>` : (isRetryRound
        ? `<p style="margin-top:18px;">🎉 틀렸던 문제를 모두 맞혔어요! 완료!</p>`
        : `<p style="margin-top:18px;">🎉 이번 판은 다 맞혔어요!</p>`);

  document.getElementById('quizCard').innerHTML = `
    <div class="result">
      <div class="emoji">${emoji}</div>
      <div class="ring" id="ring">
        <div class="ring-inner">
          <div class="score">${score}/${order.length}</div>
          <div class="pct">${pct}점</div>
        </div>
      </div>
      <p>${comment}</p>
      <div class="btn-row">
        <button class="restart-btn primary" id="restartBtn">새 문제로 다시</button>
        ${missed.length ? `<button class="restart-btn retry" id="retryBtn">${retryLabel}</button>` : ""}
        ${showCombo ? `<button class="restart-btn retry" id="comboBtn">틀린 것 + 누적 오답 ${missed.length + extraWrong.length}문제</button>` : ""}
      </div>
      ${missedHtml}
    </div>`;

  requestAnimationFrame(() => {
    const ring = document.getElementById('ring');
    if(ring) ring.style.setProperty('--p', pct);
  });

  document.getElementById('restartBtn').addEventListener('click', () => startQuiz());

  const bank = currentBank();
  const resolve = m => bank.find(q => q.id === m.id) || bank.find(q => q.q === m.q && q.cat === m.cat)
                    || (() => { const { chosenText, ...rest } = m; return rest; })();

  const retry = document.getElementById('retryBtn');
  if(retry){
    const pool = missed.map(resolve);
    retry.addEventListener('click', () => startQuiz(pool, "retry"));
  }

  const combo = document.getElementById('comboBtn');
  if(combo){
    // 이번 판 오답 + 예전 누적 오답을 합쳐서
    const pool = [...missed.map(resolve),
                  ...extraWrong.map(id => QMAP[id]).filter(Boolean)];
    combo.addEventListener('click', () => startQuiz(pool, "wrongbank"));
  }
}

document.getElementById('modeToggle').querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const m = btn.dataset.mode;
    if(m === quizMode) return;
    quizMode = m;
    document.getElementById('modeToggle').querySelectorAll('.mode-btn')
      .forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    currentFilter = "전체";
    startQuiz();
  });
});

startQuiz();
</script>
